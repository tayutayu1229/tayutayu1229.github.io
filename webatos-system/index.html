<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#708090">
  <title>WebATOS情報配信システム</title>
  <meta name="description" content="ODPTと時刻表データを利用したWebATOS風の東京圏輸送情報モニタ。">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='12' width='64' height='64' fill='%23655bea'/%3E%3Cpath d='M13 16h31v23H13z' fill='none' stroke='white' stroke-width='4'/%3E%3Ccircle cx='46' cy='39' r='9' fill='white'/%3E%3Cpath d='M37 55c2-8 16-8 18 0' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20261006-4">
</head>
<body>
  <header class="system-head">
    <div class="head-actions"><button type="button" class="green" data-screen="station-delay">指定モニタへ</button><button type="button" class="blue" data-screen="top">トップメニューへ</button><button type="button" class="pink" data-action="logout">ログアウト</button></div>
    <div class="identity-grid" aria-label="接続情報">
      <span>主線区</span><span>駅</span><span>ユーザID</span><span>ユーザ名</span><span class="screen-label">画面名</span>
      <b id="head-line">高崎</b><b id="head-station">大　宮</b><b>WEBATOS01</b><b>東京圏輸送情報システム</b><b class="screen-value"><small id="screen-id">SPANSTOP01</small><strong id="screen-name">トップメニュー</strong></b>
    </div>
    <button class="help round" type="button" aria-label="ヘルプ" data-action="help">?</button>
  </header>

  <section class="notice-strip">
    <div class="notice-cell"><b>お知らせ</b><button type="button" class="notice-label" data-action="notices">▤　一　覧</button></div>
    <div class="ticker"><span>WebATOSはODPTと東京圏輸送情報システムの時刻表データを表示します。通信断時は更新をお試しください。</span></div>
    <div class="font-controls"><b>文字サイズ</b><button type="button" data-font="normal">通常</button><button type="button" data-font="large">拡大</button></div>
    <button class="collapse" type="button" data-action="collapse">−</button>
  </section>

  <nav id="main-nav" class="main-nav" aria-label="モニタ選択"></nav>
  <main id="workspace" tabindex="-1"></main>

  <dialog id="modal">
    <form method="dialog" class="dialog-card">
      <button class="dialog-close" aria-label="閉じる">×</button>
      <div id="modal-content"></div>
    </form>
  </dialog>

  <template id="loading-template">
    <div class="loading"><span></span>データを更新しています</div>
  </template>
  <script src="../T-time/private-data-client.js"></script>
  <script src="app.js?v=20261006-4"></script>
</body>
</html>
