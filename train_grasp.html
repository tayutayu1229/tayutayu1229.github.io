<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006149">
  <title>運行把握モニタ - 東京圏輸送情報システム</title>
  <style>
    :root{--green:#007b5a;--green-dark:#006149;--border:#aeb9b4;--line:#d9dfdc;--bg:#eef1ef;--text:#17221e;--muted:#586660;--amber:#e5a11a;--red:#e0443e;font-family:"Noto Sans JP","Yu Gothic UI","Hiragino Kaku Gothic ProN",sans-serif;color:var(--text);background:var(--bg)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);font-size:14px}button,select{font:inherit}a{color:inherit}.skip-link{position:fixed;top:-60px;left:8px;z-index:999;padding:8px;background:#fff}.skip-link:focus{top:8px}
    .system-header{min-height:52px;color:#fff;background:var(--green-dark);border-bottom:3px solid #004b38}.system-header-inner{display:flex;align-items:center;width:min(1500px,100%);min-height:52px;margin:auto;padding:0 14px}.system-name{font-size:16px;font-weight:800}.system-sub{margin-left:14px;color:#cce0d9;font-size:11px}.system-nav{display:flex;align-self:stretch;margin-left:auto}.system-nav a{display:flex;align-items:center;padding:0 13px;border-left:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none}.system-nav a:hover{background:rgba(0,0,0,.16)}.clock{min-width:90px;padding-left:14px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.clock small{display:block;color:#cce0d9;font-size:9px;font-weight:400}
    .page{width:min(1500px,calc(100% - 20px));margin:10px auto 30px}.title-row{display:flex;align-items:center;gap:12px;margin-bottom:7px;padding:8px 10px;border:1px solid var(--border);border-left:5px solid var(--green);background:#fff}.title-row h1{margin:0;font-size:18px}.description{color:var(--muted);font-size:11px}.connection{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--muted);font-size:10px}.connection-dot{width:8px;height:8px;border-radius:50%;background:#14a46a}.connection-dot.loading{background:var(--amber);animation:blink 1s infinite}.connection-dot.error{background:var(--red)}@keyframes blink{50%{opacity:.35}}
    .toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:7px;margin-bottom:7px;padding:7px;border:1px solid var(--border);background:#fff}.field{min-width:165px}.field label{display:block;margin-bottom:3px;color:#46534e;font-size:9px;font-weight:700}.field select{width:100%;height:32px;padding:4px 7px;border:1px solid #94a29c;border-radius:0;background:#fff}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:4px 11px;border:1px solid var(--green-dark);border-radius:0;color:#fff;background:var(--green);font-weight:700;text-decoration:none;cursor:pointer}.btn.secondary{color:#17372d;background:#fff;border-color:#879a92}.btn:disabled{opacity:.55}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:7px;border:1px solid var(--border);background:#fff}.summary-item{padding:7px 10px;border-right:1px solid var(--line)}.summary-item:last-child{border-right:0}.summary-label{color:var(--muted);font-size:9px}.summary-value{margin-top:1px;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.summary-value small{margin-left:2px;font-size:9px;font-weight:400}.summary-value.warning{color:#956000}.summary-value.danger{color:#b72e2a}
    .operations-grid{display:grid;grid-template-columns:minmax(700px,1fr) 360px;gap:7px;align-items:start}.panel{border:1px solid var(--border);background:#fff}.panel-header{display:flex;align-items:center;min-height:36px;padding:5px 9px;border-bottom:1px solid var(--border);background:#f3f5f4}.panel-header h2{margin:0;font-size:12px}.panel-note{margin-left:9px;color:var(--muted);font-size:9px}.legend{display:flex;gap:10px;margin-left:auto}.legend span{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:9px}.legend i{width:18px;height:5px;background:#fff;border:1px solid #7e8b86}.legend i.delay{background:var(--amber);border:0}.legend i.major{background:var(--red);border:0}
    .map-scroll{overflow:auto;background:#17201d}.map-wrap{position:relative;min-width:930px;height:600px}#networkCanvas{display:block;width:100%;height:600px}.map-caption{position:absolute;right:7px;bottom:7px;padding:3px 6px;border:1px solid #5b6964;color:#c8d0cd;background:rgba(18,25,23,.9);font-size:8px}.side-stack{display:grid;gap:7px}.alert-list{max-height:370px;overflow:auto}.alert-row{padding:8px 9px;border-bottom:1px solid var(--line)}.alert-row-head{display:flex;align-items:center;gap:6px}.alert-row strong{font-size:11px}.alert-row time{margin-left:auto;color:var(--muted);font-size:8px}.info-status{padding:1px 4px;color:#8d2b27;background:#ffe4e1;font-size:8px;font-weight:700}.info-status.notice{color:#44524d;background:#e9eeec}.alert-meta{margin-top:4px;color:#47554f;font-size:9px}.alert-row p{margin:4px 0 0;font-size:10px;line-height:1.55}.empty{padding:22px 10px;color:var(--muted);text-align:center;font-size:10px}
    .line-table{width:100%;border-collapse:collapse}.line-table th,.line-table td{padding:5px 6px;border-bottom:1px solid var(--line);font-size:9px;text-align:left}.line-table th{background:#f7f8f7}.status-label{display:inline-block;min-width:45px;padding:1px 3px;color:#166847;background:#e3f2eb;text-align:center;font-size:8px;font-weight:700}.status-label.delay{color:#855500;background:#fff0ce}.status-label.major{color:#942824;background:#ffe1de}.status-label.unknown{color:#596660;background:#e9edeb}.notice{display:none;margin-bottom:7px;padding:7px 9px;border:1px solid #d29490;color:#8c2925;background:#fff1f0;font-size:10px}.notice.show{display:block}.footer{margin-top:7px;padding:6px 2px;color:var(--muted);font-size:8px}
    @media(max-width:1080px){.operations-grid{grid-template-columns:1fr}.side-stack{grid-template-columns:1fr 1fr}}@media(max-width:720px){.system-sub,.clock,.system-nav a:not(.mobile-keep){display:none}.system-name{font-size:13px}.system-nav a{padding:0 9px;font-size:10px}.page{width:calc(100% - 10px);margin-top:5px}.title-row{flex-wrap:wrap}.description{width:100%}.connection{margin-left:0}.field{flex:1}.summary{grid-template-columns:1fr 1fr}.summary-item:nth-child(2){border-right:0}.summary-item:nth-child(-n+2){border-bottom:1px solid var(--line)}.side-stack{grid-template-columns:1fr}.legend{width:100%;margin:3px 0 0}.panel-header{flex-wrap:wrap}}
  </style>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <div id="main-content" style="display:none">
    <header class="system-header">
      <div class="system-header-inner">
        <div class="system-name">東京圏輸送情報システム</div>
        <div class="system-sub">運行把握モニタ</div>
        <nav class="system-nav" aria-label="主要メニュー">
          <a class="mobile-keep" href="train_zai-data.html">列車在線</a>
          <a href="atosweb.html">ATOS Web</a>
          <a href="toppage.html">メインメニュー</a>
        </nav>
        <div class="clock"><span id="clock">--:--:--</span><small id="date">----/--/--</small></div>
      </div>
    </header>

    <main class="page" id="main">
      <div class="title-row">
        <h1>運行把握モニタ</h1>
        <span class="description">東京圏広域路線図・線区別運行状況</span>
        <div class="connection" role="status" aria-live="polite">
          <i class="connection-dot loading" id="connectionDot"></i>
          <span id="connectionText">データ取得中</span>
          <span id="updatedAt"></span>
        </div>
      </div>

      <div class="notice" id="errorNotice" role="alert"></div>

      <div class="toolbar">
        <div class="field">
          <label for="areaFilter">表示範囲</label>
          <select id="areaFilter">
            <option value="all">東京圏全域</option>
            <option value="center">都心部</option>
            <option value="north">北方面</option>
            <option value="east">千葉・常磐方面</option>
            <option value="south">神奈川方面</option>
            <option value="west">多摩方面</option>
          </select>
        </div>
        <div class="field">
          <label for="statusFilter">運行状態</label>
          <select id="statusFilter">
            <option value="all">すべて</option>
            <option value="issue">異常線区のみ</option>
            <option value="normal">平常線区のみ</option>
          </select>
        </div>
        <button class="btn" id="refreshButton" type="button">最新情報に更新</button>
        <a class="btn secondary" href="train_zai-data.html">列車在線を開く</a>
      </div>

      <section class="summary" aria-label="運行概況">
        <div class="summary-item"><div class="summary-label">対象線区</div><div class="summary-value"><span id="lineCount">–</span><small>線区</small></div></div>
        <div class="summary-item"><div class="summary-label">平常運転</div><div class="summary-value"><span id="normalCount">–</span><small>線区</small></div></div>
        <div class="summary-item"><div class="summary-label">遅延・運転変更</div><div class="summary-value warning"><span id="delayCount">–</span><small>線区</small></div></div>
        <div class="summary-item"><div class="summary-label">最大遅延</div><div class="summary-value danger"><span id="maxDelay">–</span><small>分</small></div></div>
      </section>

      <div class="operations-grid">
        <section class="panel">
          <div class="panel-header">
            <h2>東京圏広域路線図</h2>
            <span class="panel-note">線区の運行状態を路線図上に表示</span>
            <div class="legend"><span><i></i>平常</span><span><i class="delay"></i>遅延</span><span><i class="major"></i>運転見合わせ・大幅遅延</span></div>
          </div>
          <div class="map-scroll">
            <div class="map-wrap" id="mapWrap">
              <canvas id="networkCanvas" aria-label="東京圏広域路線図"></canvas>
              <div class="map-caption">路線図は運行把握用の概略図です</div>
            </div>
          </div>
        </section>

        <aside class="side-stack">
          <section class="panel">
            <div class="panel-header"><h2>運行情報</h2><span class="panel-note">異常情報のみ表示</span></div>
            <div class="alert-list" id="alertList"></div>
          </section>
          <section class="panel">
            <div class="panel-header"><h2>線区別状況</h2></div>
            <div style="max-height:340px;overflow:auto">
              <table class="line-table">
                <thead><tr><th>線区</th><th>状態</th><th>遅延本数</th><th>最大</th></tr></thead>
                <tbody id="lineTableBody"></tbody>
              </table>
            </div>
          </section>
        </aside>
      </div>

      <footer class="footer">本画面は運行状況の把握を補助する参考表示です。最終判断は鉄道事業者の公式情報によってください。</footer>
    </main>
  </div>

  <script>
  (() => {
    'use strict';
    const API = '/api/odpt/challenge/';
    const ROUTES = [
      {key:'JR-East.Yamanote',name:'山手線',area:'center',color:'#8cbf26',path:[[45,34],[39,40],[39,51],[47,59],[56,57],[61,48],[58,38],[50,33],[45,34]]},
      {key:'JR-East.KeihinTohokuNegishi',name:'京浜東北・根岸線',area:'south',color:'#00a2bf',path:[[48,8],[48,20],[50,29],[56,37],[56,48],[52,60],[48,68],[43,78],[39,88]]},
      {key:'JR-East.ChuoRapid',name:'中央線快速',area:'west',color:'#ed6a20',path:[[56,48],[45,46],[36,44],[27,45],[18,48],[7,49]]},
      {key:'JR-East.ChuoSobuLocal',name:'中央・総武線各駅停車',area:'east',color:'#e0bb00',path:[[27,47],[38,46],[46,45],[56,44],[67,45],[77,48],[88,50]]},
      {key:'JR-East.Tokaido',name:'東海道線',area:'south',color:'#e88018',path:[[55,50],[51,60],[47,69],[41,79],[32,91],[20,97]]},
      {key:'JR-East.Yokosuka',name:'横須賀線',area:'south',color:'#1768a6',path:[[57,50],[53,61],[44,66],[42,72],[39,80],[47,93]]},
      {key:'JR-East.ShonanShinjuku',name:'湘南新宿ライン',area:'south',color:'#cf2d36',path:[[48,8],[46,22],[44,33],[39,43],[47,58],[43,70],[40,80]]},
      {key:'JR-East.SaikyoKawagoe',name:'埼京・川越線',area:'north',color:'#119b86',path:[[48,8],[45,21],[43,32],[39,43],[46,58]]},
      {key:'JR-East.Utsunomiya',name:'宇都宮線',area:'north',color:'#e8841c',path:[[48,8],[55,1],[65,0],[48,8],[51,22],[56,36],[56,47]]},
      {key:'JR-East.Takasaki',name:'高崎線',area:'north',color:'#e8841c',path:[[48,8],[37,3],[25,1],[48,8],[50,22],[55,36],[55,47]]},
      {key:'JR-East.JobanRapid',name:'常磐線快速',area:'east',color:'#008d5a',path:[[57,36],[65,30],[73,21],[84,10]]},
      {key:'JR-East.JobanLocal',name:'常磐線各駅停車',area:'east',color:'#8965a3',path:[[64,32],[72,23],[80,15]]},
      {key:'JR-East.SobuRapid',name:'総武快速線',area:'east',color:'#1768a6',path:[[57,49],[68,47],[78,48],[89,50]]},
      {key:'JR-East.Keiyo',name:'京葉線',area:'east',color:'#bd2830',path:[[58,52],[68,55],[79,57],[89,64]]},
      {key:'JR-East.Musashino',name:'武蔵野線',area:'east',color:'#e34f23',path:[[23,37],[34,30],[46,20],[59,24],[69,34],[78,47]]},
      {key:'JR-East.Yokohama',name:'横浜線',area:'south',color:'#72ad32',path:[[43,75],[35,69],[27,61],[19,53],[16,48]]},
      {key:'JR-East.Nambu',name:'南武線',area:'west',color:'#e3bd00',path:[[48,68],[41,62],[34,54],[27,45]]},
      {key:'JR-East.Ome',name:'青梅線',area:'west',color:'#ed6a20',path:[[27,45],[16,39],[6,38]]}
    ];
    const STATIONS = [
      ['宇都宮',65,2],['高崎',25,3],['大宮',48,8],['浦和',49,20],['赤羽',48,28],
      ['池袋',43,32],['新宿',39,43],['渋谷',42,51],['品川',51,60],['東京',56,48],['上野',57,36],
      ['立川',27,45],['八王子',18,48],['高尾',7,49],['青梅',16,39],
      ['西船橋',78,48],['千葉',89,50],['成田',90,32],['蘇我',89,64],
      ['取手',73,21],['水戸',84,10],['川崎',48,68],['横浜',43,76],['大船',39,82],['小田原',20,97],['久里浜',47,93]
    ];
    const routeNames = Object.fromEntries(ROUTES.map(route => [route.key, route.name]));
    const state = {stats:new Map(), info:[], area:'all', status:'all'};
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const railwayKey = value => String(value || '').replace('odpt.Railway:','');
    const infoText = item => {
      const value = item?.['odpt:trainInformationText'];
      return typeof value === 'string' ? value : value?.ja || value?.en || '';
    };
    const infoIsIssue = item => {
      const text = infoText(item).replace(/\s/g,'');
      return Boolean(text && !/^(平常運転|通常運転|平常どおり)$/.test(text));
    };
    const infoField = (item,key) => {
      const value=item?.[key];
      return typeof value==='string'?value:value?.ja||value?.en||'';
    };
    const infoLevel = item => {
      if(!infoIsIssue(item))return 'normal';
      const status=infoField(item,'odpt:trainInformationStatus');
      const text=infoText(item);
      if(/運転見合わせ|運転中止/.test(status)||/運転を見合わせ/.test(text))return 'major';
      if(/遅延|運転変更|直通運転中止|一部運休/.test(status)||/遅れ|運休/.test(text))return 'delay';
      return 'notice';
    };
    const officialInfo = key => state.info.find(item => {
      const raw = item['odpt:railway'];
      return (Array.isArray(raw) ? raw : raw ? [raw] : []).some(value => railwayKey(value) === key);
    });
    const severity = route => {
      const stat = state.stats.get(route.key);
      const official=infoLevel(officialInfo(route.key));
      if (official==='major' || stat?.max >= 20) return 'major';
      if (official==='delay' || stat?.max >= 3) return 'delay';
      return stat?.total ? 'normal' : 'unknown';
    };
    const severityLabel = value => value === 'major' ? '異常' : value === 'delay' ? '遅延' : value === 'normal' ? '平常' : '情報なし';

    function aggregate(trains) {
      const result = new Map();
      trains.forEach(train => {
        const key = railwayKey(train['odpt:railway']);
        if (!result.has(key)) result.set(key,{total:0,delayed:0,max:0});
        const item = result.get(key);
        const delay = Math.max(0,Math.floor((Number(train['odpt:delay'])||0)/60));
        item.total++; if (delay > 0) item.delayed++; item.max = Math.max(item.max,delay);
      });
      return result;
    }

    function visibleRoutes() {
      return ROUTES.filter(route => {
        const sev = severity(route);
        const areaMatch = state.area === 'all' || route.area === state.area || (state.area === 'center' && ['center'].includes(route.area));
        const statusMatch = state.status === 'all' || (state.status === 'issue' && ['delay','major'].includes(sev)) || (state.status === 'normal' && sev === 'normal');
        return areaMatch && statusMatch;
      });
    }

    function drawMap() {
      const canvas = $('networkCanvas');
      const wrap = $('mapWrap');
      const width = Math.max(900,wrap.clientWidth);
      const height = 590;
      const dpr = Math.min(window.devicePixelRatio || 1,2);
      canvas.width = width*dpr; canvas.height = height*dpr;
      canvas.style.width = width+'px'; canvas.style.height = height+'px';
      const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
      ctx.fillStyle='#17201d'; ctx.fillRect(0,0,width,height);
      ctx.strokeStyle='#29332f'; ctx.lineWidth=1;
      for(let x=30;x<width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,height);ctx.stroke();}
      for(let y=30;y<height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y);ctx.stroke();}
      const px = p => [35 + p[0]*(width-70)/100, 18 + p[1]*(height-36)/100];
      const shown = new Set(visibleRoutes().map(route=>route.key));
      ROUTES.forEach(route => {
        const visible=shown.has(route.key), sev=severity(route);
        ctx.beginPath();
        route.path.forEach((point,index)=>{const [x,y]=px(point);index?ctx.lineTo(x,y):ctx.moveTo(x,y);});
        ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=visible?7:3;
        ctx.strokeStyle=!visible?'#48534f':sev==='major'?'#e0443e':sev==='delay'?'#e5a11a':sev==='unknown'?'#69736f':'#ffffff';
        ctx.globalAlpha=visible?1:.28;ctx.stroke();ctx.globalAlpha=1;
      });
      STATIONS.forEach(([name,xv,yv])=>{
        const [x,y]=px([xv,yv]);
        ctx.fillStyle='#17201d';ctx.strokeStyle='#f4f7f6';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(x,y,4.2,0,Math.PI*2);ctx.fill();ctx.stroke();
        ctx.font='600 11px "Noto Sans JP","Yu Gothic",sans-serif';
        ctx.textAlign=xv>84?'right':'left';ctx.textBaseline='bottom';ctx.fillStyle='#f5f7f6';
        ctx.fillText(name,x+(xv>84?-7:7),y-5);
      });
    }

    function render() {
      const routes = visibleRoutes();
      const counts={normal:0,delay:0,major:0,unknown:0};
      ROUTES.forEach(route=>counts[severity(route)]++);
      $('lineCount').textContent=ROUTES.length;
      $('normalCount').textContent=counts.normal;
      $('delayCount').textContent=counts.delay+counts.major;
      $('maxDelay').textContent=Math.max(0,...ROUTES.map(route=>state.stats.get(route.key)?.max||0));
      $('lineTableBody').innerHTML=routes.map(route=>{
        const stat=state.stats.get(route.key),sev=severity(route);
        return `<tr><td>${esc(route.name)}</td><td><span class="status-label ${sev}">${severityLabel(sev)}</span></td><td>${stat?`${stat.delayed}/${stat.total}`:'—'}</td><td>${stat?`${stat.max}分`:'—'}</td></tr>`;
      }).join('')||'<tr><td colspan="4" class="empty">該当線区なし</td></tr>';
      const alerts=state.info.filter(infoIsIssue).map(item=>{
        const raw=item['odpt:railway'];const keys=(Array.isArray(raw)?raw:raw?[raw]:[]).map(railwayKey);
        const names=keys.map(key=>routeNames[key]).filter(Boolean);if(!names.length)return null;
        return {name:names.join('・'),text:infoText(item),time:item['dc:date'],status:infoField(item,'odpt:trainInformationStatus')||'お知らせ',cause:infoField(item,'odpt:trainInformationCause'),range:infoField(item,'odpt:trainInformationRange'),direction:directionLabel(item['odpt:railDirection'])};
      }).filter(Boolean);
      $('alertList').innerHTML=alerts.length?alerts.map(item=>`<div class="alert-row"><div class="alert-row-head"><strong>${esc(item.name)}</strong><span class="info-status ${item.status==='お知らせ'?'notice':''}">${esc(item.status)}</span><time>${item.time?new Date(item.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):''}</time></div>${item.cause||item.range||item.direction?`<div class="alert-meta">${item.cause?`原因：${esc(item.cause)}　`:''}${item.range?`区間：${esc(item.range)}　`:''}${item.direction?`方向：${esc(item.direction)}`:''}</div>`:''}<p>${esc(item.text)}</p></div>`).join(''):'<div class="empty">対象線区に異常情報はありません。</div>';
      drawMap();
    }
    function directionLabel(value){const key=String(value||'').split(':').pop();return {BothDirections:'上下線',Inbound:'上り',Outbound:'下り',InnerLoop:'内回り',OuterLoop:'外回り',Northbound:'北行',Southbound:'南行',Eastbound:'東行',Westbound:'西行'}[key]||'';}

    async function request(path) {
      const response=await fetch(API+path,{headers:{Accept:'application/json'},cache:'no-store'});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      return response.json();
    }
    async function refresh() {
      $('refreshButton').disabled=true;$('connectionDot').className='connection-dot loading';$('connectionText').textContent='更新中';$('errorNotice').classList.remove('show');
      try {
        const [trains,info]=await Promise.all([
          request('odpt:Train?odpt:operator=odpt.Operator:JR-East'),
          request('odpt:TrainInformation?odpt:operator=odpt.Operator:jre-is').catch(()=>[])
        ]);
        state.stats=aggregate(Array.isArray(trains)?trains:[]);state.info=Array.isArray(info)?info:[];
        render();$('connectionDot').className='connection-dot';$('connectionText').textContent='接続中';$('updatedAt').textContent=new Date().toLocaleTimeString('ja-JP')+'更新';
      } catch(error) {
        console.error(error);$('connectionDot').className='connection-dot error';$('connectionText').textContent='取得エラー';$('errorNotice').textContent='運行データを取得できませんでした。';$('errorNotice').classList.add('show');render();
      } finally {$('refreshButton').disabled=false;}
    }
    function tick(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('ja-JP');$('date').textContent=now.toLocaleDateString('ja-JP');}
    $('areaFilter').addEventListener('change',e=>{state.area=e.target.value;render();});
    $('statusFilter').addEventListener('change',e=>{state.status=e.target.value;render();});
    $('refreshButton').addEventListener('click',refresh);
    window.addEventListener('resize',()=>requestAnimationFrame(drawMap));
    tick();setInterval(tick,1000);refresh();setInterval(refresh,60000);
  })();
  </script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="auth_guard.js"></script>
</body>
</html>
