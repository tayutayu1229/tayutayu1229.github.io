<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <div id="main-content" style="display:none">
    <header class="system-header">
      <div class="system-header-inner">
        <div class="system-name">東京圏輸送情報システム</div>
        <div class="system-sub">運行把握モニタ</div>
        <nav class="system-nav" aria-label="主要メニュー">
          <a class="mobile-keep" href="train_zai-data.html">列車在線</a>
          <a href="atosweb.html">ATOS Web</a>
          <a href="toppage.html">メインメニュー</a>
        </nav>
        <div class="clock"><span id="clock">--:--:--</span><small id="date">----/--/--</small></div>
      </div>
    </header>

    <main class="page" id="main">
      <div class="title-row">
        <h1>運行把握モニタ</h1>
        <span class="description">線区別運行表示盤・東京近郊路線図</span>
        <div class="connection" role="status" aria-live="polite">
          <i class="connection-dot loading" id="connectionDot"></i>
          <span id="connectionText">データ取得中</span><span id="updatedAt"></span>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="表示切替">
        <button class="tab" id="boardTab" role="tab" aria-selected="true" aria-controls="boardPanel">運行表示盤</button>
        <button class="tab" id="mapTab" role="tab" aria-selected="false" aria-controls="mapPanel">公式路線図</button>
      </div>

      <section class="tab-panel" id="boardPanel" role="tabpanel" aria-labelledby="boardTab">
        <div class="notice-box" id="errorNotice" role="alert"></div>
        <div class="toolbar">
          <div class="field grow"><label for="searchInput">線区検索</label><input id="searchInput" type="search" placeholder="線区名・区間・原因"></div>
          <div class="field"><label for="statusFilter">運行状態</label><select id="statusFilter"><option value="all">すべて</option><option value="issue">遅延・運転見合わせ</option><option value="official">公式情報あり</option><option value="normal">平常運転</option></select></div>
          <button class="btn" id="refreshButton" type="button">最新情報に更新</button>
          <a class="btn secondary" href="train_zai-data.html">列車在線を開く</a>
        </div>

        <section class="summary" aria-label="運行概況">
          <div class="summary-item"><div class="summary-label">対象線区</div><div class="summary-value"><span id="lineCount">–</span><small>線区</small></div></div>
          <div class="summary-item"><div class="summary-label">平常運転</div><div class="summary-value"><span id="normalCount">–</span><small>線区</small></div></div>
          <div class="summary-item"><div class="summary-label">遅延・運転変更</div><div class="summary-value warn"><span id="delayCount">–</span><small>線区</small></div></div>
          <div class="summary-item"><div class="summary-label">運転見合わせ</div><div class="summary-value danger"><span id="majorCount">–</span><small>線区</small></div></div>
          <div class="summary-item"><div class="summary-label">お知らせ</div><div class="summary-value info"><span id="noticeCount">–</span><small>線区</small></div></div>
        </section>
        <section class="visual-monitor" id="visualMonitor" aria-label="選択線区の運行状況"></section>
        <div class="incident-selector" id="incidentSelector" aria-label="異常線区の選択"></div>
        <details class="today-history" id="todayHistory">
          <summary>本日の運行情報変更履歴（この端末） <span id="historyCount">0件</span></summary>
          <ul class="history-list" id="historyList"></ul>
        </details>
        <div class="board" id="operationsBoard"></div>
      </section>

      <section class="tab-panel" id="mapPanel" role="tabpanel" aria-labelledby="mapTab" hidden>
        <div class="map-panel">
          <div class="map-head"><h2>JR東日本 東京近郊路線図</h2><p>正確な駅・接続関係はこちらで確認できます</p><a href="https://www.jreast.co.jp/map/pdf/map_tokyo.pdf" target="_blank" rel="noopener">別画面で開く</a></div>
          <object class="map-frame" data="https://www.jreast.co.jp/map/pdf/map_tokyo.pdf#view=FitH" type="application/pdf">
            <div class="map-fallback">路線図を表示できませんでした。<a href="https://www.jreast.co.jp/map/pdf/map_tokyo.pdf" target="_blank" rel="noopener">JR東日本の路線図を開く</a></div>
          </object>
        </div>
      </section>
      <footer class="footer">運行表示盤はアイステ運行情報と在線列車データを使用した参考表示です。最終判断は鉄道事業者の公式情報によってください。</footer>
    </main>
  </div>

      'JR-East.JobanLocal':['綾瀬','亀有','金町','松戸','柏','我孫子','取手'],
      'JR-East.Kawagoe':['大宮','日進','西大宮','指扇','南古谷','川越','高麗川'],
      'JR-East.Hachiko':['八王子','拝島','東飯能','高麗川','小川町','寄居','高崎'],
      'JR-East.Yamanote':['東京','上野','田端','池袋','新宿','渋谷','品川','東京'],
      'JR-East.KeihinTohokuNegishi':['大宮','浦和','赤羽','上野','東京','品川','川崎','横浜','大船'],
      'JR-East.ChuoRapid':['東京','御茶ノ水','新宿','中野','三鷹','国分寺','立川','八王子','高尾'],
      'JR-East.ChuoSobuLocal':['三鷹','中野','新宿','御茶ノ水','秋葉原','錦糸町','西船橋','千葉'],
      'JR-East.SaikyoKawagoe':['川越','大宮','武蔵浦和','赤羽','池袋','新宿','渋谷','大崎'],
      'JR-East.ShonanShinjuku':['大宮','赤羽','池袋','新宿','渋谷','武蔵小杉','横浜','戸塚','大船'],
      'JR-East.Chuo':['高尾','大月','甲府','小淵沢','塩尻','松本'],
      'JR-East.Ome':['立川','拝島','青梅','御嶽','奥多摩'],
      'JR-East.Itsukaichi':['拝島','熊川','東秋留','秋川','武蔵増戸','武蔵五日市'],
      'JR-East.Nambu':['川崎','武蔵小杉','武蔵溝ノ口','登戸','府中本町','立川'],
      'JR-East.Yokohama':['東神奈川','新横浜','長津田','町田','橋本','八王子'],
      'JR-East.Sagami':['茅ケ崎','寒川','海老名','入谷','橋本'],
      'JR-East.SobuRapid':['東京','錦糸町','新小岩','市川','船橋','津田沼','稲毛','千葉'],
      'JR-East.Sobu':['千葉','都賀','四街道','佐倉','八街','成東','旭','銚子'],
      'JR-East.Narita':['千葉','佐倉','酒々井','成田','空港第2ビル','成田空港'],
      'JR-East.Keiyo':['東京','八丁堀','新木場','舞浜','新浦安','海浜幕張','南船橋','蘇我'],
      'JR-East.Musashino':['府中本町','西国分寺','北朝霞','武蔵浦和','南浦和','新松戸','西船橋'],
      'JR-East.Uchibo':['千葉','蘇我','五井','木更津','君津','館山','安房鴨川'],
      'JR-East.Sotobo':['千葉','蘇我','大網','茂原','上総一ノ宮','勝浦','安房鴨川'],
      'JR-East.Tokaido':['東京','新橋','品川','川崎','横浜','戸塚','大船','藤沢','茅ケ崎','平塚','小田原','熱海'],
      'JR-East.Yokosuka':['東京','新橋','品川','西大井','武蔵小杉','新川崎','横浜','戸塚','大船','鎌倉','逗子','久里浜'],
      'JR-East.SotetsuDirect':['新宿','渋谷','大崎','武蔵小杉','羽沢横浜国大','西谷','二俣川','大和','海老名']
    };
    const HISTORY_KEY='train_history_content_based';
    const state={stats:new Map(),info:[],query:'',filter:'all',selectedKey:'JR-East.Yamanote'};
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const railwayKey=value=>String(value||'').replace('odpt.Railway:','');
    const infoField=(item,key)=>{const value=item?.[key];return typeof value==='string'?value:value?.ja||value?.en||'';};
    const infoText=item=>infoField(item,'odpt:trainInformationText');
    const isNormalInfo=item=>/^(平常運転|通常運転|平常どおり)$/.test(infoText(item).replace(/\s/g,''));
    const officialInfo=key=>state.info.find(item=>{const raw=item['odpt:railway'];return (Array.isArray(raw)?raw:raw?[raw]:[]).some(value=>railwayKey(value)===key);});
    const directionLabel=value=>({BothDirections:'上下線',Inbound:'上り',Outbound:'下り',InnerLoop:'内回り',OuterLoop:'外回り',Northbound:'北行',Southbound:'南行',Eastbound:'東行',Westbound:'西行'}[String(value||'').split(':').pop()]||'—');
    const lineByKey=key=>LINES.find(line=>line[0]===key);
    const localDay=value=>{const date=new Date(value);if(Number.isNaN(date.getTime()))return'';return`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;};
    const todayKey=()=>localDay(new Date());
    function readTodayHistory(){
      let store={};try{store=JSON.parse(localStorage.getItem(HISTORY_KEY)||'{}');}catch(error){console.warn(error);}
      const today=todayKey(),cleaned={};
      Object.entries(store).forEach(([key,entries])=>{const keep=(Array.isArray(entries)?entries:[]).filter(entry=>localDay(entry.date)===today);if(keep.length)cleaned[key]=keep.slice(0,30);});
      localStorage.setItem(HISTORY_KEY,JSON.stringify(cleaned));return cleaned;
    }
    function saveTodayHistory(data){
      const store=readTodayHistory();
      (Array.isArray(data)?data:[]).forEach(item=>{
        const raw=item['odpt:railway'];const keys=(Array.isArray(raw)?raw:raw?[raw]:[]);
        keys.forEach(id=>{
          const date=item['dc:date']||new Date().toISOString();if(localDay(date)!==todayKey())return;
          const entry={date,text:infoText(item),status:infoField(item,'odpt:trainInformationStatus')||'平常運転',cause:infoField(item,'odpt:trainInformationCause'),range:infoField(item,'odpt:trainInformationRange'),direction:directionLabel(item['odpt:railDirection'])};
          if(!entry.text)return;if(!store[id])store[id]=[];
          const last=store[id][0];if(!last||last.text!==entry.text||last.status!==entry.status)store[id].unshift(entry);
          store[id]=store[id].slice(0,30);
        });
      });
      localStorage.setItem(HISTORY_KEY,JSON.stringify(store));return store;
    }

    function statusFor(line){
      const [key]=line,stat=state.stats.get(key),info=officialInfo(key);
      if(info&&!isNormalInfo(info)){
        const status=infoField(info,'odpt:trainInformationStatus')||'お知らせ',text=infoText(info);
        if(/運転見合わせ|運転中止/.test(status)||/運転を見合わせ/.test(text))return{level:'major',label:status,info,stat};
        if(/遅延|運転変更|直通運転中止|一部運休/.test(status)||/遅れ|運休/.test(text))return{level:'delay',label:status,info,stat};
        return{level:'notice',label:status,info,stat};
      }
      if(stat?.max>=20)return{level:'major',label:'大幅遅延',info,stat};
      if(stat?.max>=3)return{level:'delay',label:'遅延',info,stat};
      if(stat?.total||info)return{level:'normal',label:'平常運転',info,stat};
      return{level:'unknown',label:'情報なし',info:null,stat:null};
    }
    function aggregate(trains){
      const result=new Map();
      (Array.isArray(trains)?trains:[]).forEach(train=>{
        const key=railwayKey(train['odpt:railway']);if(!result.has(key))result.set(key,{total:0,delayed:0,max:0});
        const item=result.get(key),delay=Math.max(0,Math.floor((Number(train['odpt:delay'])||0)/60));
        item.total++;if(delay>0)item.delayed++;item.max=Math.max(item.max,delay);
      });
      return result;
    }
    function affectedSegment(range,stations,level){
      if(level==='normal')return[0,stations.length-2];
      const cleaned=String(range||'').replace(/（.*?）/g,'').replace(/駅間|駅|方面|全線/g,'').trim();
      if(!cleaned)return[0,stations.length-2];
      const parts=cleaned.split(/[〜～\-－]/).map(value=>value.trim()).filter(Boolean);
      const indexes=parts.map(part=>stations.findIndex(station=>part.includes(station)||station.includes(part))).filter(index=>index>=0);
      if(indexes.length>=2)return[Math.min(...indexes),Math.max(...indexes)-1];
      if(indexes.length===1)return[Math.max(0,indexes[0]-1),Math.min(stations.length-2,indexes[0])];
      return[0,stations.length-2];
    }
    function renderVisualMonitor(){
      const line=lineByKey(state.selectedKey)||LINES[0],status=statusFor(line),info=status.info,stations=STATION_SEQUENCES[line[0]]||[line[3].split('－')[0],line[3].split('－').pop()];
      const range=infoField(info,'odpt:trainInformationRange')||line[3],cause=infoField(info,'odpt:trainInformationCause')||'—',direction=info?directionLabel(info['odpt:railDirection']):'—';
      const message=infoText(info)||(status.stat?`在線列車 ${status.stat.total}本、遅延列車 ${status.stat.delayed}本、最大遅延 ${status.stat.max}分です。`:'現在の運行情報はありません。');
      const [start,end]=affectedSegment(range,stations,status.level);
      const activeColor=status.level==='major'?'var(--red)':status.level==='delay'?'var(--amber)':status.level==='notice'?'var(--blue)':line[4];
      const diagram=stations.map((station,index)=>{
        const stationHtml=`<div class="diagram-station ${index===0||index===stations.length-1?'major':''}"><span class="station-node"></span><span class="station-label">${esc(station)}</span></div>`;
        if(index===stations.length-1)return stationHtml;
        const active=status.level==='normal'||(index>=start&&index<=end);
        return stationHtml+`<span class="diagram-segment ${active?'active':''}" style="--active-color:${activeColor}"></span>`;
      }).join('');
      $('visualMonitor').innerHTML=`<aside class="visual-info" style="--route-color:${line[4]}"><div class="visual-line-head"><h2>${esc(line[2])}</h2><p>${esc(line[3])}</p></div><div class="visual-state ${status.level}">${esc(status.label)}</div><dl class="visual-meta"><dt>区間</dt><dd>${esc(range)}</dd><dt>方向</dt><dd>${esc(direction)}</dd><dt>原因</dt><dd>${esc(cause)}</dd></dl><div class="visual-message">${esc(message)}</div><div class="visual-updated">${info?.['dc:date']?new Date(info['dc:date']).toLocaleString('ja-JP'):'在線データから判定'}</div></aside><div class="diagram-area"><span class="diagram-watermark">線区・支障区間表示</span><div class="line-diagram">${diagram}</div><div class="diagram-caption">${status.level==='normal'?'通常時は線区カラーで表示':'支障区間を強調表示／その他の区間はグレー表示'}</div></div>`;
      renderTodayHistory(line[0]);
    }
    function renderIncidentSelector(){
      const incidents=LINES.map(line=>({line,status:statusFor(line)})).filter(item=>['major','delay','notice'].includes(item.status.level));
      if(incidents.length&&!incidents.some(item=>item.line[0]===state.selectedKey))state.selectedKey=incidents[0].line[0];
      $('incidentSelector').innerHTML=incidents.length?incidents.map(({line,status})=>`<button class="incident-btn ${status.level} ${line[0]===state.selectedKey?'active':''}" type="button" data-select-line="${esc(line[0])}"><strong>${esc(line[2])}</strong><span>${esc(status.label)}${infoField(status.info,'odpt:trainInformationCause')?`／${esc(infoField(status.info,'odpt:trainInformationCause'))}`:''}</span></button>`).join(''):'<div class="incident-empty">現在、対象線区に異常情報はありません。</div>';
    }
    function renderTodayHistory(key){
      const entries=readTodayHistory()[`odpt.Railway:${key}`]||[];
      $('historyCount').textContent=`${entries.length}件`;
      $('historyList').innerHTML=entries.length?entries.map(entry=>`<li class="history-row"><time>${new Date(entry.date).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}</time><strong>${esc(entry.status)}</strong><span>${esc(entry.text)}</span></li>`).join(''):'<li class="empty">本日の変更履歴はありません。</li>';
    }
    function detailHtml(line,status){
      const info=status.info,stat=status.stat;
      const cause=infoField(info,'odpt:trainInformationCause')||'—';
      const range=infoField(info,'odpt:trainInformationRange')||line[3];
      const direction=info?directionLabel(info['odpt:railDirection']):'—';
      const time=info?.['odpt:timeOfOrigin']?new Date(info['odpt:timeOfOrigin']).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'—';
      const message=infoText(info)||(stat?`在線列車 ${stat.total}本、遅延列車 ${stat.delayed}本、最大遅延 ${stat.max}分です。`:'運行情報はありません。');
      return `<div class="route-detail"><div class="detail-cell"><label>原因</label><strong>${esc(cause)}</strong></div><div class="detail-cell"><label>対象区間</label><strong>${esc(range)}</strong></div><div class="detail-cell"><label>方向</label><strong>${esc(direction)}</strong></div><div class="detail-cell"><label>発生・情報時刻</label><strong>${esc(time)}</strong></div><div class="detail-message">${esc(message)}</div></div>`;
    }
    function routeHtml(line){
      const [key,code,name,range,color]=line,status=statusFor(line),stat=status.stat;
      const searchable=[name,range,infoField(status.info,'odpt:trainInformationCause'),infoField(status.info,'odpt:trainInformationRange'),infoText(status.info)].join(' ').toLowerCase();
      const visible=(!state.query||searchable.includes(state.query))&&(state.filter==='all'||(state.filter==='issue'&&['delay','major'].includes(status.level))||(state.filter==='official'&&status.info&&!isNormalInfo(status.info))||(state.filter==='normal'&&status.level==='normal'));
      return `<details class="route-item ${status.level}" style="--route-color:${color}" data-level="${status.level}" data-line-key="${esc(key)}" ${visible?'':'hidden'}><summary><span class="route-code">${esc(code)}</span><span class="route-name"><strong>${esc(name)}</strong><small>${esc(key.replace('JR-East.',''))}</small></span><span class="route-range">${esc(range)}</span><span class="route-status ${status.level}">${esc(status.label)}</span><span class="route-delay">${stat?`最大 ${stat.max}分`:'—'}</span></summary>${detailHtml(line,status)}</details>`;
    }
    function render(){
      $('operationsBoard').innerHTML=REGIONS.map(region=>{
        const rows=region.lines.map(routeHtml).join('');
        return `<section class="region ${region.wide?'wide':''}"><div class="region-header"><h2>${esc(region.name)}</h2><span>${esc(region.note)}</span></div><div class="route-list">${rows}</div></section>`;
      }).join('');
      const counts={normal:0,delay:0,major:0,notice:0,unknown:0};LINES.forEach(line=>counts[statusFor(line).level]++);
      $('lineCount').textContent=LINES.length;$('normalCount').textContent=counts.normal;$('delayCount').textContent=counts.delay;$('majorCount').textContent=counts.major;$('noticeCount').textContent=counts.notice;
      renderIncidentSelector();renderVisualMonitor();
    }
    async function request(path){
      const response=await fetch(API+path,{headers:{Accept:'application/json'},cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json();
    }
    async function refresh(){
      $('refreshButton').disabled=true;$('connectionDot').className='connection-dot loading';$('connectionText').textContent='更新中';$('errorNotice').classList.remove('show');
      try{
        const [trains,info]=await Promise.all([request('odpt:Train?odpt:operator=odpt.Operator:JR-East'),request('odpt:TrainInformation?odpt:operator=odpt.Operator:jre-is').catch(()=>[])]);
        state.stats=aggregate(trains);state.info=Array.isArray(info)?info:[];saveTodayHistory(state.info);render();
        $('connectionDot').className='connection-dot';$('connectionText').textContent='接続中';$('updatedAt').textContent=new Date().toLocaleTimeString('ja-JP')+'更新';
      }catch(error){
        console.error(error);$('connectionDot').className='connection-dot error';$('connectionText').textContent='取得エラー';$('errorNotice').textContent='運行データを取得できませんでした。';$('errorNotice').classList.add('show');render();
      }finally{$('refreshButton').disabled=false;}
    }
    function switchTab(name){
      const board=name==='board';$('boardTab').setAttribute('aria-selected',String(board));$('mapTab').setAttribute('aria-selected',String(!board));$('boardPanel').hidden=!board;$('mapPanel').hidden=board;
    }
    $('boardTab').addEventListener('click',()=>switchTab('board'));$('mapTab').addEventListener('click',()=>switchTab('map'));
    let searchTimer;$('searchInput').addEventListener('input',event=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.query=event.target.value.trim().toLowerCase();render();},100);});
    $('statusFilter').addEventListener('change',event=>{state.filter=event.target.value;render();});$('refreshButton').addEventListener('click',refresh);
    $('incidentSelector').addEventListener('click',event=>{const button=event.target.closest('[data-select-line]');if(!button)return;state.selectedKey=button.dataset.selectLine;renderIncidentSelector();renderVisualMonitor();});
    $('operationsBoard').addEventListener('click',event=>{const item=event.target.closest('[data-line-key]');if(!item)return;state.selectedKey=item.dataset.lineKey;renderIncidentSelector();renderVisualMonitor();$('visualMonitor').scrollIntoView({behavior:'smooth',block:'start'});});
    function tick(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('ja-JP');$('date').textContent=now.toLocaleDateString('ja-JP');}
    tick();setInterval(tick,1000);refresh();setInterval(refresh,60000);
  })();
  </script>
