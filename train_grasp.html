<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006149">
  <title>運行把握モニタ - 東京圏輸送情報システム</title>
  <link rel="stylesheet" href="train_dashboard.css">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <div id="main-content" style="display:none">
    <header class="system-header">
      <div class="system-header-inner">
        <div class="system-name">東京圏輸送情報システム</div>
        <div class="system-sub">運行把握モニタ</div>
        <nav class="system-nav" aria-label="主要メニュー">
          <a class="mobile-keep" href="train_zai-data.html">列車在線</a>
          <a href="atosweb.html">ATOS Web</a>
          <a href="toppage.html">メインメニュー</a>
        </nav>
        <div class="clock"><span id="clock">--:--:--</span><small id="date">----/--/--</small></div>
      </div>
    </header>

    <main class="page" id="main">
      <div class="title-row">
        <h1>運行把握モニタ</h1>
        <span class="description">東京圏広域路線図・線区別運行状況</span>
        <div class="connection" role="status" aria-live="polite">
          <i class="connection-dot loading" id="connectionDot"></i>
          <span id="connectionText">データ取得中</span>
          <span id="updatedAt"></span>
        </div>
      </div>

      <div class="notice" id="errorNotice" role="alert"></div>

      <div class="toolbar">
        <div class="field">
          <label for="areaFilter">表示範囲</label>
          <select id="areaFilter">
            <option value="all">東京圏全域</option>
            <option value="center">都心部</option>
            <option value="north">北方面</option>
            <option value="east">千葉・常磐方面</option>
            <option value="south">神奈川方面</option>
            <option value="west">多摩方面</option>
          </select>
        </div>
        <div class="field">
          <label for="statusFilter">運行状態</label>
          <select id="statusFilter">
            <option value="all">すべて</option>
            <option value="issue">異常線区のみ</option>
            <option value="normal">平常線区のみ</option>
          </select>
        </div>
        <button class="btn" id="refreshButton" type="button">最新情報に更新</button>
        <a class="btn secondary" href="train_zai-data.html">列車在線を開く</a>
      </div>

      <section class="summary" aria-label="運行概況">
        <div class="summary-item"><div class="summary-label">対象線区</div><div class="summary-value"><span id="lineCount">–</span><small>線区</small></div></div>
        <div class="summary-item"><div class="summary-label">平常運転</div><div class="summary-value"><span id="normalCount">–</span><small>線区</small></div></div>
        <div class="summary-item"><div class="summary-label">遅延・運転変更</div><div class="summary-value warning"><span id="delayCount">–</span><small>線区</small></div></div>
        <div class="summary-item"><div class="summary-label">最大遅延</div><div class="summary-value danger"><span id="maxDelay">–</span><small>分</small></div></div>
      </section>

      <div class="operations-grid">
        <section class="panel">
          <div class="panel-header">
            <h2>東京圏広域路線図</h2>
            <span class="panel-note">線区の運行状態を路線図上に表示</span>
            <div class="legend"><span><i></i>平常</span><span><i class="delay"></i>遅延</span><span><i class="major"></i>運転見合わせ・大幅遅延</span></div>
          </div>
          <div class="map-scroll">
            <div class="map-wrap" id="mapWrap">
              <canvas id="networkCanvas" aria-label="東京圏広域路線図"></canvas>
              <div class="map-caption">路線図は運行把握用の概略図です</div>
            </div>
          </div>
        </section>

        <aside class="side-stack">
          <section class="panel">
            <div class="panel-header"><h2>運行情報</h2><span class="panel-note">異常情報のみ表示</span></div>
            <div class="alert-list" id="alertList"></div>
          </section>
          <section class="panel">
            <div class="panel-header"><h2>線区別状況</h2></div>
            <div style="max-height:340px;overflow:auto">
              <table class="line-table">
                <thead><tr><th>線区</th><th>状態</th><th>遅延本数</th><th>最大</th></tr></thead>
                <tbody id="lineTableBody"></tbody>
              </table>
            </div>
          </section>
        </aside>
      </div>

      <footer class="footer">本画面は運行状況の把握を補助する参考表示です。最終判断は鉄道事業者の公式情報によってください。</footer>
    </main>
  </div>

  <script>
  (() => {
    'use strict';
    const API = '/api/odpt/challenge/';
    const ROUTES = [
      {key:'JR-East.Yamanote',name:'山手線',area:'center',color:'#8cbf26',path:[[45,34],[39,40],[39,51],[47,59],[56,57],[61,48],[58,38],[50,33],[45,34]]},
      {key:'JR-East.KeihinTohokuNegishi',name:'京浜東北・根岸線',area:'south',color:'#00a2bf',path:[[48,8],[48,20],[50,29],[56,37],[56,48],[52,60],[48,68],[43,78],[39,88]]},
      {key:'JR-East.ChuoRapid',name:'中央線快速',area:'west',color:'#ed6a20',path:[[56,48],[45,46],[36,44],[27,45],[18,48],[7,49]]},
      {key:'JR-East.ChuoSobuLocal',name:'中央・総武線各駅停車',area:'east',color:'#e0bb00',path:[[27,47],[38,46],[46,45],[56,44],[67,45],[77,48],[88,50]]},
      {key:'JR-East.Tokaido',name:'東海道線',area:'south',color:'#e88018',path:[[55,50],[51,60],[47,69],[41,79],[32,91],[20,97]]},
      {key:'JR-East.Yokosuka',name:'横須賀線',area:'south',color:'#1768a6',path:[[57,50],[53,61],[44,66],[42,72],[39,80],[47,93]]},
      {key:'JR-East.ShonanShinjuku',name:'湘南新宿ライン',area:'south',color:'#cf2d36',path:[[48,8],[46,22],[44,33],[39,43],[47,58],[43,70],[40,80]]},
      {key:'JR-East.SaikyoKawagoe',name:'埼京・川越線',area:'north',color:'#119b86',path:[[48,8],[45,21],[43,32],[39,43],[46,58]]},
      {key:'JR-East.Utsunomiya',name:'宇都宮線',area:'north',color:'#e8841c',path:[[48,8],[55,1],[65,0],[48,8],[51,22],[56,36],[56,47]]},
      {key:'JR-East.Takasaki',name:'高崎線',area:'north',color:'#e8841c',path:[[48,8],[37,3],[25,1],[48,8],[50,22],[55,36],[55,47]]},
      {key:'JR-East.JobanRapid',name:'常磐線快速',area:'east',color:'#008d5a',path:[[57,36],[65,30],[73,21],[84,10]]},
      {key:'JR-East.JobanLocal',name:'常磐線各駅停車',area:'east',color:'#8965a3',path:[[64,32],[72,23],[80,15]]},
      {key:'JR-East.SobuRapid',name:'総武快速線',area:'east',color:'#1768a6',path:[[57,49],[68,47],[78,48],[89,50]]},
      {key:'JR-East.Keiyo',name:'京葉線',area:'east',color:'#bd2830',path:[[58,52],[68,55],[79,57],[89,64]]},
      {key:'JR-East.Musashino',name:'武蔵野線',area:'east',color:'#e34f23',path:[[23,37],[34,30],[46,20],[59,24],[69,34],[78,47]]},
      {key:'JR-East.Yokohama',name:'横浜線',area:'south',color:'#72ad32',path:[[43,75],[35,69],[27,61],[19,53],[16,48]]},
      {key:'JR-East.Nambu',name:'南武線',area:'west',color:'#e3bd00',path:[[48,68],[41,62],[34,54],[27,45]]},
      {key:'JR-East.Ome',name:'青梅線',area:'west',color:'#ed6a20',path:[[27,45],[16,39],[6,38]]}
    ];
    const STATIONS = [
      ['宇都宮',65,2],['高崎',25,3],['大宮',48,8],['浦和',49,20],['赤羽',48,28],
      ['池袋',43,32],['新宿',39,43],['渋谷',42,51],['品川',51,60],['東京',56,48],['上野',57,36],
      ['立川',27,45],['八王子',18,48],['高尾',7,49],['青梅',16,39],
      ['西船橋',78,48],['千葉',89,50],['成田',90,32],['蘇我',89,64],
      ['取手',73,21],['水戸',84,10],['川崎',48,68],['横浜',43,76],['大船',39,82],['小田原',20,97],['久里浜',47,93]
    ];
    const routeNames = Object.fromEntries(ROUTES.map(route => [route.key, route.name]));
    const state = {stats:new Map(), info:[], area:'all', status:'all'};
    const $ = id => document.getElementById(id);
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const railwayKey = value => String(value || '').replace('odpt.Railway:','');
    const infoText = item => {
      const value = item?.['odpt:trainInformationText'];
      return typeof value === 'string' ? value : value?.ja || value?.en || '';
    };
    const infoIsIssue = item => {
      const text = infoText(item).replace(/\s/g,'');
      return Boolean(text && !/^(平常運転|通常運転|平常どおり)$/.test(text));
    };
    const officialInfo = key => state.info.find(item => {
      const raw = item['odpt:railway'];
      return (Array.isArray(raw) ? raw : raw ? [raw] : []).some(value => railwayKey(value) === key);
    });
    const severity = route => {
      const stat = state.stats.get(route.key);
      if (infoIsIssue(officialInfo(route.key)) || stat?.max >= 20) return 'major';
      if (stat?.delayed > 0) return 'delay';
      return stat?.total ? 'normal' : 'unknown';
    };
    const severityLabel = value => value === 'major' ? '異常' : value === 'delay' ? '遅延' : value === 'normal' ? '平常' : '情報なし';

    function aggregate(trains) {
      const result = new Map();
      trains.forEach(train => {
        const key = railwayKey(train['odpt:railway']);
        if (!result.has(key)) result.set(key,{total:0,delayed:0,max:0});
        const item = result.get(key);
        const delay = Math.max(0,Math.floor((Number(train['odpt:delay'])||0)/60));
        item.total++; if (delay > 0) item.delayed++; item.max = Math.max(item.max,delay);
      });
      return result;
    }

    function visibleRoutes() {
      return ROUTES.filter(route => {
        const sev = severity(route);
        const areaMatch = state.area === 'all' || route.area === state.area || (state.area === 'center' && ['center'].includes(route.area));
        const statusMatch = state.status === 'all' || (state.status === 'issue' && ['delay','major'].includes(sev)) || (state.status === 'normal' && sev === 'normal');
        return areaMatch && statusMatch;
      });
    }

    function drawMap() {
      const canvas = $('networkCanvas');
      const wrap = $('mapWrap');
      const width = Math.max(900,wrap.clientWidth);
      const height = 590;
      const dpr = Math.min(window.devicePixelRatio || 1,2);
      canvas.width = width*dpr; canvas.height = height*dpr;
      canvas.style.width = width+'px'; canvas.style.height = height+'px';
      const ctx = canvas.getContext('2d'); ctx.scale(dpr,dpr);
      ctx.fillStyle='#f8faf9'; ctx.fillRect(0,0,width,height);
      ctx.strokeStyle='#e2e8e5'; ctx.lineWidth=1;
      for(let x=30;x<width;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,height);ctx.stroke();}
      for(let y=30;y<height;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(width,y);ctx.stroke();}
      const px = p => [35 + p[0]*(width-70)/100, 18 + p[1]*(height-36)/100];
      const shown = new Set(visibleRoutes().map(route=>route.key));
      ROUTES.forEach(route => {
        const visible=shown.has(route.key), sev=severity(route);
        ctx.beginPath();
        route.path.forEach((point,index)=>{const [x,y]=px(point);index?ctx.lineTo(x,y):ctx.moveTo(x,y);});
        ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=visible?7:3;
        ctx.strokeStyle=!visible?'#d6ddda':sev==='major'?'#c9302c':sev==='delay'?'#d97706':route.color;
        ctx.globalAlpha=visible?1:.28;ctx.stroke();ctx.globalAlpha=1;
      });
      STATIONS.forEach(([name,xv,yv])=>{
        const [x,y]=px([xv,yv]);
        ctx.fillStyle='#fff';ctx.strokeStyle='#44564f';ctx.lineWidth=1.5;
        ctx.beginPath();ctx.arc(x,y,4.2,0,Math.PI*2);ctx.fill();ctx.stroke();
        ctx.font='600 11px "Noto Sans JP","Yu Gothic",sans-serif';
        ctx.textAlign=xv>84?'right':'left';ctx.textBaseline='bottom';ctx.fillStyle='#18241f';
        ctx.fillText(name,x+(xv>84?-7:7),y-5);
      });
    }

    function render() {
      const routes = visibleRoutes();
      const counts={normal:0,delay:0,major:0,unknown:0};
      ROUTES.forEach(route=>counts[severity(route)]++);
      $('lineCount').textContent=ROUTES.length;
      $('normalCount').textContent=counts.normal;
      $('delayCount').textContent=counts.delay+counts.major;
      $('maxDelay').textContent=Math.max(0,...ROUTES.map(route=>state.stats.get(route.key)?.max||0));
      $('lineTableBody').innerHTML=routes.map(route=>{
        const stat=state.stats.get(route.key),sev=severity(route);
        return `<tr><td>${esc(route.name)}</td><td><span class="status-label ${sev}">${severityLabel(sev)}</span></td><td>${stat?`${stat.delayed}/${stat.total}`:'—'}</td><td>${stat?`${stat.max}分`:'—'}</td></tr>`;
      }).join('')||'<tr><td colspan="4" class="empty">該当線区なし</td></tr>';
      const alerts=state.info.filter(infoIsIssue).map(item=>{
        const raw=item['odpt:railway'];const keys=(Array.isArray(raw)?raw:raw?[raw]:[]).map(railwayKey);
        const names=keys.map(key=>routeNames[key]).filter(Boolean);if(!names.length)return null;
        return {name:names.join('・'),text:infoText(item),time:item['dc:date']};
      }).filter(Boolean);
      $('alertList').innerHTML=alerts.length?alerts.map(item=>`<div class="alert-row"><div class="alert-row-head"><strong>${esc(item.name)}</strong><time>${item.time?new Date(item.time).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):''}</time></div><p>${esc(item.text)}</p></div>`).join(''):'<div class="empty">対象線区に異常情報はありません。</div>';
      drawMap();
    }

    async function request(path) {
      const response=await fetch(API+path,{headers:{Accept:'application/json'},cache:'no-store'});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      return response.json();
    }
    async function refresh() {
      $('refreshButton').disabled=true;$('connectionDot').className='connection-dot loading';$('connectionText').textContent='更新中';$('errorNotice').classList.remove('show');
      try {
        const [trains,info]=await Promise.all([
          request('odpt:Train?odpt:operator=odpt.Operator:JR-East'),
          request('odpt:TrainInformation?odpt:operator=odpt.Operator:jre-is').catch(()=>[])
        ]);
        state.stats=aggregate(Array.isArray(trains)?trains:[]);state.info=Array.isArray(info)?info:[];
        render();$('connectionDot').className='connection-dot';$('connectionText').textContent='接続中';$('updatedAt').textContent=new Date().toLocaleTimeString('ja-JP')+'更新';
      } catch(error) {
        console.error(error);$('connectionDot').className='connection-dot error';$('connectionText').textContent='取得エラー';$('errorNotice').textContent='運行データを取得できませんでした。';$('errorNotice').classList.add('show');render();
      } finally {$('refreshButton').disabled=false;}
    }
    function tick(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('ja-JP');$('date').textContent=now.toLocaleDateString('ja-JP');}
    $('areaFilter').addEventListener('change',e=>{state.area=e.target.value;render();});
    $('statusFilter').addEventListener('change',e=>{state.status=e.target.value;render();});
    $('refreshButton').addEventListener('click',refresh);
    window.addEventListener('resize',()=>requestAnimationFrame(drawMap));
    tick();setInterval(tick,1000);refresh();setInterval(refresh,60000);
  })();
  </script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="auth_guard.js"></script>
</body>
</html>
