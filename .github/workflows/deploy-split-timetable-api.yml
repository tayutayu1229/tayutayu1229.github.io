name: Deploy split timetable API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cloudflare SSH client
        run: |
          curl --fail --location --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Update private data sync and API
        env:
          PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_USER: ${{ secrets.SSH_USER }}
          SERVER_HOST: ${{ secrets.SSH_HOST }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=accept-new \
            -o "ProxyCommand=cloudflared access ssh --hostname %h" \
            "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          repo=/var/lib/tayunet-private-data/repository
          /usr/local/sbin/tayunet-private-data-sync
          python3 - <<'PY'
          import json
          with open('/srv/tayunet/private-data/timetables.json', encoding='utf-8') as source:
              rows = json.load(source)
          if len(rows) != 1707:
              raise SystemExit(f'expected 1707 legacy timetable rows, got {len(rows)}')
          print('legacy timetable rows:', len(rows))
          PY
          if sudo -n true 2>/dev/null; then
            sudo -n install -o root -g root -m 0755 \
              "$repo/server/tayunet-private-data-sync" /usr/local/sbin/tayunet-private-data-sync
            sudo -n "$repo/server/install-private-api.sh"
            sudo -n systemctl restart tayunet-private-data-sync.timer
            sudo -n systemctl start tayunet-private-data-sync.service
          else
            echo 'Split API installation skipped: passwordless sudo is unavailable.'
          fi
          curl --fail --silent --show-error http://127.0.0.1:5100/healthz
          REMOTE
