name: JR Freight status update

on:
  schedule:
    # GitHub ActionsのcronはUTCです。
    # 本番は常設サーバーで7分周期。こちらは静的データの予備更新。
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "JRF_status/scraper.py"
      - "JRF_status/requirements.txt"
      - ".github/workflows/update-status.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: jr-freight-status-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: JRF_status/requirements.txt

      - name: Install dependencies
        run: pip install -r JRF_status/requirements.txt

      - name: Test status parser
        run: python -m unittest discover -s JRF_status/tests

      - name: Fetch and build both views from the same official response
        id: build
        run: python JRF_status/scraper.py --output JRF_status/index.html --json-output JRF_status/JRF-gtfs/data/freight-status.json --health-output JRF_status/JRF-gtfs/data/fetch-health.json

      - name: Commit updated page and fetch health
        id: save
        if: ${{ always() && steps.build.outcome != 'skipped' && steps.build.outcome != '' }}
        run: |
          if git diff --quiet -- JRF_status/index.html JRF_status/JRF-gtfs/data/freight-status.json JRF_status/JRF-gtfs/data/fetch-health.json; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add JRF_status/index.html JRF_status/JRF-gtfs/data/freight-status.json JRF_status/JRF-gtfs/data/fetch-health.json
          git commit -m "Update JR Freight status"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish refreshed status on GitHub Pages
        if: ${{ always() && steps.save.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
