<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="列車とその他の撮影地を、地図・光線・季節・撮影条件から検索する撮影計画システム">
  <title>撮影地検索・撮影計画｜東京圏輸送情報システム</title>
  <link rel="stylesheet" href="/assets/css/photo-spots.css?v=2026.10.15.1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
  <script src="/assets/js/back-navigation.js" defer></script>
</head>
<body>
  <header class="spot-header">
    <a class="brand" href="/toppage.html" aria-label="システム一覧へ戻る">
      <span class="brand-mark">東</span><span><small>東京圏輸送情報システム</small><b>撮影地検索</b></span>
    </a>
    <div class="header-actions">
      <details class="header-menu">
        <summary aria-expanded="false">メニュー</summary>
        <div><span id="user-info">認証確認中</span><a href="/photo-archive.html">撮影記録</a><button type="button" id="trash-button">撮影地のゴミ箱</button><button type="button" id="firebase-logout-button">ログアウト</button></div>
      </details>
    </div>
  </header>
  <div class="system-strip">
    <div class="system-path"><a href="/toppage.html">システム一覧</a><span class="system-code">PSP-01</span></div>
    <div class="system-state"><span>地図：OpenStreetMap</span></div>
  </div>

  <main id="main-content">
    <section class="condition-bar" aria-label="撮影日時と太陽位置">
      <div class="quick-plan" id="quick-plan">
        <div class="field"><label for="plan-date">撮影日</label><div class="plan-step"><button type="button" id="date-previous" aria-label="前日">前日</button><input id="plan-date" name="date" type="date"><button type="button" id="date-next" aria-label="翌日">翌日</button></div></div>
        <div class="field"><label for="plan-time">現地時刻</label><div class="plan-step time-step"><button type="button" id="time-minus" aria-label="15分前">−15分</button><input id="plan-time" name="time" type="time" step="900"><button type="button" id="time-now">いま</button><button type="button" id="time-plus" aria-label="15分後">＋15分</button></div></div>
      </div>
      <div class="sun-inline" aria-live="polite">
        <span>太陽位置</span><strong id="sun-summary">計算中</strong>
      </div>
    </section>

    <nav class="category-tabs" aria-label="撮影ジャンル">
      <button class="active" data-kind="all"><span>すべて</span></button>
      <button data-kind="train"><span>列車</span></button>
      <button data-kind="nonTrain"><span>その他</span></button>
      <button data-kind="favorite"><span>お気に入り</span></button>
    </nav>

    <section class="search-workspace">
      <aside class="filter-panel" id="filter-panel">
        <div class="panel-heading"><h2>検索条件</h2><div class="panel-actions"><button class="filter-close" id="filter-close" type="button">閉じる</button><button id="clear-filters" type="button">条件クリア</button></div></div>
        <label class="search-field filter-field"><span>キーワード</span><input id="keyword-filter" type="search" placeholder="路線・被写体・場所…"></label>
        <div class="conditional-filter" id="train-filters" hidden>
          <label><span>路線</span><select id="line-filter"><option value="">すべての路線</option></select></label>
          <label><span>列車の方向</span><select id="direction-filter"><option value="">指定なし</option><option value="up">上り</option><option value="down">下り</option></select></label>
        </div>
        <div class="conditional-filter" id="non-train-filters" hidden>
          <div class="genre-filter-block"><span>ジャンル（複数選択可）</span><div class="genre-filter-buttons" id="genre-filter-buttons" role="group" aria-label="その他のジャンル"></div></div>
          <label class="compact-check"><input id="season-filter" type="checkbox"><span>指定月に見頃のものだけ</span></label>
        </div>
        <label class="filter-field" id="light-filter-field" hidden><span>光線条件</span><select id="light-filter"><option value="">条件を問わない</option><option value="front">順光を優先</option><option value="side">側面光まで</option><option value="back">逆光を活かす</option></select></label>
        <label class="filter-field"><span>アクセス</span><select id="access-filter"><option value="">指定なし</option><option value="10">駅から徒歩10分以内</option><option value="20">駅から徒歩20分以内</option></select></label>
        <div class="check-stack">
          <label><input id="beginner-filter" type="checkbox"><span>初心者向けのみ</span></label>
        </div>
      </aside>

      <section class="result-area">
        <div class="result-toolbar">
          <div><h2>撮影候補</h2><span class="result-count" id="result-count">0件</span></div>
          <div class="toolbar-actions">
            <button class="filter-toggle" id="filter-toggle" type="button" aria-controls="filter-panel" aria-expanded="false">検索条件</button>
            <label class="sort-control">並び順<select id="sort-order"><option value="updated">情報が新しい順</option><option value="distance">駅から近い順</option><option value="season" data-non-train-sort>見頃が近い順</option><option value="name">名称順</option></select></label>
            <div class="view-switch" role="group" aria-label="表示形式"><button class="active" data-view="split">分割</button><button data-view="map">地図</button><button data-view="list">一覧</button></div>
            <button class="primary add-spot" id="add-spot-button" type="button">＋ 撮影地</button>
          </div>
        </div>
        <div class="active-filters" id="active-filters" aria-live="polite"></div>
        <div class="map-list-layout" id="map-list-layout">
          <div class="map-shell"><div id="spot-map" aria-label="撮影地の地図"></div><div class="map-legend"><span><i class="train"></i>列車</span><span><i class="non-train"></i>その他</span></div><div class="map-tools"><button id="map-reset" type="button">東京圏を表示</button><button id="show-current-location" type="button">現在地を表示</button></div></div>
          <div class="spot-list" id="spot-list" aria-live="polite"><div class="result-state" id="result-state">撮影地を読み込んでいます</div><div class="empty-state" id="empty-state" hidden><b>条件に合う撮影地がありません</b><span>条件を変更するか、「＋ 撮影地」から追加できます。</span></div><div id="spot-cards"></div></div>
        </div>
      </section>
    </section>
  </main>

  <dialog class="detail-dialog" id="spot-dialog"><div id="spot-detail"></div></dialog>
  <dialog class="editor-dialog" id="editor-dialog">
    <form id="spot-form" novalidate>
      <header><h2 id="editor-title">撮影地を追加</h2><button type="button" data-close="editor-dialog" aria-label="閉じる">×</button></header>
      <div class="editor-body">
        <div class="editor-grid">
          <label>種類 <b class="required-mark">必須</b><select name="kind" id="editor-kind" required><option value="train">列車</option><option value="nonTrain">その他</option></select></label>
          <label>名称 <b class="required-mark">必須</b><input name="name" required maxlength="80" placeholder="例：○○駅〜△△駅 河川敷"></label>
          <label class="span2">市区町村・場所（任意）<input name="area" maxlength="100" placeholder="例：東京都日野市／多摩川右岸"></label>
          <div class="editor-conditional span2" id="editor-train-fields">
            <label>路線<input name="line" maxlength="50" placeholder="例：東北本線"></label>
            <div class="direction-field"><span id="editor-direction-label">対象方向 <b class="required-mark">必須</b></span><input name="directionMode" id="editor-direction" type="hidden"><div class="direction-choice" role="group" aria-labelledby="editor-direction-label" aria-required="true"><button type="button" data-direction-mode="up" aria-pressed="false">上りのみ</button><button type="button" data-direction-mode="down" aria-pressed="false">下りのみ</button><button type="button" data-direction-mode="both" aria-pressed="false">上下線とも</button></div></div>
            <label id="editor-up-label">上り方面（任意）<input name="upLabel" maxlength="50" placeholder="例：東京方面"></label>
            <label id="editor-down-label">下り方面（任意）<input name="downLabel" maxlength="50" placeholder="例：大宮方面"></label>
            <div class="bearing-editor span2">
              <label>カメラ方位（任意）<input name="bearing" id="editor-bearing" type="number" min="0" max="359"><small>地図の扇形・8方位ボタン・数値が連動します</small></label>
              <div class="bearing-buttons" id="bearing-buttons" role="group" aria-label="カメラ方位の選択">
                <button type="button" data-bearing="0" aria-pressed="false">北</button><button type="button" data-bearing="45" aria-pressed="false">北東</button><button type="button" data-bearing="90" aria-pressed="false">東</button><button type="button" data-bearing="135" aria-pressed="false">南東</button><button type="button" data-bearing="180" aria-pressed="false">南</button><button type="button" data-bearing="225" aria-pressed="false">南西</button><button type="button" data-bearing="270" aria-pressed="false">西</button><button type="button" data-bearing="315" aria-pressed="false">北西</button>
              </div>
            </div>
          </div>
          <div class="editor-conditional span2" id="editor-non-train-fields" hidden>
            <label class="span2">ジャンル <b class="required-mark">必須</b><input name="subject" id="editor-subject" list="subject-examples" maxlength="50" required placeholder="例：桜、紅葉、夜景、飛行機"><small id="subject-status" aria-live="polite"></small><datalist id="subject-examples"></datalist></label>
            <label>見頃開始月<input name="bloomStart" type="number" min="1" max="12"></label>
            <label>見頃終了月<input name="bloomEnd" type="number" min="1" max="12"></label>
          </div>
          <div class="editor-map-block span2"><b>撮影地点</b><span id="editor-map-status">地図をクリックまたはタップして位置を指定</span><div id="editor-map" aria-label="追加する撮影地点を選ぶ地図"></div></div>
          <label>緯度 <b class="required-mark">必須</b><input name="lat" type="number" step="any" min="20" max="46" required></label>
          <label>経度 <b class="required-mark">必須</b><input name="lng" type="number" step="any" min="122" max="154" required></label>
          <label>駅から徒歩（任意）<input name="walk" type="number" min="1" max="180"><small>分</small></label>
          <label>推奨レンズ（任意）<input name="lens" maxlength="200" placeholder="例：70–200mm"></label>
          <label>三脚の可否（任意）<select name="tripod"><option value="">未入力</option><option value="使用可">使用可</option><option value="使用不可">使用不可</option><option value="条件付き">条件付き</option></select></label>
          <div class="editor-checks span2"><label><input name="beginner" type="checkbox">初心者向け</label></div>
          <label class="span2">撮影位置・アクセス <b class="required-mark">必須</b><textarea name="access" rows="2" required placeholder="公共の場所から安全に到達できる経路"></textarea></label>
          <label class="span2">メモ<textarea name="memo" rows="3" placeholder="撮影時に確認したいことを自由に入力"></textarea></label>
          <div class="gallery-editor span2">
            <label>作例写真 <span id="photo-limit-label">一般職員は9枚まで</span><input name="photo" id="editor-photo-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp" multiple><small>1枚25MB以下。大きい写真はサーバーで2MB以下に圧縮します。写真ごとに撮影日・場所・一言を記録できます。</small></label>
            <div id="editor-gallery" class="editor-gallery" aria-live="polite"></div>
          </div>
        </div>
      </div>
      <footer><p class="editor-error" id="editor-error" role="alert" aria-live="assertive" hidden></p><button type="button" class="secondary" data-close="editor-dialog">キャンセル</button><button type="submit" class="primary">撮影地を保存</button></footer>
    </form>
  </dialog>
  <dialog class="utility-dialog" id="history-dialog">
    <article><header><h2>編集履歴</h2><button type="button" data-close="history-dialog" aria-label="閉じる">×</button></header><div class="utility-body" id="history-list"></div></article>
  </dialog>
  <dialog class="utility-dialog" id="trash-dialog">
    <article><header><h2>撮影地のゴミ箱</h2><button type="button" data-close="trash-dialog" aria-label="閉じる">×</button></header><div class="utility-body"><p class="dialog-note">ゴミ箱へ移動してから30日間は復元できます。</p><div id="trash-list"></div></div></article>
  </dialog>
  <dialog class="utility-dialog" id="conflict-dialog">
    <article><header><h2>更新の競合</h2><button type="button" data-close="conflict-dialog" aria-label="閉じる">×</button></header><div class="utility-body"><p>別の職員が先に更新しました。入力内容は自動で上書きしません。</p><dl class="data-list" id="conflict-summary"></dl><div class="detail-actions"><button type="button" id="conflict-reload">最新情報を表示</button><button type="button" data-close="conflict-dialog">入力内容を保持して閉じる</button></div></div></article>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/auth_guard.js?v=2026.08.25.4"></script>
  <script src="/T-time/firebase-data-auth.js?v=2026.08.09.1"></script>
  <script src="/assets/js/photo-spots.js?v=2026.10.15.1" defer></script>
</body>
</html>
