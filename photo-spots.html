<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="列車とその他の撮影地を、地図・光線・季節・撮影条件から検索する撮影計画システム">
  <title>撮影地検索・撮影計画｜東京圏輸送情報システム</title>
  <link rel="stylesheet" href="/assets/css/photo-spots.css?v=2026.10.13.1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
  <script src="/assets/js/back-navigation.js" defer></script>
</head>
<body>
  <header class="spot-header">
    <a class="brand" href="/toppage.html" aria-label="システム一覧へ戻る">
      <span class="brand-mark">東</span><span><small>東京圏輸送情報システム</small><b>撮影地検索</b></span>
    </a>
    <div class="header-actions">
      <details class="header-menu">
        <summary aria-expanded="false">メニュー</summary>
        <div><span id="user-info">認証確認中</span><a href="/photo-archive.html">撮影記録</a><button type="button" id="firebase-logout-button">ログアウト</button></div>
      </details>
    </div>
  </header>
  <div class="system-strip">
    <div class="system-path"><a href="/toppage.html">システム一覧</a><span class="system-code">PSP-01</span></div>
    <div class="system-state"><span>地図：OpenStreetMap</span></div>
  </div>

  <main id="main-content">
    <section class="condition-bar" aria-label="撮影日時と太陽位置">
      <div class="quick-plan" id="quick-plan">
        <div class="field"><label for="plan-date">撮影日</label><input id="plan-date" name="date" type="date"></div>
        <div class="field"><label for="plan-time">現地時刻</label><input id="plan-time" name="time" type="time" step="900"></div>
      </div>
      <div class="sun-inline" aria-live="polite">
        <span>太陽位置</span><strong id="sun-summary">計算中</strong>
      </div>
    </section>

    <nav class="category-tabs" aria-label="撮影ジャンル">
      <button class="active" data-kind="all"><span>すべて</span></button>
      <button data-kind="train"><span>列車</span></button>
      <button data-kind="nonTrain"><span>その他</span></button>
      <button data-kind="favorite"><span>お気に入り</span></button>
    </nav>

    <section class="search-workspace">
      <aside class="filter-panel" id="filter-panel">
        <div class="panel-heading"><h2>検索条件</h2><button id="clear-filters" type="button">条件クリア</button></div>
        <label class="search-field filter-field"><span>キーワード</span><input id="keyword-filter" type="search" placeholder="路線・被写体・場所…"></label>
        <div class="conditional-filter" id="train-filters" hidden>
          <label><span>路線</span><select id="line-filter"><option value="">すべての路線</option></select></label>
          <label><span>列車の方向</span><select id="direction-filter"><option value="">上り・下り両方</option><option value="up">上り</option><option value="down">下り</option></select></label>
        </div>
        <div class="conditional-filter" id="non-train-filters" hidden>
          <label><span>被写体</span><select id="subject-filter"><option value="">すべての被写体</option></select></label>
          <label class="compact-check"><input id="season-filter" type="checkbox"><span>指定月に見頃のものだけ</span></label>
        </div>
        <label class="filter-field"><span>光線条件</span><select id="light-filter"><option value="">条件を問わない</option><option value="front">順光を優先</option><option value="side">側面光まで</option><option value="back">逆光を活かす</option></select></label>
        <label class="filter-field"><span>アクセス</span><select id="access-filter"><option value="">指定なし</option><option value="10">駅から徒歩10分以内</option><option value="20">駅から徒歩20分以内</option></select></label>
        <div class="check-stack">
          <label><input id="beginner-filter" type="checkbox"><span>初心者向けのみ</span></label>
          <label><input id="safe-filter" type="checkbox"><span>現地確認済みのみ</span></label>
        </div>
      </aside>

      <section class="result-area">
        <div class="result-toolbar">
          <div><h2>撮影候補</h2><span class="result-count" id="result-count">0件</span></div>
          <div class="toolbar-actions">
            <button class="filter-toggle" id="filter-toggle" type="button" aria-controls="filter-panel" aria-expanded="false">検索条件</button>
            <label class="sort-control">並び順<select id="sort-order"><option value="updated">情報が新しい順</option><option value="distance">駅から近い順</option></select></label>
            <div class="view-switch" role="group" aria-label="表示形式"><button class="active" data-view="split">分割</button><button data-view="map">地図</button><button data-view="list">一覧</button></div>
            <button class="primary add-spot" id="add-spot-button" type="button">＋ 撮影地</button>
          </div>
        </div>
        <div class="active-filters" id="active-filters" aria-live="polite"></div>
        <div class="map-list-layout" id="map-list-layout">
          <div class="map-shell"><div id="spot-map" aria-label="撮影地の地図"></div><div class="map-legend"><span><i class="train"></i>列車</span><span><i class="non-train"></i>その他</span></div><button id="map-reset" type="button">東京圏を表示</button></div>
          <div class="spot-list" id="spot-list" aria-live="polite"><div class="empty-state" id="empty-state" hidden><b>条件に合う撮影地がありません</b><span>条件を変更するか、「＋ 撮影地」から追加できます。</span></div><div id="spot-cards"></div></div>
        </div>
      </section>
    </section>
  </main>

  <dialog class="detail-dialog" id="spot-dialog"><div id="spot-detail"></div></dialog>
  <dialog class="editor-dialog" id="editor-dialog">
    <form id="spot-form">
      <header><h2>撮影地を追加</h2><button type="button" data-close="editor-dialog" aria-label="閉じる">×</button></header>
      <div class="editor-body">
        <div class="editor-grid">
          <label>種類<select name="kind" id="editor-kind" required><option value="train">列車</option><option value="nonTrain">その他</option></select></label>
          <label>名称<input name="name" required maxlength="80" placeholder="例：○○駅〜△△駅 河川敷"></label>
          <div class="editor-conditional span2" id="editor-train-fields">
            <label>路線<input name="line" maxlength="50" placeholder="例：東北本線"></label>
            <label>上り方面<input name="upLabel" maxlength="50" placeholder="例：東京方面"></label>
            <label>下り方面<input name="downLabel" maxlength="50" placeholder="例：大宮方面"></label>
            <label>カメラ方位<input name="bearing" type="number" min="0" max="359" value="90"><small>北0°・東90°・南180°・西270°</small></label>
          </div>
          <div class="editor-conditional span2" id="editor-non-train-fields" hidden>
            <label>被写体<input name="subject" list="subject-examples" maxlength="50" placeholder="例：夜景、夕焼け、桜、紅葉"><datalist id="subject-examples"><option value="夜景"></option><option value="夕焼け"></option><option value="桜"></option><option value="紅葉"></option><option value="梅"></option><option value="あじさい"></option><option value="花菖蒲"></option><option value="彼岸花"></option><option value="風景"></option></datalist></label>
            <label>見頃開始月<input name="bloomStart" type="number" min="1" max="12"></label>
            <label>見頃終了月<input name="bloomEnd" type="number" min="1" max="12"></label>
          </div>
          <div class="editor-map-block span2"><b>撮影地点</b><span id="editor-map-status">地図をクリックまたはタップして位置を指定</span><div id="editor-map" aria-label="追加する撮影地点を選ぶ地図"></div></div>
          <label>緯度<input name="lat" type="number" step="any" min="20" max="46" required></label>
          <label>経度<input name="lng" type="number" step="any" min="122" max="154" required></label>
          <label>駅から徒歩<input name="walk" type="number" min="0" max="180" value="10"><small>分</small></label>
          <label class="span2">撮影位置・アクセス<textarea name="access" rows="2" required placeholder="公共の場所から安全に到達できる経路"></textarea></label>
          <label class="span2">メモ<textarea name="memo" rows="3" placeholder="撮影時に確認したいことを自由に入力"></textarea></label>
          <label class="span2">作例写真<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"><small>2MB以下。位置情報を公開したくない写真は、事前にGPS情報を削除してください。</small></label>
        </div>
      </div>
      <footer><button type="button" class="secondary" data-close="editor-dialog">キャンセル</button><button type="submit" class="primary">撮影地を保存</button></footer>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="/auth_guard.js?v=2026.08.25.4"></script>
  <script src="/T-time/firebase-data-auth.js?v=2026.08.09.1"></script>
  <script src="/assets/js/photo-spots.js?v=2026.10.13.1" defer></script>
</body>
</html>
