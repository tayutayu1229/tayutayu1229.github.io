<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b6b47">
  <title>北区コミュニティバス案内 | 東京圏輸送情報システム</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="app.css?v=2026.09.03.1">
</head>
<body>
  <header class="app-header">
    <div>
      <a class="back" href="/toppage.html">東京圏輸送情報システム</a>
      <h1>北区コミュニティバス案内</h1>
      <p>停留所から、今日の次のバスをすばやく確認</p>
    </div>
    <div class="service-badge" id="service-badge">運行日を確認中</div>
  </header>

  <main class="workspace">
    <section class="map-panel" aria-label="路線図">
      <div id="map"></div>
      <div class="map-actions">
        <button id="locate-button" type="button">◎ 現在地から探す</button>
        <button id="fit-button" type="button">路線全体</button>
      </div>
      <div class="map-legend"><span class="line west"></span>宮原駅西口行 <span class="line east"></span>宮原駅東口行</div>
    </section>

    <section class="info-panel" aria-live="polite">
      <div class="search-wrap">
        <label for="stop-search">停留所を検索</label>
        <div class="search-row">
          <input id="stop-search" type="search" inputmode="search" placeholder="例：北区役所、日進駅" autocomplete="off">
          <button id="clear-search" type="button" aria-label="検索を消す">×</button>
        </div>
        <div id="search-results" class="search-results" hidden></div>
      </div>

      <div id="loading" class="state-card">時刻表データを読み込んでいます…</div>
      <div id="error" class="state-card error" hidden>データを読み込めませんでした。通信状況を確認して、再読み込みしてください。</div>

      <div id="stop-detail" hidden>
        <div class="stop-heading">
          <div>
            <span class="eyebrow">選択中の停留所</span>
            <h2 id="stop-name"></h2>
          </div>
          <button id="favorite-button" type="button" aria-pressed="false" title="この停留所を最初に表示">☆</button>
        </div>

        <div id="next-service" class="next-service"></div>

        <div class="direction-tabs" role="tablist" aria-label="行先">
          <button type="button" data-direction="all" class="active">すべて</button>
          <button type="button" data-direction="宮原駅西口">西口行</button>
          <button type="button" data-direction="宮原駅東口">東口行</button>
        </div>
        <div id="departures" class="departures"></div>
      </div>

      <div class="service-note">
        <strong>平日運行</strong>
        <span>土曜・日曜・祝日・年末年始は運休</span>
        <span id="fare-note"></span>
      </div>
      <details class="data-note">
        <summary>データについて</summary>
        <p>表示時刻は計画時刻です。車両の現在地や遅延を示すリアルタイム情報ではありません。</p>
        <p id="data-version"></p>
        <p><a href="https://gtfs-data.jp/search?target_feed=saitamacity*kitakucommunitybus" target="_blank" rel="noopener">GTFSデータリポジトリ</a>／<a id="operator-link" target="_blank" rel="noopener">さいたま市公式案内</a></p>
      </details>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=2026.09.03.1"></script>
</body>
</html>
