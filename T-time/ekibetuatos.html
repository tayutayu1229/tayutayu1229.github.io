<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モバイル ATOS アプリ Ver2.4.0</title>
    <style>
        :root {
            --atos-font: "MS Gothic", "MS PGothic", "Hiragino Kaku Gothic ProN", sans-serif;
            --atos-table-header: #1A968A; 
            --bg-white: #ffffff;
            --row-gray: #cfcfcf;
            --text-black: #222;
            --border-white: #ffffff;
            --atos-row-height: 26px;
        }

        body {
            font-family: var(--atos-font);
            background-color: var(--bg-white);
            margin: 0; padding: 0;
            font-size: 15px; font-weight: bold; color: var(--text-black);
            overflow-x: hidden;
        }
        
        #appContainer { width: 100%; max-width: none; margin: 0; padding: 0; box-sizing: border-box; }
        
        .system-header {
            background: linear-gradient(to bottom, #f0f0f0, #d0d0d0);
            padding: 8px 10px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #999; height: 30px; color: #444;
        }
        .header-title { font-size: 16px; flex-grow: 1; text-align: center; }
        .clock-area { font-size: 15px; min-width: 180px; width: 180px; padding: 2px 8px; text-align: right; }
        .icon-menu { width: 20px; height: 16px; border-top: 3px solid #666; border-bottom: 3px solid #666; position: relative; flex-shrink: 0; }
        .icon-menu::after { content: ""; position: absolute; top: 4px; width: 100%; height: 3px; background: #666; }

        .filter-bar {
            background-color: #e0e0e0; padding: 8px; display: flex; align-items: center;
            gap: 15px; border-bottom: 1px solid #999; flex-wrap: wrap; overflow: hidden; white-space: nowrap;
        }
        select, input { border: 1px solid #999; padding: 2px 4px; height: 24px; border-radius: 2px; font: inherit; font-size: 15px; font-weight: bold; }
        input[type="date"] { width: 130px; text-align: center; }
        .message-area { display: none; padding: 8px; border-bottom: 1px solid #aaa; background: #fff4d8; color: #7a4b00; font-size: 13px; }
        .message-area.show { display: block; }
        
        .monitor-table-container { width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; }
        table { border-collapse: collapse; table-layout: fixed; width: 100%; min-width: 980px; color: #000; }
        
        th {
            background-color: var(--atos-table-header); color: white; border: 1px solid var(--border-white);
            padding: 0 2px; font-size: 15px; height: var(--atos-row-height); white-space: nowrap; overflow: hidden;
        }
        
        td { 
            border: 1px solid var(--border-white); 
            background-color: var(--row-gray); 
            height: var(--atos-row-height); 
            padding: 0 4px; text-align: center; font-size: 16px; font-weight: bold;
            line-height: var(--atos-row-height); white-space: nowrap; overflow: hidden;
        }

        .td-line-side { background-color: var(--row-gray); border-right: 2px solid #888; vertical-align: middle; }
        .row-boundary td { border-top: 3px solid #333; }
        .col-time, .col-trk { text-align: right; padding-right: 6px; }
        .link-text { appearance: none; -webkit-appearance: none; display: inline; min-width: 0; margin: 0; padding: 0; border: 0; border-radius: 0; background: transparent; color: #0000EE; text-decoration: underline; cursor: pointer; font: inherit; font-size: inherit; font-weight: inherit; line-height: inherit; vertical-align: baseline; }
        .link-text:focus-visible { outline: 1px dotted #0000EE; outline-offset: 1px; }

        #modalOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-white); display: none; z-index: 1000;
        }
        .modal-content {
            background: var(--bg-white); width: 100vw; height: 100vh; max-width: none; max-height: none;
            overflow-y: auto; overflow-x: hidden; border: 0; position: relative; padding: 0;
        }
        .modal-header {
            background: linear-gradient(to bottom, #f0f0f0, #d0d0d0); color: #333; padding: 8px 10px;
            display: grid; grid-template-columns: 70px 1fr 70px; align-items: center;
            height: 30px; font-size: 16px; border-bottom: 1px solid #999;
        }
        .modal-title { text-align: center; }
        .close-btn { appearance: none; justify-self: end; width: 60px; height: 22px; padding: 0; border: 1px solid #a66b00; border-radius: 2px; background: #e79418; color: #241600; cursor: pointer; font: inherit; font-size: 12px; font-weight: bold; line-height: 20px; }
        .modal-clock-row { min-height: 30px; padding: 4px 12px; box-sizing: border-box; text-align: right; border-bottom: 1px solid #ddd; font-size: 15px; }
        .modal-body { padding: 38px 5px 0; }
        .modal-train-info { padding: 0 5px 7px; font-size: 15px; line-height: 1.5; background: #fff; }
        .modal-content table { width: 100%; min-width: 900px; }
        .modal-content .footer-legend { padding: 10px 5px 80px; font-size: 15px; background: #fff; }
        .detail-table th.cell-narrow { font-size: 12px; }
        .detail-table td:nth-child(3) { text-align: left; padding-left: 10px; }
        .detail-table td:nth-child(4), .detail-table td:nth-child(6), .detail-table td:nth-child(8) { text-align: right; padding-right: 5px; }
        .detail-table td:nth-child(5), .detail-table td:nth-child(7) { padding: 0; font-size: 12px; }
        .hidden { display: none !important; }
        @media (max-width: 1050px) {
            #mainTable th { padding-left: 2px; padding-right: 2px; font-size: 13px; }
            #mainTable td { padding-left: 3px; padding-right: 3px; font-size: 14px; }
        }
        @media (max-width: 700px) {
            .clock-area { display: none; }
            .system-header { height: auto; min-height: 46px; padding: 8px 10px; }
            .header-title { text-align: right; font-size: 14px; line-height: 1.25; }
            .filter-bar { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 10px; white-space: normal; overflow: visible; }
            .filter-bar > * { min-width: 0; }
            .filter-bar select, .filter-bar input { min-height: 40px; font-size: 16px; max-width: 100%; }
            #appContainer { padding: 0; }
            .modal-body { padding-top: 24px; }
            .detail-table th { padding-left: 2px; padding-right: 2px; font-size: 12px; }
            .detail-table td { padding-left: 3px; padding-right: 3px; font-size: 14px; }
        }
    </style>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/assets/css/site-brand.css">
<script src="/assets/js/site-brand.js" defer></script>
</head>
<body>

    <div class="system-header">
        <div class="icon-menu" aria-hidden="true"></div>
        <div class="header-title">モバイル ATOS アプリ Ver2.4.0</div>
        <div class="clock-area" id="clockDisplay">----/--/-- --:--:-- 現在</div>
    </div>
    
    <div id="appContainer">
        <div class="filter-bar">
            <div>施行日：<input type="date" id="dateInput"></div>
            <div>線区：<select id="lineSelect"><option value="">(選択)</option></select></div>
            <div>駅名：<select id="stationSelect"><option value="">(選択)</option></select></div>
        </div>

        <div class="message-area" id="messageArea" role="alert"></div>

        <div class="monitor-table-container">
            <table id="mainTable">
                <colgroup>
                    <col style="width:7%"><col style="width:9%"><col style="width:11%"><col style="width:5%">
                    <col style="width:9%"><col style="width:4%"><col style="width:9%"><col style="width:4%">
                    <col style="width:6%"><col style="width:7%"><col style="width:9%"><col style="width:10%">
                </colgroup>
                <thead>
                    <tr>
                        <th rowspan="2">線別</th>
                        <th rowspan="2">列車番号</th>
                        <th rowspan="2">列車種別</th>
                        <th rowspan="2">動力</th>
                        <th colspan="2">着時刻</th><th colspan="2">発時刻</th>
                        <th rowspan="2">番線</th><th rowspan="2">運用<br>情報</th>
                        <th rowspan="2">運用列番</th><th rowspan="2">行先</th>
                    </tr>
                    <tr>
                        <th>計画</th><th>到着</th><th>計画</th><th>発車</th>
                    </tr>
                </thead>
                <tbody id="timetableBody"></tbody>
            </table>
        </div>
    </div>

    <div id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-content">
            <div class="modal-header">
                <span aria-hidden="true"></span>
                <span class="modal-title" id="modalTitle">モバイル ATOS アプリ　Ver2.4.0</span>
                <button class="close-btn" type="button" onclick="closeModal()">閉じる</button>
            </div>
            <div class="modal-clock-row" id="modalClockDisplay">----/--/-- --:--:-- 現在</div>
            <div class="modal-body">
                <div class="modal-train-info" id="modalTrainInfo"></div>
                <div class="monitor-table-container" id="modalTableContainer"></div>
                <div class="footer-legend">「$」…運休　「*」…運済　「#」…変更　「¥」…運転禁止</div>
            </div>
        </div>
    </div>

    <script src="private-data-client.js"></script>
    <script>
        let rawTimetableData = [];
        let holidayData = {};
        let lastModalFocus = null;
        const HOLIDAY_API_URL = 'https://holidays-jp.github.io/api/v1/date.json';
        const PREF_KEY = 'ekibetuatos_filters_v1';

        function showMessage(text) {
            const area = document.getElementById('messageArea');
            area.textContent = text || '';
            area.classList.toggle('show', Boolean(text));
        }

        function localInputDate(date = new Date()) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function isHoliday(date) {
            const key = localInputDate(date);
            return date.getDay() === 0 || date.getDay() === 6 || Boolean(holidayData[key]);
        }

        async function loadData() {
            showMessage('');
            try {
                const holidayResponse = await fetch(HOLIDAY_API_URL).catch(() => null);
                if (holidayResponse?.ok) holidayData = await holidayResponse.json();
                rawTimetableData = await TayunetPrivateData.fetchTimetables();
                populateLines();
                restoreSelection();
                render();
            } catch (e) {
                console.error(e);
                showMessage(`データを読み込めませんでした：${e.message}`);
            }
        }

        function safeVal(val) {
            return (val === undefined || val === null) ? "" : String(val).trim();
        }

        function normalizeString(value) {
            return safeVal(value).replace(/[Ａ-Ｚａ-ｚ０-９]/g, character =>
                String.fromCharCode(character.charCodeAt(0) - 0xFEE0)
            ).toUpperCase().replace(/\s/g, '');
        }

        function autoDeterminePower(train) {
            const p = safeVal(train.power);
            if (p !== "" && p !== "…") return p;
            const tNo = safeVal(train.trainNumber).toUpperCase();
            if (!tNo.match(/[A-Z]$/)) return "EL";
            if (tNo.endsWith('D')) return "DC";
            return "EC";
        }

        function parseTimeValue(timeStr) {
            const s = safeVal(timeStr);
            if (s === "" || s === "…" || s === "=") return null;
            const parts = s.split(':');
            const h = parseInt(parts[0], 10);
            const m = parseInt(parts[1], 10);
            const sec = parseInt(parts[2], 10) || 0;
            return isNaN(h) || isNaN(m) ? null : (h * 3600) + (m * 60) + sec;
        }

        function formatDisplayTime(timeStr) {
            const val = parseTimeValue(timeStr);
            if (val === null) return safeVal(timeStr) === "=" ? "=" : "…";
            const h = Math.floor(val / 3600);
            const m = Math.floor((val % 3600) / 60);
            const sec = val % 60;
            return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function populateLines() {
            const lines = [...new Set(rawTimetableData.map(d => safeVal(d.line)).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ja'));
            const lineSelect = document.getElementById('lineSelect');
            lineSelect.replaceChildren(new Option('(選択)', ''), ...lines.map(l => new Option(l, l)));
        }

        function populateStations(preferredStation = '') {
            const line = document.getElementById('lineSelect').value;
            const stationSelect = document.getElementById('stationSelect');
            if (!line) {
                stationSelect.replaceChildren(new Option('(選択)', ''));
                return;
            }

            const lineTrains = rawTimetableData.filter(train => train.line === line && Array.isArray(train.stops));
            const base = [...lineTrains].sort((a, b) => b.stops.length - a.stops.length)[0];
            const ordered = [];
            const seen = new Set();
            const add = value => { const station = safeVal(value); if (station && !seen.has(station)) { seen.add(station); ordered.push(station); } };
            (base?.stops || []).forEach(stop => add(stop.station));
            lineTrains.forEach(train => train.stops.forEach(stop => add(stop.station)));
            stationSelect.replaceChildren(new Option('(選択)', ''), ...ordered.map(station => new Option(station, station)));
            if (preferredStation && seen.has(preferredStation)) stationSelect.value = preferredStation;
        }

        function saveSelection() {
            try {
                localStorage.setItem(PREF_KEY, JSON.stringify({
                    date: document.getElementById('dateInput').value,
                    line: document.getElementById('lineSelect').value,
                    station: document.getElementById('stationSelect').value
                }));
            } catch (error) {
                console.warn('選択条件を保存できませんでした。', error);
            }
        }

        function restoreSelection() {
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem(PREF_KEY) || '{}'); } catch (error) { console.warn(error); }
            const dateInput = document.getElementById('dateInput');
            dateInput.value = saved.date || dateInput.value || localInputDate();
            const lineSelect = document.getElementById('lineSelect');
            if (saved.line && [...lineSelect.options].some(option => option.value === saved.line)) lineSelect.value = saved.line;
            populateStations(saved.station || '');
        }

        function handleLineChange() {
            populateStations();
            saveSelection();
            render();
        }

        function appendCell(row, value, className) {
            const td = document.createElement('td');
            if (className) td.className = className;
            td.textContent = value == null ? '' : String(value);
            row.appendChild(td);
            return td;
        }

        function appendLinkCell(row, value, onClick) {
            const td = appendCell(row, '');
            const text = safeVal(value);
            if (!text) return td;
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'link-text';
            button.textContent = text;
            button.addEventListener('click', onClick);
            td.appendChild(button);
            return td;
        }

        // 運用情報のラベル判定ロジック
        function getUnyouStatus(train, isFirst, isLast) {
            let status = "";
            let code = "";
            if (isFirst) code = train.tt1;
            else if (isLast) code = train.tt2;

            if (code === 'k') status = "継送";
            else if (code === 'o') status = "折返";
            return status;
        }

        function render() {
            const line = document.getElementById('lineSelect').value;
            const station = document.getElementById('stationSelect').value;
            const dateVal = document.getElementById('dateInput').value;
            const tbody = document.getElementById('timetableBody');
            tbody.innerHTML = '';
            showMessage('');
            if (!line || !station || !dateVal) {
                return;
            }

            saveSelection();
            const targetDate = new Date(`${dateVal}T00:00:00`);
            const targetDateStr = dateVal.replace(/-/g, '/');
            const targetDayType = isHoliday(targetDate) ? "土休日" : "平日";

            const candidates = rawTimetableData.filter(t => t.line === line && t.stops.some(s => s.station === station));
            const trainMap = new Map();
            const uniqueNos = [...new Set(candidates.map(t => t.trainNumber))];

            uniqueNos.forEach(tNo => {
                const versions = candidates.filter(v => v.trainNumber === tNo);
                
                // 1. 特定日優先 (日付一致かつdayType空)
                let match = versions.find(v => v.startDate === targetDateStr && !safeVal(v.dayType));
                
                // 2. 所定ダイヤ検索
                if (!match) {
                    const regulars = versions.filter(v => {
                        const vDate = new Date(v.startDate);
                        const isPastOrToday = vDate <= targetDate;
                        const isDayMatch = (safeVal(v.dayType) === targetDayType || !safeVal(v.dayType));
                        return isPastOrToday && isDayMatch;
                    });
                    if (regulars.length > 0) {
                        regulars.sort((a, b) => new Date(b.startDate) - new Date(a.startDate));
                        match = regulars[0];
                    }
                }
                
                if (match) trainMap.set(tNo, match);
            });

            const finalData = Array.from(trainMap.values());
            if (finalData.length === 0) {
                showMessage('選択した条件に該当する列車はありません。');
                return;
            }
            const grouped = {};
            finalData.forEach(t => {
                const direction = safeVal(t.direction || t.railDirection);
                const numberMatch = safeVal(t.trainNumber).match(/\d+/);
                const label = direction || ((parseInt(numberMatch?.[0] || '1', 10) % 2 === 0) ? "上り" : "下り");
                if (!grouped[label]) grouped[label] = [];
                grouped[label].push(t);
            });

            Object.keys(grouped).sort().forEach((label, groupIdx) => {
                grouped[label].sort((a, b) => {
                    const sa = a.stops.find(s => s.station === station);
                    const sb = b.stops.find(s => s.station === station);
                    return (parseTimeValue(sa.arrival) || parseTimeValue(sa.departure) || 0) - (parseTimeValue(sb.arrival) || parseTimeValue(sb.departure) || 0);
                });

                grouped[label].forEach((train, rowIdx) => {
                    const s = train.stops.find(st => st.station === station);
                    const stopIdx = train.stops.findIndex(st => st.station === station);
                    const isFirst = (stopIdx === 0);
                    const isLast = (stopIdx === train.stops.length - 1);
                    
                    const tr = document.createElement('tr');
                    if (rowIdx === 0 && groupIdx > 0) tr.classList.add('row-boundary');

                    if (rowIdx === 0) {
                        const tdLine = document.createElement('td');
                        tdLine.className = 'td-line-side';
                        tdLine.rowSpan = grouped[label].length;
                        tdLine.innerText = label;
                        tr.appendChild(tdLine);
                    }

                    appendLinkCell(tr, train.trainNumber, () => showOverlay(train));
                    const typeCell = appendCell(tr, safeVal(train.type));
                    typeCell.style.textAlign = 'left';
                    typeCell.style.paddingLeft = '4px';
                    appendCell(tr, autoDeterminePower(train));
                    appendCell(tr, formatDisplayTime(s.arrival), 'col-time');
                    appendCell(tr, '');
                    appendCell(tr, formatDisplayTime(s.departure), 'col-time');
                    appendCell(tr, '');
                    appendCell(tr, safeVal(s.trackN), 'col-trk');
                    appendCell(tr, getUnyouStatus(train, isFirst, isLast));
                    const connectedNumber = isFirst ? safeVal(train.tr1) : (isLast ? safeVal(train.tr2) : '');
                    const connectionDirection = isFirst ? 'prev' : 'next';
                    appendLinkCell(tr, connectedNumber, () => showConnectedTrain(connectedNumber, train, connectionDirection));
                    const destinationCell = appendCell(tr, safeVal(train.destination));
                    destinationCell.style.textAlign = 'left';
                    destinationCell.style.paddingLeft = '4px';
                    tbody.appendChild(tr);
                });
            });
            updateClock(targetDateStr);
        }

        function timetableMatchesSelectedDay(train, selectedDate, targetDate, targetDayType) {
            const dayType = safeVal(train.dayType);
            if (train.startDate === selectedDate && !dayType) return true;
            const start = new Date(`${safeVal(train.startDate).replace(/\//g, '-')}T00:00:00`);
            return !Number.isNaN(start.getTime()) && start <= targetDate &&
                (!dayType || dayType === targetDayType);
        }

        function connectionKey(train, direction) {
            if (!train) return '';
            if (direction === 'prev') return normalizeString(train.kid1 || train.kid || '');
            return normalizeString(train.kid2 || train.kid || '');
        }

        function findConnectedTrain(trainNumber, sourceTrain, direction) {
            const number = safeVal(trainNumber);
            if (!number) return null;
            const selectedDate = document.getElementById('dateInput').value.replace(/-/g, '/');
            const targetDate = new Date(`${selectedDate.replace(/\//g, '-')}T00:00:00`);
            const targetDayType = isHoliday(targetDate) ? '土休日' : '平日';
            const candidates = rawTimetableData.filter(train =>
                normalizeString(train.trainNumber) === normalizeString(number) &&
                timetableMatchesSelectedDay(train, selectedDate, targetDate, targetDayType)
            );
            const key = connectionKey(sourceTrain, direction);
            let match = null;
            if (key) {
                match = candidates.find(train => direction === 'prev'
                    ? normalizeString(train.kid2 || '') === key
                    : normalizeString(train.kid1 || '') === key);
            }
            if (!match && sourceTrain) {
                const connectingStation = direction === 'prev' ? safeVal(sourceTrain.origin) : safeVal(sourceTrain.destination);
                match = candidates.find(train => direction === 'prev'
                    ? safeVal(train.destination) === connectingStation
                    : safeVal(train.origin) === connectingStation);
            }
            if (!match) match = candidates.find(train => train.startDate === selectedDate);
            if (!match) {
                match = candidates.sort((a, b) => new Date(b.startDate) - new Date(a.startDate))[0] || null;
            }
            return match;
        }

        function showConnectedTrain(trainNumber, sourceTrain, direction) {
            const number = safeVal(trainNumber);
            if (!number) return;
            const match = findConnectedTrain(number, sourceTrain, direction);
            if (match) showOverlay(match);
            else showMessage(`接続列車 ${number} の時刻表が見つかりません。`);
        }

        function showOverlay(trainOrNumber, sDate) {
            const train = typeof trainOrNumber === 'object' && trainOrNumber
                ? trainOrNumber
                : rawTimetableData.find(v => v.trainNumber === trainOrNumber && v.startDate === sDate);
            if (!train) return;

            const serviceRows = (train.stops || []).map(stop => ({ stop }));

            lastModalFocus = document.activeElement;
            const selectedDate = document.getElementById('dateInput').value.replace(/-/g, '/');
            document.getElementById('modalTitle').textContent = 'モバイル ATOS アプリ　Ver2.4.0';
            const summary = document.getElementById('modalTrainInfo');
            summary.replaceChildren(
                document.createTextNode(`■${safeVal(train.line)} 施行日:${selectedDate}`),
                document.createElement('br'),
                document.createTextNode(`運転区間:${safeVal(train.origin)}～${safeVal(train.destination)} 列車番号:${safeVal(train.trainNumber)}`)
            );

            const table = document.createElement('table');
            table.className = 'detail-table';
            table.innerHTML = `<colgroup>
                <col style="width:9%"><col style="width:4%"><col style="width:14%">
                <col style="width:13%"><col style="width:4%"><col style="width:13%"><col style="width:4%">
                <col style="width:10%"><col style="width:10%"><col style="width:9%">
                </colgroup><thead>
                <tr>
                    <th rowspan="2">列車種別</th>
                    <th rowspan="2">抑止</th>
                    <th rowspan="2">駅名</th>
                    <th colspan="2">着時刻</th>
                    <th colspan="2">発時刻</th>
                    <th rowspan="2">番線</th>
                    <th rowspan="2">運用<br>情報</th>
                    <th rowspan="2">運用列番</th>
                </tr>
                <tr>
                    <th>時間</th><th class="cell-narrow">到着</th>
                    <th>時間</th><th class="cell-narrow">発車</th>
                </tr>
                </thead>`;
            const modalBody = document.createElement('tbody');
            serviceRows.forEach((serviceRow, index) => {
                const s = serviceRow.stop;
                const row = document.createElement('tr');
                const isFirst = index === 0;
                const isLast = index === serviceRows.length - 1;
                const connectedNumber = isFirst ? safeVal(train.tr1) : (isLast ? safeVal(train.tr2) : '');
                appendCell(row, isFirst ? safeVal(train.type) : '');
                appendCell(row, '');
                appendCell(row, safeVal(s.station));
                appendCell(row, formatDisplayTime(s.arrival), 'col-time');
                appendCell(row, '');
                appendCell(row, safeVal(s.departure) ? formatDisplayTime(s.departure) : '', 'col-time');
                appendCell(row, '');
                appendCell(row, safeVal(s.trackN), 'col-trk');
                appendCell(row, getUnyouStatus(train, isFirst, isLast));
                appendLinkCell(row, connectedNumber, () => showConnectedTrain(connectedNumber, train, isFirst ? 'prev' : 'next'));
                modalBody.appendChild(row);
            });
            table.appendChild(modalBody);
            document.getElementById('modalTableContainer').replaceChildren(table);
            updateClock(selectedDate);
            document.getElementById('modalOverlay').style.display = 'block';
            document.querySelector('#modalOverlay .modal-content').scrollTop = 0;
            document.querySelector('#modalOverlay .close-btn').focus();
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            if (lastModalFocus && typeof lastModalFocus.focus === 'function') lastModalFocus.focus();
        }

        function updateClock(dateStr) {
            const d = new Date();
            const fmt = (n) => String(n).padStart(2, '0');
            const display = `${dateStr} ${fmt(d.getHours())}:${fmt(d.getMinutes())}:${fmt(d.getSeconds())} 現在`;
            document.getElementById('clockDisplay').innerText = display;
            document.getElementById('modalClockDisplay').innerText = display;
        }

        document.getElementById('lineSelect').addEventListener('change', handleLineChange);
        document.getElementById('stationSelect').addEventListener('change', () => {
            saveSelection();
            render();
        });
        document.getElementById('dateInput').addEventListener('change', () => {
            saveSelection();
            render();
        });
        document.getElementById('modalOverlay').addEventListener('click', event => {
            if (event.target.id === 'modalOverlay') closeModal();
        });
        document.addEventListener('keydown', event => {
            if (event.key === 'Escape' && document.getElementById('modalOverlay').style.display === 'block') closeModal();
        });

        window.onload = () => {
            const dateInput = document.getElementById('dateInput');
            dateInput.value = localInputDate();
            updateClock(dateInput.value.replace(/-/g, '/'));
            setInterval(() => updateClock(dateInput.value.replace(/-/g, '/')), 1000);
            loadData();
        };
    </script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="../auth_guard.js"></script>
</body>
