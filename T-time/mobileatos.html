<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モバイル ATOS アプリ Ver2.4.0</title>
    <style>
        /* ===========================================================
         【 色設定エリア 】
         ===========================================================
        */
        :root {
            /* ▼ 濃い緑（テーブルヘッダー背景色） */
            --atos-table-header: #1A968A; 
            
            /* その他基本色 */
            --bg-white: #ffffff;
            --row-gray: #cfcfcf;
            --text-black: #222;
            --border-white: #ffffff;
            --error-red: #ff0000;
            
            /* ==================================================
             ★★★ 幅・高さ調整エリア (ここで数値を変更可能) ★★★
             -------------------------------------------------- */
            /* ▼ 着時刻・発時刻の「実績」の幅 */
            --time-status-width: 86px;
            
            /* ▼ 着時刻・発時刻の「時間」(計画) の幅 */
            --time-plan-width: 90px;

            /* ▼ テーブルの行の高さ (縦幅) */
            --atos-row-height: 26px;
            /* ================================================== */
        }

        body {
            font-family: "MS Gothic", "MS PGothic", "Hiragino Kaku Gothic ProN", sans-serif;
            background-color: var(--bg-white);
            margin: 0;
            padding: 0;
            font-size: 15px;
            color: var(--text-black);
            overflow-x: hidden;
            font-weight: bold;
        }
        
        /* 全体コンテンツの最大幅 (1000px: iPadmini対応) */
        #appContainer {
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 0 5px; 
            font-size: 15px;
            font-weight: bold;
        }
        
        /* --- Header --- */
        .system-header {
            background: linear-gradient(to bottom, #f0f0f0, #d0d0d0);
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #999;
            color: #444;
            height: 30px;
        }
        
        .header-title { font-size: 16px; flex-grow: 1; text-align: center; }
        .clock-area {
            background-color: transparent; color: #333; padding: 2px 8px;
            font-family: inherit; font-size: 15px; min-width: 180px;
            text-align: right; font-weight: bold; width: 180px; 
        }
        .icon-menu {
            width: 20px; height: 16px; border-top: 3px solid #666; 
            border-bottom: 3px solid #666; position: relative; flex-shrink: 0;
        }
        .icon-menu::after {
            content: ""; position: absolute; top: 4px; width: 100%; height: 3px; background: #666;
        }

        /* --- Filter Bar --- */
        .filter-bar {
            background-color: #e0e0e0; padding: 8px; display: flex; align-items: center;
            gap: 15px; border-bottom: 1px solid #999; flex-wrap: nowrap; overflow-x: auto; font-size: 15px;
        }
        .filter-label-text { color: #333; white-space: nowrap; }
        .filter-group { display: flex; align-items: center; gap: 5px; }
        select, input {
            border: 1px solid #999; padding: 2px 4px; font-size: 15px;
            height: 24px; border-radius: 2px; font-weight: bold; font-family: inherit;
        }
        input[type="date"] { width: 130px; text-align: center; padding-right: 2px; }
        input#trainNoInput { background-color: #fff9c4; width: 70px; text-align: left; }

        .error-msg {
            color: var(--error-red); font-weight: bold; padding: 10px; font-size: 16px;
            background-color: var(--bg-white); border-bottom: 1px solid #ccc;
        }
        .error-msg.searching { color: #315447; background: #eef7f2; }
        #debugArea { display: none !important; }

        /* --- Train Summary --- */
        .train-summary {
            background-color: #eee; padding: 5px 10px; font-size: 15px;
            border-bottom: 1px solid #ccc; line-height: 1.5; font-weight: bold;
        }

        /* --- Main Table --- */
        .monitor-table-container { width: 100%; overflow-x: auto; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            color: #000;
            table-layout: fixed; 
        }

        /* colgroupで幅を一括管理 */
        col.col-wide { width: var(--time-plan-width); }
        col.col-narrow { width: var(--time-status-width); }

        th {
            background-color: var(--atos-table-header); color: white;
            border: 1px solid var(--border-white); padding: 0 2px;
            font-weight: bold; white-space: nowrap; text-align: center;
            height: var(--atos-row-height);
            overflow: hidden; 
        }
        
        /* 実績時刻が省略されない幅を確保 */
        th.cell-narrow { font-size: 12px; }

        td {
            border: 1px solid var(--border-white); padding: 0 4px;
            text-align: center; background-color: var(--row-gray);
            height: var(--atos-row-height);
            font-weight: bold; font-size: 16px; line-height: var(--atos-row-height);
            vertical-align: middle;
            white-space: nowrap; overflow: hidden; 
        }
        
        /* 各列の文字寄せ */
        .col-align-left { text-align: left !important; padding-left: 8px !important; }
        .col-align-right { text-align: right !important; padding-right: 5px !important; }
        
        /* 実績列 (到着/発車) */
        td:nth-child(5), td:nth-child(7) { 
            text-align: center !important; 
            padding: 0 !important; 
            font-size: 13px;
        }
        
        /* 時刻列 (時間) */
        td:nth-child(4), td:nth-child(6) {
            text-align: right !important;
            padding-right: 5px !important;
        }
        
        /* 駅名 */
        td:nth-child(3) { text-align: left !important; padding-left: 10px !important; }

        /* 番線 */
        td:nth-child(8) { text-align: right !important; padding-right: 5px !important; }

        /* 運休は駅名と時刻だけを白字にする。種別・番線・運用は通常の黒字を維持。 */
        .cancelled-row td.cancelled-cell { background: #4b5563; color: #fff; }
        .cancelled-row td.cancelled-equals { color: #000; }


        .link-text {
            appearance: none;
            -webkit-appearance: none;
            display: inline;
            min-width: 0;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 0;
            background: transparent;
            color: #0000EE;
            text-decoration: underline;
            cursor: pointer;
            font: inherit;
            font-size: inherit;
            font-weight: inherit;
            line-height: inherit;
            vertical-align: baseline;
        }
        .link-text:focus-visible { outline: 1px dotted #0000EE; outline-offset: 1px; }

        /* --- Footer --- */
        .footer-legend {
            background-color: var(--bg-white); padding: 10px 10px 5px 10px;
            font-size: 15px; font-weight: bold; margin-top: 15px;
        }
        .footer-legend::after { content: ""; display: block; height: 150px; }
        .hidden { display: none !important; }

        @media (max-width: 700px) {
            .system-header { height: auto; min-height: 46px; padding: 8px 10px; gap: 8px; }
            .header-title { min-width: 0; text-align: left; font-size: 14px; line-height: 1.25; }
            .clock-area { min-width: 116px; width: 116px; padding: 2px 0; font-size: 12px; }
            #appContainer { padding: 0; }
            .filter-bar { display: grid; grid-template-columns: 1fr; gap: 8px; overflow: visible; white-space: normal; }
            .filter-group { width: 100%; display: grid; grid-template-columns: 84px minmax(0, 1fr); }
            .filter-group select, .filter-group input { width: 100% !important; min-height: 40px; font-size: 16px; }
            .monitor-table-container { overscroll-behavior-inline: contain; }
            .monitor-table-container table { width: 980px; min-width: 980px; }
            .footer-legend { font-size: 13px; }
        }
    </style>

<body>

    <div class="system-header">
        <div class="icon-menu"></div>
        <div class="header-title">モバイル ATOS アプリ Ver2.4.0</div>
        <div class="clock-area" id="clockDisplay">----/--/-- --:--:-- 現在</div>
    </div>
    
    <div id="appContainer">
        <div class="filter-bar">
            <div class="filter-group">
                <span class="filter-label-text">線区：</span>
                <select id="lineSelect" onchange="performSearch()"><option value="">(選択)</option></select>
            </div>
            <div class="filter-group">
                <span class="filter-label-text">施行日：</span>
                <input type="date" id="dateInput" onchange="performSearch()">
            </div>
            <div class="filter-group">
                <span class="filter-label-text">列車番号：</span>
                <select id="crownSelect" style="width:50px;" onchange="performSearch()">
                    <option value=""></option><option value="回">回</option><option value="試">試</option><option value="単">単</option><option value="工">工</option><option value="配">配</option><option value="試単">試単</option><option value="出">出</option><option value="入">入</option>
                </select>
                <input type="text" id="trainNoInput" value="" oninput="scheduleSearch()">
            </div>
        </div>

        <div id="messageArea" class="error-msg hidden"></div>
        
        <div id="contentArea" class="hidden">
            <div class="train-summary" id="trainSummary"></div>

            <div class="monitor-table-container">
                <table>
                    <colgroup>
                        <col style="width: 70px;"> <col style="width: 30px;"> <col style="width: 100px;"> <col class="col-wide">   <col class="col-narrow"> <col class="col-wide">   <col class="col-narrow"> <col style="width: 70px;"> <col style="width: 40px;"> <col style="width: 70px;"> </colgroup>
                    
                    <thead>
                        <tr>
                            <th rowspan="2">列車種別</th>
                            <th rowspan="2">抑止</th>
                            <th rowspan="2">駅名</th>
                            <th colspan="2">着時刻</th>
                            <th colspan="2">発時刻</th>
                            <th rowspan="2">番線</th>
                            <th rowspan="2">運用<br>情報</th>
                            <th rowspan="2">運用列番</th>
                        </tr>
                        <tr>
                            <th>計画</th>
                            <th class="cell-narrow">実績</th>
                            <th>計画</th>
                            <th class="cell-narrow">実績</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody"></tbody>
                </table>
            </div>

            <div class="footer-legend">
                「$」…運休　「*」…運済　「#」…変更　「¥」…運転禁止
            </div>
        </div>
    </div>

    <script src="private-data-client.js"></script>
    <script src="yard-movement.js"></script>
    <script>
        let rawJsonData = [];
        const ODPT_BASE = '/api/odpt/challenge/';
        const HISTORY_API = 'https://history.tayunet-traininfo.com/api/v1/train-history';
        const odptRailways = new Map();
        const odptStations = new Map();
        let searchRevision = 0;
        let searchTimer;

        function formatDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }
        function formatJsonDate(date) {
            if (typeof date === 'string') return date.replace(/-/g, '/');
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}/${m}/${d}`;
        }
        function normalizeString(str) {
            if (typeof str !== 'string') return '';
            let normalized = str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
                return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
            });
            return normalized.toUpperCase().replace(/\s/g, '').trim();
        }
        function stationKey(value) {
            return normalizeString(String(value || '').split('.').pop().replace(/^[\$＄]/, ''));
        }
        function stationName(id) {
            return odptStations.get(id) || odptStations.get(stationKey(id)) || String(id || '').split('.').pop() || '不明';
        }
        function sameLine(left, right) {
            const comparable = value => normalizeString(value).replace(/JR東日本|JR|本線|線/g, '');
            return Boolean(left && right && comparable(left) === comparable(right));
        }
        function railwayName(id) {
            return odptRailways.get(id) || String(id || '').split('.').pop();
        }
        function railwayIdForLine(name) {
            return [...odptRailways].find(([, title]) => sameLine(name, title))?.[0] || '';
        }
        async function loadOdptMetadata() {
            const request = async resource => {
                const response = await fetch(`${ODPT_BASE}${resource}?odpt:operator=odpt.Operator:JR-East`);
                if (!response.ok) throw new Error(`ODPT ${resource} HTTP ${response.status}`);
                return response.json();
            };
            const [railwayResult, stationResult] = await Promise.allSettled([request('odpt:Railway'), request('odpt:Station')]);
            if (railwayResult.status === 'rejected' && stationResult.status === 'rejected') throw railwayResult.reason;
            const railways = railwayResult.status === 'fulfilled' ? railwayResult.value : [];
            (Array.isArray(railways) ? railways : []).forEach(railway => {
                const id = railway['owl:sameAs'];
                const name = railway['odpt:railwayTitle']?.ja;
                if (id && name) odptRailways.set(id, name);
                (railway['odpt:stationOrder'] || []).forEach(stop => {
                    const stationId = stop['odpt:station'];
                    const title = stop['odpt:stationTitle']?.ja;
                    if (stationId && title) {
                        odptStations.set(stationId, title);
                        odptStations.set(stationKey(stationId), title);
                    }
                });
            });
            const stations = stationResult.status === 'fulfilled' ? stationResult.value : [];
            (Array.isArray(stations) ? stations : []).forEach(station => {
                const id = station['owl:sameAs'];
                const title = station['odpt:stationTitle']?.ja;
                if (id && title) {
                    odptStations.set(id, title);
                    odptStations.set(stationKey(id), title);
                }
            });
        }
        function observedTime(item) {
            const date = new Date(item?.observedAt || '');
            if (Number.isNaN(date.getTime())) return '';
            return new Intl.DateTimeFormat('ja-JP', {timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23'}).format(date);
        }
        function historyStops(history) {
            return Object.entries(history?.stations || {}).map(([id, record]) => {
                const firstSeen = [record?.arrival?.observedAt, record?.departure?.observedAt, record?.observedAt].filter(Boolean).sort()[0] || '';
                return {station: stationName(id), stationId: id, arrival: '', departure: '',
                    arrivalActual: observedTime(record?.arrival), departureActual: observedTime(record?.departure),
                    trackN: '', firstSeen};
            }).filter(stop => stop.firstSeen).sort((left, right) => left.firstSeen.localeCompare(right.firstSeen));
        }
        function historyOnlyRecord(history, selectedLine, trainNumber) {
            const stops = historyStops(history);
            if (!stops.length) return null;
            return {trainNumber, line: selectedLine || railwayName(history.railways?.[0]),
                type: '—', origin: stops[0].station, destination: stops.at(-1).station, stops, historyOnly: true};
        }
        function supplementWithHistory(data, history) {
            if (!history?.count) return data;
            const observed = new Map(Object.entries(history.stations || {}).map(([id, record]) => [stationKey(id), record]));
            return {...data, stops: data.stops.map(stop => {
                const record = observed.get(stationKey(stop.stationId || stop.station));
                return {...stop, arrivalActual: observedTime(record?.arrival), departureActual: observedTime(record?.departure)};
            })};
        }
        function odptRecord(data) {
            const stops = (data['odpt:trainTimetableObject'] || []).map(stop => {
                const stationId = stop['odpt:departureStation'] || stop['odpt:arrivalStation'] || stop['odpt:station'];
                return {station: stationName(stationId), stationId,
                    arrival: stop['odpt:arrivalTime'] || '', departure: stop['odpt:departureTime'] || '',
                    trackN: stop['odpt:platformNumber'] || ''};
            }).filter(stop => stop.stationId);
            if (!stops.length) return null;
            const typeKey = String(data['odpt:trainType'] || '').split('.').pop();
            const types = {Local: '普通', Rapid: '快速', SpecialRapid: '特別快速', LimitedExpress: '特急', Express: '急行'};
            return {trainNumber: data['odpt:trainNumber'], line: railwayName(data['odpt:railway']),
                type: types[typeKey] || typeKey || '—',
                origin: data['odpt:originStation']?.[0] ? stationName(data['odpt:originStation'][0]) : stops[0].station,
                destination: data['odpt:destinationStation']?.[0] ? stationName(data['odpt:destinationStation'][0]) : stops.at(-1).station,
                stops, odptRailway: data['odpt:railway']};
        }
        async function searchOdpt(trainNumber, calendar, selectedLine) {
            const query = new URLSearchParams({'odpt:operator': 'odpt.Operator:JR-East',
                'odpt:trainNumber': trainNumber, 'odpt:calendar': `odpt.Calendar:${calendar}`});
            const response = await fetch(`${ODPT_BASE}odpt:TrainTimetable?${query}`);
            if (!response.ok) throw new Error(`ODPT列車時刻 HTTP ${response.status}`);
            const rows = await response.json();
            const candidates = (Array.isArray(rows) ? rows : []).filter(row => normalizeString(row['odpt:trainNumber']) === normalizeString(trainNumber));
            const selectedRailway = railwayIdForLine(selectedLine);
            const match = candidates.find(row => row['odpt:railway'] === selectedRailway || sameLine(railwayName(row['odpt:railway']), selectedLine))
                || (!selectedRailway && candidates.length === 1 ? candidates[0] : null);
            return {record: match ? odptRecord(match) : null, relatedRailways: []};
        }
        async function searchHistory(date, trainNumber, railway, relatedRailways = []) {
            const query = new URLSearchParams({date, trainNumber});
            if (railway) query.set('railway', railway);
            [...new Set(relatedRailways)].filter(id => id && id !== railway).forEach(id => query.append('relatedRailway', id));
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 6000);
            try {
                const response = await fetch(`${HISTORY_API}?${query}`, {signal: controller.signal});
                if (!response.ok) throw new Error(`Ubuntu履歴 HTTP ${response.status}`);
                return await response.json();
            } finally { clearTimeout(timeout); }
        }
        function scheduleSearch() {
            ++searchRevision;
            clearTimeout(searchTimer);
            searchTimer = setTimeout(performSearch, 250);
        }
        function isHoliday(date) {
            return window.TayunetCalendar?.isHoliday(date) || date.getDay() === 0 || date.getDay() === 6;
        }

        async function loadData() {
            const [privateData, odptData] = await Promise.allSettled([
                TayunetPrivateData.fetchTimetables(), loadOdptMetadata()
            ]);
            if (privateData.status === 'fulfilled') rawJsonData = privateData.value;
            else console.warn('登録時刻表を取得できませんでした。ODPTの検索を続けます。', privateData.reason);
            if (odptData.status === 'rejected') console.warn('ODPT路線情報を取得できませんでした。', odptData.reason);
            if (privateData.status === 'rejected' && odptData.status === 'rejected') {
                const msgArea = document.getElementById('messageArea');
                msgArea.innerText = '時刻表と路線情報を取得できませんでした。通信状態を確認してください。';
                msgArea.classList.remove('hidden');
            }
        }
        
        async function performSearch() {
            const revision = ++searchRevision;
            const lineSelect = document.getElementById('lineSelect');
            const dateInput = document.getElementById('dateInput');
            const crownSelect = document.getElementById('crownSelect');
            const noInput = document.getElementById('trainNoInput');
            const messageArea = document.getElementById('messageArea'); 
            const contentArea = document.getElementById('contentArea');

            const selectedLine = lineSelect.value;
            const selectedDateUI = dateInput.value; 
            
            if (selectedDateUI === "") {
                 contentArea.classList.add('hidden');
                 messageArea.classList.add('hidden');
                 return;
            }
            
            const searchDate = new Date(`${selectedDateUI}T12:00:00`);
            const crownPart = crownSelect.value;
            const numberPart = noInput.value;
            const targetTrainNoNormalized = normalizeString(crownPart + numberPart);
            const selectedDateJSON = formatJsonDate(searchDate); 

            contentArea.classList.add('hidden');
            messageArea.classList.add('hidden');
            messageArea.classList.remove('searching');
            
            if (targetTrainNoNormalized === "" || selectedLine === "") return;
            messageArea.innerText = '列車を検索しています…';
            messageArea.classList.add('searching');
            messageArea.classList.remove('hidden');
            
            const isTargetHoliday = isHoliday(searchDate);
            const searchDayType = isTargetHoliday ? "土休日" : "平日";
            const candidates = rawJsonData.filter(d =>
                d.line === selectedLine && normalizeString(d.trainNumber) === targetTrainNoNormalized
            );
            let result = TayunetTimetableVersion.selectForDate(candidates, selectedDateJSON, searchDayType);

            let source = '登録時刻表';
            let relatedRailways = [];
            if (!result) {
                try {
                    const odpt = await searchOdpt(crownPart + numberPart,
                        isTargetHoliday ? 'SaturdayHoliday' : 'Weekday', selectedLine);
                    result = odpt.record;
                    relatedRailways = odpt.relatedRailways;
                    if (result) source = 'ODPT列車時刻表（曜日別の基準ダイヤ）';
                } catch (error) { console.warn('ODPT列車時刻表を取得できませんでした。', error); }
            }
            const railway = result?.odptRailway || railwayIdForLine(selectedLine);
            let history = null;
            try {
                history = await searchHistory(selectedDateUI, crownPart + numberPart, railway, relatedRailways);
            } catch (error) { console.warn('Ubuntu列車運行履歴を取得できませんでした。', error); }
            if (revision !== searchRevision) return;
            if (!result && history?.count && (railway || (history.railways || []).some(id => sameLine(railwayName(id), selectedLine)))) {
                result = historyOnlyRecord(history, selectedLine, crownPart + numberPart);
                source = 'Ubuntu列車運行履歴（実績）';
            } else if (result && history?.count) {
                result = supplementWithHistory(result, history);
                source += ' ＋ Ubuntu運行履歴';
            }
            if (result) {
                updateSummaryAndTable(result, selectedLine, selectedDateJSON, crownPart, numberPart, source);
            } else {
                contentArea.classList.add('hidden');
                messageArea.classList.remove('searching');
                messageArea.innerText = `列車番号 (${crownPart}${numberPart}) は登録時刻表・ODPT・Ubuntu運行履歴に見つかりませんでした（${selectedLine}、${selectedDateJSON}）。`;
                messageArea.classList.remove('hidden');
            }
        }
        
        function updateSummaryAndTable(result, selectedLine, selectedDateJSON, crownPart, numberPart, source = '登録時刻表') {
            if (TayunetYardMovement.open(result, selectedDateJSON)) return;
            document.getElementById('contentArea').classList.remove('hidden');
            document.getElementById('messageArea').classList.add('hidden');
            document.getElementById('messageArea').classList.remove('searching');
            const summary = document.getElementById('trainSummary');
            summary.replaceChildren(document.createTextNode(`■${selectedLine} 施行日:${selectedDateJSON}`),
                document.createElement('br'), document.createTextNode(
                    `運転区間:${result.origin}～${result.destination} 列車番号:${crownPart}${numberPart}`));
            updateSystemClock(selectedDateJSON);
            renderTable(result);
        }
        
        /**
         * 計画時刻文字列を正規化し、通過記号を「…」に統一、または空白を維持する
         * @param {string | null | undefined} timeStr 
         * @returns {string} 表示用の文字列
         */
        function getDisplayTime(timeStr) {
            // 1. データが完全に「 」（半角/全角の空白1つ）の場合はそれを維持する
            if (timeStr === ' ') {
                return ' ';
            }
            
            // 2. null, undefined, 空文字列、および「・・・」や「...」などの通過記号を「…」に統一
            // 「ー」や「-」も通過を示す記号として処理
            const passageSymbols = ['…', '...', '・・・', 'ー', '-']; 
            
            if (
                !timeStr || // null, undefined
                String(timeStr).trim() === '' || // 空白のみ or 空文字列
                passageSymbols.includes(String(timeStr)) // 明示的な通過記号
            ) {
                return '…';
            }
            
            // 3. それ以外（時刻など）はそのまま返す
            return timeStr;
        }


        // ==========================================
        //  テーブル描画処理 
        // ==========================================
        function renderTable(data) {
            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';
            const totalStops = data.stops.length;

            data.stops.forEach((stop, index) => {
                const tr = document.createElement('tr');
                const cancelled = /^[\$＄]/.test(String(stop.station || '').trimStart());
                if (cancelled) tr.classList.add('cancelled-row');
                
                const typeText = (index === 0) ? data.type : '';
                
                const operation = TayunetTimetableOperations.forStop(data, stop, index);
                const opInfo = operation.type;
                const opTrain = operation.trainNumber
                    ? {number:operation.trainNumber, kid:operation.kid, direction:operation.direction, connectionStation:stop.station}
                    : null;

                // ★★★ 修正箇所: 着時刻の表示を正規化関数で処理 ★★★
                const displayArrival = data.historyOnly ? '' : getDisplayTime(stop.arrival);
                const displayDeparture = stop.departure || ''; // 発時刻は空なら空文字列（始発/終着）
                
                const appendCell = (value, className = '') => {
                    const td = document.createElement('td'); td.className = className;
                    td.textContent = value == null ? '' : String(value); tr.appendChild(td); return td;
                };
                const timeClass = cancelled ? ' cancelled-cell' : '';
                appendCell(typeText, 'col-align-left'); appendCell(''); appendCell(stop.station, `col-station${timeClass}`);
                appendCell(displayArrival, `col-align-right${timeClass}`); appendCell(stop.arrivalActual || '', `col-align-center cell-narrow${timeClass}`);
                appendCell(displayDeparture, `col-align-right${cancelled && displayDeparture === '=' ? ' cancelled-equals' : timeClass}`);
                appendCell(stop.departureActual || '', `col-align-center cell-narrow${timeClass}`);
                appendCell(stop.trackN, 'col-align-right'); appendCell(opInfo);
                const opCell = appendCell('');
                if (opTrain) {
                    const link = document.createElement('button'); link.type = 'button';
                    link.className = 'link-text'; link.textContent = opTrain.number;
                    link.addEventListener('click', () => jumpToTrain(opTrain.number, opTrain.kid, opTrain.direction, opTrain.connectionStation));
                    opCell.appendChild(link);
                }

                tbody.appendChild(tr);
            });
        }

        function jumpToTrain(targetTrainNum, currentKid, direction, connectionStation = '') {
            if (rawJsonData.length === 0) return;
            const targetTrainNumNormalized = normalizeString(targetTrainNum);
            const currentKidNormalized = normalizeString(currentKid);
            const selectedDateJSON = document.getElementById('dateInput').value.replace(/-/g, '/');

            let match = null;
            const candidates = rawJsonData.filter(d => 
                normalizeString(d.trainNumber) === targetTrainNumNormalized
            );
            const stationKey = normalizeString(connectionStation).replace(/[\s　駅]/g, '');
            const connectionCandidates = candidates.filter(d => {
                const stops = d.stops || [];
                if(direction === 'either') {
                    const first = stops[0]?.station || d.origin;
                    const last = stops[stops.length - 1]?.station || d.destination;
                    return !stationKey || [first, last].some(value => normalizeString(value).replace(/[\s　駅]/g, '') === stationKey);
                }
                const endpoint = direction === 'prev'
                    ? (stops[stops.length - 1]?.station || d.destination)
                    : (stops[0]?.station || d.origin);
                return !stationKey || normalizeString(endpoint).replace(/[\s　駅]/g, '') === stationKey;
            });
            
            if (currentKidNormalized !== "") {
                if (direction === 'prev') {
                    const matches = connectionCandidates.filter(d => normalizeString(d.kid2 || d.kid || '') === currentKidNormalized);
                    if (matches.length === 1) match = matches[0];
                } else if (direction === 'next') {
                    const matches = connectionCandidates.filter(d => normalizeString(d.kid1 || d.kid || '') === currentKidNormalized);
                    if (matches.length === 1) match = matches[0];
                }
            }

            if (!match) {
                 const selectedDate = new Date(`${selectedDateJSON.replace(/\//g, '-')}T12:00:00`);
                 const selectedDayType = isHoliday(selectedDate) ? '土休日' : '平日';
                 const dated = TayunetTimetableVersion.versionsForDate(connectionCandidates, selectedDateJSON, selectedDayType);
                 if (dated.length === 1) match = dated[0];
                 else if (connectionCandidates.length === 1) match = connectionCandidates[0];
            }

            if (match) {
                if (TayunetYardMovement.open(match, selectedDateJSON)) return;
                document.getElementById('lineSelect').value = match.line;
                const trainNum = match.trainNumber;
                let crown = match.crown || "";
                let numOnly = trainNum;
                if (crown && trainNum.startsWith(crown)) {
                    numOnly = trainNum.substring(crown.length);
                } else {
                    const potentialCrowns = ["試単", "回", "試", "単", "工", "配", "出", "入"];
                    for (const pc of potentialCrowns) {
                        if (trainNum.startsWith(pc)) {
                            crown = pc;
                            numOnly = trainNum.substring(pc.length);
                            break;
                        }
                    }
                }
                document.getElementById('crownSelect').value = crown;
                document.getElementById('trainNoInput').value = numOnly;
                
                performSearch();
            } else {
                const msgArea = document.getElementById('messageArea');
                msgArea.innerText = `リンク先の列車番号 (${targetTrainNum}) のデータが見つかりません。`;
                msgArea.classList.remove('hidden');
                document.getElementById('contentArea').classList.add('hidden');
            }
        }

        function updateSystemClock(dateStr) {
            if (!dateStr) return;
            try {
                const d = new Date(dateStr);
                d.setDate(d.getDate() - 2); 
                d.setHours(22, 45);
                const randomSec = Math.floor(Math.random() * 60);
                d.setSeconds(randomSec);
                const fmt = (n) => String(n).padStart(2, '0');
                const str = `${d.getFullYear()}/${fmt(d.getMonth()+1)}/${fmt(d.getDate())} ${fmt(d.getHours())}:${fmt(d.getMinutes())}:${fmt(d.getSeconds())} 現在`;
                document.getElementById('clockDisplay').innerText = str;
            } catch(e) {}
        }
        
        window.onload = async function() {
            document.getElementById('dateInput').value = formatDate(new Date());
            await loadData();
            populateLines(); 
            performSearch(); 
        };

        function populateLines() {
            const select = document.getElementById('lineSelect');
            select.innerHTML = '<option value="">(選択)</option>';
            const lines = [...new Set([...rawJsonData.map(d => d.line), ...odptRailways.values()].filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ja'));
            lines.forEach(line => {
                const option = document.createElement('option');
                option.value = line;
                option.text = line;
                select.appendChild(option);
            });
        }
