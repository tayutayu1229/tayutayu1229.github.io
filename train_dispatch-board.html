<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#143a2b">
  <title>運転整理在線ボード - 東京圏輸送情報システム</title>
  <style>
    :root{--green:#006149;--green2:#087558;--ink:#17221e;--muted:#607069;--bg:#edf1ef;--panel:#fff;--line:#c8d1cd;--red:#c73631;--amber:#b96b00;--blue:#176896;font-family:"Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;color:var(--ink);background:var(--bg)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg)}button,select,input{font:inherit}.header{height:54px;background:#143a2b;border-bottom:4px solid #0c8a61;color:#fff}.header-inner{display:flex;align-items:center;width:min(1600px,100%);height:100%;margin:auto;padding:0 14px}.brand{font-weight:900}.sub{margin-left:12px;color:#c9ddd5;font-size:11px}.nav{display:flex;height:100%;margin-left:auto}.nav a{display:flex;align-items:center;padding:0 12px;border-left:1px solid #ffffff2d;color:#fff;font-size:11px;text-decoration:none}.clock{min-width:85px;margin-left:12px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}.page{width:min(1600px,calc(100% - 16px));margin:8px auto 24px}.title{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid #aebbb5;border-left:7px solid var(--green2);background:#fff}.title h1{margin:0;font-size:18px}.title p{margin:0;color:var(--muted);font-size:10px}.live{display:flex;align-items:center;gap:5px;margin-left:auto;color:var(--muted);font-size:10px}.dot{width:8px;height:8px;border-radius:50%;background:#12a871}.dot.loading{background:#d08a16;animation:blink 1s infinite}.dot.error{background:var(--red)}@keyframes blink{50%{opacity:.3}}
    .toolbar{display:flex;align-items:end;flex-wrap:wrap;gap:7px;margin-top:7px;padding:7px;border:1px solid #aebbb5;background:#fff}.field{min-width:170px}.field.grow{flex:1;min-width:230px}.field label{display:block;margin-bottom:3px;color:var(--muted);font-size:9px;font-weight:800}.field select,.field input{width:100%;height:34px;padding:4px 7px;border:1px solid #879790;border-radius:0;background:#fff}.btn{height:34px;padding:4px 12px;border:1px solid #064b38;border-radius:0;background:var(--green2);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:#153b2d}.summary{display:grid;grid-template-columns:repeat(5,1fr);margin-top:7px;border:1px solid #aebbb5;background:#fff}.metric{padding:7px 10px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}.metric small{display:block;color:var(--muted);font-size:9px}.metric strong{font-size:20px;font-variant-numeric:tabular-nums}.metric.alert strong{color:var(--red)}.metric.warn strong{color:var(--amber)}
    .workspace{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:7px;margin-top:7px}.board{min-width:0;border:1px solid #899890;background:#fff}.board-head{display:flex;align-items:center;min-height:38px;padding:6px 9px;border-bottom:1px solid #899890;background:#e7ece9}.line-mark{width:8px;align-self:stretch;margin:-6px 9px -6px -9px;background:var(--route,#666)}.board-head h2{margin:0;font-size:14px}.board-head span{margin-left:auto;color:var(--muted);font-size:9px}.track-scroll{overflow:auto}.track{position:relative;height:360px;min-width:980px;background-color:#fbfcfb;background-image:linear-gradient(#edf0ee 1px,transparent 1px),linear-gradient(90deg,#edf0ee 1px,transparent 1px);background-size:28px 28px}.rail{position:absolute;left:38px;right:38px;top:50%;height:7px;transform:translateY(-50%);background:var(--route,#666)}.direction-label{position:absolute;z-index:4;left:6px;padding:2px 6px;background:#183a2d;color:#fff;font-size:9px;font-weight:900}.direction-label.down{top:9px}.direction-label.up{bottom:9px}.station{position:absolute;top:50%;z-index:5;transform:translate(-50%,-50%);width:72px;padding:6px 3px;border:2px solid #173f2f;background:#fff;text-align:center;font-size:9px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.train{position:absolute;z-index:7;width:112px;height:45px;transform:translateX(-50%);border:3px solid var(--train-color,#666);background:#fff;clip-path:polygon(0 0,calc(100% - 21px) 0,100% 21px,100% 100%,0 100%);cursor:pointer}.train.up{clip-path:polygon(21px 0,100% 0,100% 100%,0 100%,0 21px)}.train.delay{background:#fff0f0;border-color:var(--red)}.train.close{box-shadow:0 0 0 4px #f1a72f99}.train strong,.train small{display:block;overflow:hidden;text-align:center;text-overflow:ellipsis;white-space:nowrap}.train strong{padding-top:4px;font-size:12px}.train small{color:#52615a;font-size:8px}.train .delay-badge{position:absolute;right:4px;top:3px;color:var(--red);font-size:8px;font-weight:900}.loading-message{padding:70px 20px;color:var(--muted);text-align:center}
    .side{display:flex;flex-direction:column;gap:7px}.side-panel{border:1px solid #899890;background:#fff}.side-head{padding:7px 9px;border-bottom:1px solid var(--line);background:#e7ece9;font-size:11px;font-weight:900}.alerts{margin:0;padding:0;list-style:none}.alert-row{padding:8px 9px;border-bottom:1px solid var(--line);font-size:9px;line-height:1.5}.alert-row:last-child{border-bottom:0}.alert-row strong{display:block}.alert-row.close{border-left:5px solid var(--red)}.alert-row.gap{border-left:5px solid var(--amber)}.empty{padding:18px 9px;color:var(--muted);font-size:9px;text-align:center}.focus-body{padding:9px}.focus-number{font-size:22px;font-weight:900}.focus-grid{display:grid;grid-template-columns:72px 1fr;margin-top:7px;border-top:1px solid var(--line);border-left:1px solid var(--line)}.focus-grid dt,.focus-grid dd{margin:0;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:9px}.focus-grid dt{color:var(--muted);background:#f0f3f1}.focus-grid dd{font-weight:800}.neighbor{margin-top:7px;padding:7px;border-left:4px solid var(--blue);background:#eef6fa;font-size:9px}.notice{display:none;margin-top:7px;padding:8px;border:1px solid #d6908c;background:#fff0ef;color:#8b2925;font-size:10px}.notice.show{display:block}.foot{padding:8px 2px;color:var(--muted);font-size:8px}
    @media(max-width:900px){.workspace{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.track{height:320px}.summary{grid-template-columns:repeat(3,1fr)}.metric:nth-child(3){border-right:0}.metric:nth-child(-n+3){border-bottom:1px solid var(--line)}}
    @media(max-width:600px){.sub,.clock,.nav a:not(.keep){display:none}.page{width:calc(100% - 8px);margin-top:4px}.title{flex-wrap:wrap}.title p{width:100%}.live{margin-left:0}.field{flex:1 1 130px}.field.grow{flex-basis:100%}.summary{grid-template-columns:1fr 1fr}.metric:nth-child(3){border-right:1px solid var(--line)}.metric:nth-child(even){border-right:0}.metric:last-child{grid-column:1/-1}.side{display:block}.side-panel{margin-bottom:7px}.track{height:290px}.station{width:58px;font-size:8px}.train{width:88px;height:39px}.train strong{font-size:10px}.train small{font-size:7px}}
  </style>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/css/site-brand.css">
  <script src="/assets/js/site-brand.js" defer></script>
</head>
<body>
  <div id="main-content" style="display:none">
  <header class="header"><div class="header-inner"><div class="brand">東京圏輸送情報システム</div><div class="sub">運転整理在線ボード</div><nav class="nav"><a class="keep" href="toppage.html">トップ</a><a href="ATOSlocation.html">ATOS在線</a><a href="train_zai-data.html">在線一覧</a></nav><div class="clock" id="clock">--:--:--</div></div></header>
  <main class="page">
    <section class="title"><h1>運転整理在線ボード</h1><p>列車順序・駅間間隔・遅延の参考監視</p><div class="live"><i class="dot loading" id="dot"></i><span id="status">データ取得中</span><span id="updated"></span></div></section>
    <div class="notice" id="notice" role="alert"></div>
    <section class="toolbar" aria-label="表示条件">
      <div class="field grow"><label for="line">表示路線</label><select id="line"><option value="">路線を取得中</option></select></div>
      <div class="field"><label for="direction">表示方向</label><select id="direction"><option value="all">上下線両方</option><option value="down">駅順方向</option><option value="up">反駅順方向</option></select></div>
      <div class="field"><label for="alertLevel">間隔判定</label><select id="alertLevel"><option value="standard">標準</option><option value="strict">厳しめ</option><option value="off">判定しない</option></select></div>
      <div class="field"><label for="search">列車検索</label><input id="search" type="search" placeholder="列車番号・行先"></div>
      <button class="btn" id="refresh" type="button">最新情報</button>
    </section>
    <section class="summary" aria-label="在線概況">
      <div class="metric"><small>表示列車</small><strong id="trainCount">—</strong></div><div class="metric"><small>遅延列車</small><strong id="delayCount">—</strong></div><div class="metric alert"><small>接近組</small><strong id="closeCount">—</strong></div><div class="metric warn"><small>間隔大</small><strong id="gapCount">—</strong></div><div class="metric"><small>表示駅</small><strong id="stationCount">—</strong></div>
    </section>
    <section class="workspace">
      <section class="board"><div class="board-head"><i class="line-mark"></i><h2 id="lineTitle">路線を選択</h2><span>上段：駅順方向　下段：反駅順方向</span></div><div class="track-scroll"><div class="track" id="track"><div class="loading-message">在線データを読み込んでいます</div></div></div></section>
      <aside class="side"><section class="side-panel"><div class="side-head">間隔監視</div><ul class="alerts" id="alerts"></ul></section><section class="side-panel"><div class="side-head">選択列車・前後関係</div><div class="focus-body" id="focus"><div class="empty">列車を選択してください</div></div></section></aside>
    </section>
    <footer class="foot">接近・間隔大は公開在線位置から算出した参考判定です。閉そく・信号現示・運転整理指示を示すものではありません。</footer>
  </main>
  </div>
  <script>
  (()=>{
    'use strict';
    const API='/api/odpt/challenge/';
    const NAMES={Yamanote:'山手線',ChuoRapid:'中央線快速',KeihinTohokuNegishi:'京浜東北・根岸線',ChuoSobuLocal:'中央・総武線各駅停車',SobuRapid:'総武快速線',Yokosuka:'横須賀線',Tokaido:'東海道線',ShonanShinjuku:'湘南新宿ライン',SaikyoKawagoe:'埼京・川越線',Utsunomiya:'宇都宮線',Takasaki:'高崎線',JobanRapid:'常磐線快速',JobanLocal:'常磐線各駅停車',Joban:'常磐線',Musashino:'武蔵野線',Keiyo:'京葉線',Yokohama:'横浜線',Nambu:'南武線',Ome:'青梅線',Chuo:'中央本線',Itsukaichi:'五日市線',Kawagoe:'川越線',SotetsuDirect:'相鉄線直通'};
    const COLORS={Yamanote:'#86c440',ChuoRapid:'#f15a22',KeihinTohokuNegishi:'#00a7c4',ChuoSobuLocal:'#ffd400',SobuRapid:'#1769a7',Yokosuka:'#1769a7',Tokaido:'#f68b1e',ShonanShinjuku:'#e21f26',SaikyoKawagoe:'#00ac9a',Utsunomiya:'#f68b1e',Takasaki:'#f68b1e',JobanRapid:'#1e5dc8',JobanLocal:'#8f76a9',Joban:'#00a663',Musashino:'#f15a24',Keiyo:'#c9252f',Yokohama:'#7fc342',Nambu:'#ffd400',Ome:'#f15a22',Chuo:'#f15a22'};
    const FALLBACK={Tokyo:'東京',Ueno:'上野',Shinagawa:'品川',Shinjuku:'新宿',Ikebukuro:'池袋',Omiya:'大宮',Yokohama:'横浜',Ofuna:'大船',Takasaki:'高崎',Utsunomiya:'宇都宮',Chiba:'千葉',Kofu:'甲府',Matsumoto:'松本',Maebashi:'前橋',Kagohara:'籠原',Koga:'古河'};
    const state={trains:[],railways:[],stations:new Map(),visible:[],ordered:{down:[],up:[]},selected:null};
    const $=id=>document.getElementById(id),token=value=>String(value||'').split(':').pop().split('.').pop(),key=value=>String(value||'').replace('odpt.Railway:JR-East.','');
    const stationName=id=>state.stations.get(id)||FALLBACK[token(id)]||token(id)||'不明';
    const el=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;};
    async function request(path){const response=await fetch(API+path,{cache:'no-store',headers:{Accept:'application/json'}});if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json();}
    function direction(train,fromIndex,toIndex){if(fromIndex>=0&&toIndex>=0&&fromIndex!==toIndex)return toIndex>fromIndex?'down':'up';return /Inbound|InnerLoop|Northbound|Eastbound/.test(train['odpt:railDirection']||'')?'up':'down';}
    function lineTitle(id){const code=key(id);return NAMES[code]||code;}
    function makeOption(value,text){const option=el('option','',text);option.value=value;return option;}
    function setupLines(){const select=$('line'),previous=select.value||localStorage.getItem('dispatchBoardLine')||'';select.replaceChildren();const active=new Set(state.trains.map(t=>t['odpt:railway']));const choices=state.railways.filter(r=>active.has(r['owl:sameAs'])&&(r['odpt:stationOrder']||[]).length>1).sort((a,b)=>lineTitle(a['owl:sameAs']).localeCompare(lineTitle(b['owl:sameAs']),'ja'));choices.forEach(r=>select.appendChild(makeOption(r['owl:sameAs'],lineTitle(r['owl:sameAs']))));const preferred=choices.find(r=>r['owl:sameAs']===previous)||choices.find(r=>key(r['owl:sameAs'])==='Yamanote')||choices[0];if(preferred)select.value=preferred['owl:sameAs'];}
    function buildStationMap(){state.stations.clear();state.railways.forEach(railway=>(railway['odpt:stationOrder']||[]).forEach(item=>{const title=item['odpt:stationTitle'];state.stations.set(item['odpt:station'],typeof title==='string'?title:(title?.ja||token(item['odpt:station'])));}));}
    function analyze(list){const result={down:[],up:[]},alerts=[],level=$('alertLevel').value,closeLimit=level==='strict'?1.2:.8,gapLimit=level==='strict'?2.8:3.8;list.forEach(train=>result[train.dir].push(train));result.down.sort((a,b)=>b.pos-a.pos);result.up.sort((a,b)=>a.pos-b.pos);if(level!=='off'){for(const dir of ['down','up']){const ordered=result[dir];for(let i=0;i<ordered.length-1;i++){const lead=ordered[i],follow=ordered[i+1],gap=Math.abs(lead.pos-follow.pos);if(gap<=closeLimit)alerts.push({kind:'close',lead,follow,gap});else if(gap>=gapLimit)alerts.push({kind:'gap',lead,follow,gap});}}}state.ordered=result;return alerts;}
    function renderAlerts(alerts){const list=$('alerts');list.replaceChildren();if(!alerts.length){list.appendChild(el('li','empty','現在の表示範囲に間隔警告はありません'));return;}alerts.slice(0,12).forEach(alert=>{const row=el('li',`alert-row ${alert.kind}`),title=el('strong','',alert.kind==='close'?'列車接近':'列車間隔大');row.append(title,document.createTextNode(`${alert.lead.number} と ${alert.follow.number}　約${alert.gap.toFixed(1)}駅間`));list.appendChild(row);});}
    function renderFocus(train){const box=$('focus');box.replaceChildren();if(!train){box.appendChild(el('div','empty','列車を選択してください'));return;}const ordered=state.ordered[train.dir],index=ordered.indexOf(train),lead=ordered[index-1],follow=ordered[index+1];box.appendChild(el('div','focus-number',train.number));const dl=el('dl','focus-grid');[['方面',train.dir==='down'?'駅順方向':'反駅順方向'],['在線',train.position],['行先',train.destination],['遅延',train.delay?`${train.delay}分`:'定刻'],['編成',train.cars?`${train.cars}両`:'—']].forEach(([a,b])=>{dl.append(el('dt','',a),el('dd','',b));});box.appendChild(dl);const neighbor=el('div','neighbor');neighbor.append(el('strong','',`前方　${lead?lead.number:'なし'}`),document.createElement('br'),document.createTextNode(`後方　${follow?follow.number:'なし'}`));box.appendChild(neighbor);}
    function render(){const railway=state.railways.find(r=>r['owl:sameAs']===$('line').value);if(!railway)return;localStorage.setItem('dispatchBoardLine',$('line').value);const order=[...(railway['odpt:stationOrder']||[])].sort((a,b)=>(a['odpt:index']||0)-(b['odpt:index']||0)),ids=order.map(s=>s['odpt:station']),names=ids.map(stationName),search=$('search').value.trim().toLowerCase(),filter=$('direction').value,code=key(railway['owl:sameAs']),color=COLORS[code]||'#547368';const trains=state.trains.filter(raw=>raw['odpt:railway']===railway['owl:sameAs']).map((raw,index)=>{const from=ids.indexOf(raw['odpt:fromStation']),to=ids.indexOf(raw['odpt:toStation']);if(from<0)return null;const dir=direction(raw,from,to),pos=to>=0&&to!==from?(from+to)/2:from,dest=stationName((raw['odpt:destinationStation']||[])[0]),delay=Math.floor((Number(raw['odpt:delay'])||0)/60);return{raw,id:raw['owl:sameAs']||`${raw['odpt:trainNumber']}-${index}`,number:raw['odpt:trainNumber']||'番号なし',from,to,pos,dir,destination:dest,delay,cars:raw['odpt:carComposition']||'',position:to>=0&&to!==from?`${names[from]}－${names[to]}`:names[from]};}).filter(Boolean).filter(train=>(filter==='all'||train.dir===filter)&&(!search||`${train.number} ${train.destination}`.toLowerCase().includes(search)));state.visible=trains;const alerts=analyze(trains),closeIds=new Set(alerts.filter(a=>a.kind==='close').flatMap(a=>[a.lead.id,a.follow.id]));document.documentElement.style.setProperty('--route',color);$('lineTitle').textContent=lineTitle(railway['owl:sameAs']);const track=$('track');track.replaceChildren();track.style.width=`${Math.max(980,order.length*94)}px`;track.append(el('div','direction-label down','駅順方向 →'),el('div','direction-label up','← 反駅順方向'),el('div','rail'));order.forEach((station,index)=>{const node=el('button','station',stationName(station['odpt:station']));node.type='button';node.title=stationName(station['odpt:station']);node.style.left=`${4+(index/(Math.max(1,order.length-1)))*92}%`;track.appendChild(node);});const buckets={down:{},up:{}};trains.forEach(train=>{const bucket=String(train.pos),stack=buckets[train.dir][bucket]||0;buckets[train.dir][bucket]=stack+1;const card=el('button',`train ${train.dir}${train.delay?' delay':''}${closeIds.has(train.id)?' close':''}`);card.type='button';card.style.setProperty('--train-color',color);card.style.left=`${4+(train.pos/(Math.max(1,order.length-1)))*92}%`;if(train.dir==='down')card.style.top=`${42+stack*50}px`;else card.style.bottom=`${42+stack*50}px`;card.append(el('strong','',train.number),el('small','',`${train.cars?train.cars+'両 ':''}${train.destination}`));if(train.delay)card.appendChild(el('span','delay-badge',`+${train.delay}`));card.addEventListener('click',()=>{state.selected=train;renderFocus(train);});track.appendChild(card);});renderAlerts(alerts);if(state.selected){const current=trains.find(t=>t.number===state.selected.number);state.selected=current||null;}renderFocus(state.selected);$('trainCount').textContent=trains.length;$('delayCount').textContent=trains.filter(t=>t.delay).length;$('closeCount').textContent=alerts.filter(a=>a.kind==='close').length;$('gapCount').textContent=alerts.filter(a=>a.kind==='gap').length;$('stationCount').textContent=order.length;}
    async function refresh(){const button=$('refresh');button.disabled=true;$('dot').className='dot loading';$('status').textContent='更新中';$('notice').classList.remove('show');try{const [trains,railways]=await Promise.all([request('odpt:Train?odpt:operator=odpt.Operator:JR-East'),request('odpt:Railway?odpt:operator=odpt.Operator:JR-East')]);state.trains=Array.isArray(trains)?trains:[];state.railways=Array.isArray(railways)?railways:[];buildStationMap();setupLines();render();$('dot').className='dot';$('status').textContent='接続中';$('updated').textContent=`${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}更新`;}catch(error){console.error(error);$('dot').className='dot error';$('status').textContent='取得エラー';$('notice').textContent='在線データを取得できませんでした。';$('notice').classList.add('show');}finally{button.disabled=false;}}
    ['line','direction','alertLevel'].forEach(id=>$(id).addEventListener('change',render));let searchTimer;$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(render,120);});$('refresh').addEventListener('click',refresh);function tick(){$('clock').textContent=new Date().toLocaleTimeString('ja-JP');}tick();setInterval(tick,1000);refresh();setInterval(refresh,60000);
  })();
  </script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script src="auth_guard.js"></script>
</body>
</html>
