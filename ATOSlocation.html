<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATOS在線モニタ</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f3f3f3; }
    #atos-standalone { display: block; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe id="atos-standalone" title="ATOS在線モニタ"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('atos-standalone');
      const params = new URLSearchParams(location.search);
      params.set('standalone', '1');
      params.set('view', 'realtime');
      frame.src = `atosweb.html?${params.toString()}#view=realtime`;

      addEventListener('message', event => {
        if (event.origin !== location.origin || event.source !== frame.contentWindow) return;
        if (event.data?.type !== 'atos-location-state') return;
        const next = new URLSearchParams(event.data.query || '');
        next.delete('standalone');
        next.delete('view');
        history.replaceState(null, '', `${location.pathname}${next.size ? `?${next}` : ''}`);
      });
    })();
  </script>
</body>
</html>
