<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#18b50e">
  <script>if(location.protocol==="http:"&&location.hostname!=="localhost"&&location.hostname!=="127.0.0.1")location.replace(`https://${location.host}${location.pathname}${location.search}${location.hash}`)</script>
  <title>異常時情報共有システム</title>
  <meta name="description" content="写真・動画を現場からすぐに共有する業務システム">
  <meta property="og:title" content="異常時情報共有システム">
  <meta property="og:description" content="撮影するだけで、現場をリアルタイム共有。">
  <meta property="og:image" content="https://tayunet-traininfo.com/incident-share/og.png">
  <link rel="icon" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css?v=2026.08.14.1">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
  <div class="auth-cover" id="authCover"><span class="spinner"></span><p>利用者情報を確認しています</p></div>
  <main class="app" id="app" hidden>
    <header class="topbar">
      <a class="top-action back" href="/toppage.html"><span>‹</span>戻る</a>
      <h1 id="screenTitle">共有データ閲覧</h1>
      <button class="top-action refresh" id="refreshButton" type="button"><span>⟳</span>更新</button>
    </header>

    <section class="gallery-screen" id="galleryScreen">
      <div class="date-row"><span id="dateLabel">共有データ</span><small id="serverStatus">サーバー確認中</small></div>
      <div class="photo-grid" id="photoGrid" aria-live="polite"></div>
      <div class="empty" id="emptyState" hidden>共有データはまだありません</div>
      <div class="bottom-actions">
        <button class="filter-button" id="filterButton" type="button">絞込</button>
        <button class="capture-button" id="captureButton" type="button" aria-label="写真・動画を登録">＋</button>
      </div>
    </section>

    <section class="detail-screen" id="detailScreen" hidden>
      <div class="detail-media" id="detailMedia"></div>
      <form class="detail-fields" id="detailForm">
        <div class="field-row"><label for="detailTime">撮影日時</label><input id="detailTime" name="occurredAt" type="datetime-local"></div>
        <div class="field-row"><label for="detailDevice">端末</label><input id="detailDevice" name="device" maxlength="120" placeholder="端末名・所属箇所"></div>
        <div class="field-row comment"><label for="detailComment">コメント</label><textarea id="detailComment" name="comment" maxlength="1000" rows="5" placeholder="現地の状況を入力"></textarea></div>
        <div class="form-actions"><button type="button" id="detailBack">一覧へ戻る</button><button class="primary" type="submit">保存</button></div>
      </form>
    </section>

    <div class="sheet" id="uploadSheet" hidden>
      <form class="sheet-panel" id="uploadForm">
        <header><button type="button" data-close-upload>キャンセル</button><b>共有データ登録</b><button class="submit-link" type="submit">登録</button></header>
        <label class="media-picker" id="mediaPicker">
          <span class="camera-symbol">▣</span><b>写真・動画を撮影／選択</b><small>タップして端末のカメラまたは写真を開きます</small>
          <input id="mediaInput" name="media" type="file" accept="image/*,video/*" capture="environment" required>
        </label>
        <div class="upload-fields">
          <label><span>撮影日時</span><input name="occurredAt" type="datetime-local" required></label>
          <label><span>端末</span><input name="device" maxlength="120" placeholder="端末名・所属箇所" required></label>
          <label><span>コメント</span><textarea name="comment" maxlength="1000" rows="5" placeholder="現地の状況を入力"></textarea></label>
        </div>
      </form>
    </div>

    <div class="sheet filter-sheet" id="filterSheet" hidden>
      <form class="sheet-panel" id="filterForm">
        <header><button type="button" data-close-filter>キャンセル</button><b>絞込</b><button class="submit-link" type="submit">適用</button></header>
        <div class="upload-fields">
          <label><span>撮影日</span><input name="date" type="date"></label>
          <label><span>端末・コメント</span><input name="query" type="search" placeholder="キーワード"></label>
        </div>
      </form>
    </div>
    <div class="toast" id="toast" hidden></div>
  </main>
  <script src="/auth_guard.js?v=2026.08.08.2"></script>
  <script src="/T-time/firebase-data-auth.js?v=2026.08.09.1"></script>
  <script src="./config.js?v=2026.08.14.1"></script>
  <script src="./app.js?v=2026.08.14.1"></script>
</body>
</html>
