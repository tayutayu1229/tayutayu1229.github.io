<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>運転活休情報システム - 東京圏輸送情報システム</title>
  <link rel="stylesheet" href="styles.css?v=20261015-1">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <header class="app-titlebar">
    <h1><span class="system-mark">■</span>運転活休情報システム［公開閲覧］</h1>
    <span>東京圏輸送情報システム</span>
  </header>
  <nav class="menubar" aria-label="メニュー">
    <a href="/toppage.html">システム一覧へ</a>
    <a href="admin.html">管理画面</a>
    <a href="/privacy.html">ご利用案内</a>
  </nav>
  <div class="toolbar">
    <label>運転日 <input type="date" id="serviceDate"></label>
    <button type="button" id="previousDate" title="前日">◀ 前日</button>
    <button type="button" id="today">本日</button>
    <button type="button" id="nextDate" title="翌日">翌日 ▶</button>
    <span class="separator"></span>
    <label>一覧
      <select id="viewMode">
        <option value="all">すべて</option><option value="line">線区毎</option><option value="operate">運転のみ</option><option value="suspend">運休のみ</option>
      </select>
    </label>
    <label>区分
      <select id="categoryFilter">
        <option value="">すべて</option>
        <option value="planned_extra">予定臨（6000～8000番代）</option>
        <option value="extra">臨時列車（9000番代）</option>
        <option value="regular">定期・その他</option>
      </select>
    </label>
    <label>活休
      <select id="stateFilter">
        <option value="">すべて</option>
        <option value="operate">運転</option>
        <option value="suspend">運休</option>
        <option value="changed">時刻変更</option>
        <option value="prohibited">運転禁止</option>
      </select>
    </label>
    <label>検索 <input type="search" id="query" placeholder="列番・駅・線区・表題"></label>
    <button type="button" id="reload">再読込</button>
  </div>

  <main class="window-body">
    <div id="message" class="message hidden" role="status"></div>
    <div id="changeSummary" class="message hidden"></div>
    <section class="summary-strip" aria-label="集計">
      <div class="summary-box"><span class="summary-label">公表件数</span><strong class="summary-value" id="totalCount">0</strong></div>
      <div class="summary-box"><span class="summary-label">運転</span><strong class="summary-value" id="operateCount">0</strong></div>
      <div class="summary-box"><span class="summary-label">運休</span><strong class="summary-value" id="suspendCount">0</strong></div>
      <div class="summary-box"><span class="summary-label">時刻変更</span><strong class="summary-value" id="changedCount">0</strong></div>
      <div class="summary-box"><span class="summary-label">運転禁止</span><strong class="summary-value" id="prohibitedCount">0</strong></div>
    </section>

    <div class="public-layout">
      <section class="panel">
        <div class="panel-title"><span>運転通達一覧</span><span id="listCount">0件</span></div>
        <div class="data-wrap inset">
          <table class="data-grid" aria-label="運転通達一覧">
            <colgroup><col style="width:70px"><col style="width:112px"><col style="width:80px"><col style="width:100px"><col style="width:115px"><col><col style="width:125px"></colgroup>
            <thead><tr><th>活休</th><th>区分</th><th>列車番号</th><th>列車種別</th><th>始発駅</th><th>表題</th><th>終着駅</th></tr></thead>
            <tbody id="noticeRows"><tr><td colspan="7" class="empty-cell">読込中です。</td></tr></tbody>
          </table>
        </div>
      </section>
      <section class="panel" id="detailPanel">
        <div class="panel-title"><span>通達・列車時刻表</span><span id="detailId">未選択</span></div>
        <div id="detail" class="detail-placeholder">一覧から列車を選択してください。</div>
      </section>
    </div>
  </main>
  <footer class="statusbar">
    <span class="grow" id="statusText">待機中</span>
    <span>公開情報</span>
    <span id="updatedText">未取得</span>
  </footer>
  <script src="public.js?v=20261015-1"></script>
  <script src="/assets/js/back-navigation.js" defer></script>
</body>
</html>
