<!doctype html>
<html lang="ja" data-no-site-brand>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>運転活休通達</title>
  <link rel="stylesheet" href="styles.css?v=20261015-2">
  <style>html[data-no-site-brand] .site-brand-link { display:none !important; }</style>
  <style>
    body { display:block; height:auto; overflow:auto; background:#808080; }
    .print-toolbar { position:sticky; top:0; z-index:5; padding:4px; background:#ece9d8; border-bottom:1px solid #444; text-align:center; }
    .paper { width:210mm; min-height:297mm; margin:8px auto; padding:12mm; background:#fff; color:#000; border:1px solid #333; font-family:"Yu Mincho","MS Mincho",serif; font-size:10pt; }
    .document-number { text-align:right; font-size:10pt; }
    .document-title { margin:8mm 0 5mm; text-align:center; font-size:20pt; letter-spacing:.35em; }
    .document-subtitle { text-align:center; font-size:13pt; font-weight:bold; margin-bottom:7mm; }
    .document-meta { width:100%; border-collapse:collapse; table-layout:fixed; margin-bottom:5mm; }
    .document-meta th,.document-meta td,.document-table th,.document-table td { border:1px solid #000; padding:1.2mm 1.5mm; }
    .document-meta th { width:25mm; background:#eee; }
    .document-table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:8.5pt; }
    .document-table th { background:#e6e6e6; }
    .document-table thead { display:table-header-group; }
    .document-table tr { break-inside:avoid; page-break-inside:avoid; }
    .document-note { border:1px solid #000; min-height:16mm; margin-top:4mm; padding:2mm; white-space:pre-wrap; }
    .document-footer { display:flex; justify-content:space-between; margin-top:7mm; padding-top:2mm; border-top:1px solid #000; font-size:8pt; }
    .changed { font-weight:bold; text-decoration:underline; }
    @page { size:A4 portrait; margin:0; }
    @media print {
      body { background:#fff; }
      .print-toolbar { display:none; }
      .paper { width:auto; min-height:auto; margin:0; padding:12mm; border:0; }
    }
  </style>
</head>
<body>
  <div class="print-toolbar"><button type="button" id="printButton" class="primary">PDFとして印刷・保存</button> <button type="button" id="closeButton">閉じる</button></div>
  <main class="paper" id="paper"><p>通達を読み込んでいます。</p></main>
  <script src="notice.js?v=20261015-1"></script>
  <script src="/assets/js/back-navigation.js" defer></script>
</body>
</html>
