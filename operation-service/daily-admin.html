<!doctype html>
<html lang="ja" data-no-site-brand>
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>運転活休情報システム 日別管理</title>
  <link rel="stylesheet" href="styles.css?v=20261018-1"><link rel="stylesheet" href="daily.css?v=20261018-4">
  <style>html[data-no-site-brand] .site-brand-link {display:none!important}</style>
</head>
<body class="daily-admin-body">
  <header class="app-titlebar"><h1>■ 運転活休情報システム［日別管理］</h1><span id="operatorName">認証確認中</span></header>
   <nav class="menubar"><a href="/toppage.html">システム一覧へ</a><a href="index.html">公開一覧</a><a href="guide.html">ご利用案内</a><a href="diagram-periods.html">ダイヤ改正マスタ</a><a href="admin.html">旧列車別管理・履歴</a></nav>
  <main id="main-content" class="window-body" data-auth-display="flex" style="display:none">
    <div class="toolbar">
      <label>施行日 <input id="dayDate" class="date-input" placeholder="YYYY/MM/DD" maxlength="10"></label><button id="loadDay">日付を開く</button>
      <button id="saveDay">日別下書き保存</button><button id="previewDay">PDFプレビュー</button><button id="publishDay" class="primary">この日全体を発表</button><button id="withdrawDay" class="danger">この日全体を取下げ</button>
      <span id="dayIdentity">未読込</span>
    </div>
    <div id="dayMessage" class="message" role="status">行を編集して一覧へ反映 → 日別下書き保存 → 日全体を発表。下書きは公開側へ反映されません。</div>
    <div class="daily-workspace">
    <div class="daily-layout">
      <div class="daily-common"><label for="commonRemarks">日別共通記事</label><textarea id="commonRemarks" maxlength="8000"></textarea></div>
      <div class="toolbar">
        <button id="selectAll">表示行を全選択</button><button id="selectNone">選択解除</button><label>選択列車の活休 <select id="bulkState"><option value="operate">運転</option><option value="suspend">運休</option><option value="changed">時刻変更</option><option value="prohibited">運転禁止</option><option value="unknown">未入力</option></select></label><button id="applyState">選択行へ反映</button><button id="newRow">新規入力</button>
      </div>
      <div class="toolbar">
        <label>原簿種類 <select id="sourceDayType"><option value="">施行日から自動</option><option>平日</option><option>土休日</option></select></label><button id="loadCatalog">追加用原簿を読込</button>
        <label>改正 <select id="sourcePeriod"><option value="">日付から自動選択</option></select></label>
        <label>原簿検索 <input id="catalogQuery" type="search" placeholder="列番・駅・線区"></label>
        <label>分類 <select id="catalogCategory"><option value="">すべて</option><option value="planned_extra">予定臨</option><option value="extra">臨時</option><option value="regular">定期・その他</option></select></label>
        <label>線区 <select id="catalogLine"><option value="">すべて</option></select></label>
        <label>表示順 <select id="catalogSort"><option value="time">時刻順</option><option value="number">列車番号順</option><option value="line">線区順</option></select></label><span id="catalogMeta"></span><span id="periodText"></span>
        <label>列車 <select id="catalogTrain" multiple size="3" style="max-width:420px" aria-label="追加する列車（複数選択可）"></select></label><button id="selectCatalogAll">候補を全選択</button><button id="clearCatalogSelection">候補の選択解除</button><button id="addTrain">選択列車を一覧へ追加</button>
      </div>
      <div class="toolbar">
        <label>一覧検索 <input id="dailyQuery" type="search" placeholder="列番・種別・駅・線区・記事"></label>
        <label>分類 <select id="dailyCategory"><option value="">すべて</option><option value="planned_extra">予定臨</option><option value="extra">臨時</option><option value="regular">定期・その他</option></select></label>
        <label>活休 <select id="dailyState"><option value="">すべて</option><option value="operate">運転</option><option value="suspend">運休</option><option value="changed">時刻変更</option><option value="prohibited">運転禁止</option><option value="unknown">未入力</option></select></label>
        <label>線区 <select id="dailyLine"><option value="">すべて</option></select></label>
        <label>表示順 <select id="dailySort"><option value="number">列車番号順</option><option value="time">時刻順</option><option value="line">線区順</option></select></label><span id="dailyMeta"></span>
      </div>
      <div class="data-wrap"><table class="daily-grid" aria-label="その日の活休一覧">
        <colgroup><col style="width:22px"><col style="width:30px"><col style="width:46px"><col style="width:68px"><col style="width:56px"><col style="width:66px"><col style="width:66px"><col style="width:58px"><col style="width:110px"><col></colgroup>
        <thead><tr><th class="check">選</th><th>No.</th><th>区分</th><th>列車番号</th><th>種別</th><th>始発駅</th><th>終着駅</th><th>活休</th><th>適用区間</th><th>手配内容・備考</th></tr></thead><tbody id="dailyRows"></tbody>
      </table></div>
      <div class="toolbar">
        <span>選択行を別の日の下書きにも反映：</span><select id="applyDateMode"><option value="single">単日</option><option value="multiple">複数日</option><option value="range">期間</option></select>
        <label>日付／開始 <input id="applyDateStart" type="date"></label><label id="rangeEndLabel" hidden>終了 <input id="applyDateEnd" type="date"></label>
        <button id="addApplyDate" hidden>日付追加</button><select id="applyDateList" multiple size="2" aria-label="反映する複数日" hidden></select><button id="removeApplyDate" hidden>選択日を削除</button>
        <button id="applyDates">選択行を指定日へ保存（発表はしない）</button>
      </div>
    </div>
      <section class="daily-editor panel" id="rowEditor" aria-label="活休情報・列車時刻表の編集" hidden>
        <div class="panel-title"><strong id="editTrain"></strong><span>活休情報入力・編集</span></div>
        <div class="daily-editor-fields">
          <div class="daily-form-grid">
            <label for="editTitle">表題</label><input id="editTitle" maxlength="160" class="span-3">
            <label for="editNumber">列車番号</label><input id="editNumber" maxlength="40"><label for="editType">種別</label><input id="editType" maxlength="80">
            <label for="editKind">手配区分</label><select id="editKind"><option value="unconfirmed">未入力</option><option value="operation">全区間運転</option><option value="suspension">全区間運休</option><option value="partial">一部区間</option><option value="time_change">時刻変更</option><option value="prohibition">運転禁止</option><option value="other">その他</option></select>
            <label for="editState">活休</label><select id="editState"><option value="operate">運転</option><option value="suspend">運休</option><option value="changed">時刻変更</option><option value="prohibited">運転禁止</option><option value="unknown">未入力</option></select>
            <label for="editStart">適用区間 自</label><input id="editStart" list="stationChoices" maxlength="80"><label for="editEnd">至</label><input id="editEnd" list="stationChoices" maxlength="80"><datalist id="stationChoices"></datalist>
            <label for="editOrigin">始発駅</label><input id="editOrigin" maxlength="80"><label for="editDestination">終着駅</label><input id="editDestination" maxlength="80">
            <label for="editLines">線区（読点区切り）</label><input id="editLines" maxlength="1000" class="span-3">
            <label for="editRemarks">備考</label><textarea id="editRemarks" maxlength="4000" class="span-3"></textarea>
            <label for="editRestriction">禁止・制限</label><textarea id="editRestriction" maxlength="1000" class="span-3"></textarea>
          </div>
          <div id="rowDates"></div>
        </div>
        <div class="daily-time-title">時刻変更・列車時刻表（変更するセルだけ上書き）</div>
        <div class="daily-time-help">Tabで次の項目へ移動。黄色のセルは原簿からの変更箇所です。時刻変更の発表時は活休も「時刻変更」に設定してください。</div>
        <div class="daily-time-wrap inset" id="dailyTimeWrap">
          <table class="data-grid time-edit-table daily-time-table" aria-label="列車時刻表の編集">
            <colgroup><col style="width:105px"><col style="width:82px"><col style="width:82px"><col style="width:70px"><col></colgroup>
            <thead><tr><th>駅名</th><th>着</th><th>発</th><th>番線</th><th>変更記事</th></tr></thead><tbody id="dailyTimeRows"></tbody>
          </table>
        </div>
        <div class="editor-actions daily-editor-actions">
          <button id="saveRow" class="primary">編集を反映して下書き保存</button><button id="commitRow">編集を一覧へ反映</button>
          <button id="clearRow">活休未入力へ戻す</button><button id="duplicateRow">複製して新規</button><button id="cancelRow">行編集を閉じる</button><span id="rowEditState">未変更</span>
        </div>
      </section>
    </div>
  </main>
   <footer class="statusbar"><span id="dailyStatus">認証確認中</span><span id="updatedAt"></span></footer>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="/T-time/firebase-data-auth.js"></script><script src="/auth_guard.js?v=2026.10.15.2"></script>
  <script src="admin-utils.js?v=20261018-1"></script><script src="daily-utils.js?v=20261018-3"></script><script src="daily-admin.js?v=20261018-3"></script>
  <script src="/assets/js/back-navigation.js" defer></script>
</body>
</html>
