<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ダイヤ改正マスタ - 運転活休情報システム</title>
  <link rel="stylesheet" href="styles.css?v=20261018-1">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <header class="app-titlebar"><h1><span class="system-mark">■</span>運転活休情報システム［ダイヤ改正マスタ］</h1><span id="operatorName">認証確認中</span></header>
  <nav class="menubar"><a href="admin.html">管理画面へ戻る</a><a href="index.html">公開閲覧画面</a></nav>
  <div class="toolbar">
    <button type="button" id="reload" class="primary">再読込</button>
    <a class="button" href="https://github.com/tayutayu1229/tayunet-private-data/edit/main/data/diagram-periods.json" target="_blank" rel="noopener">マスタJSONを編集</a>
    <span>変更は非公開データリポジトリのレビュー・反映後、Ubuntu同期で有効になります。</span>
  </div>
  <main id="main-content" class="window-body" data-auth-display="flex" style="display:none">
    <div id="message" class="message hidden" role="status"></div>
    <section class="panel master-panel">
      <div class="panel-title"><span>登録済みダイヤ改正期間</span><span id="periodCount">0件</span></div>
      <div class="data-wrap inset">
        <table class="data-grid master-grid">
          <colgroup><col style="width:90px"><col style="width:190px"><col style="width:110px"><col style="width:110px"><col style="width:130px"><col style="width:130px"></colgroup>
          <thead><tr><th>ID</th><th>期間名</th><th>開始日</th><th>終了日</th><th>土休日所定日</th><th>平日所定日</th></tr></thead>
          <tbody id="periodRows"><tr><td colspan="6" class="empty-cell">読込中です。</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="statusbar"><span class="grow" id="statusText">認証確認中</span><span>マスタ管理</span></footer>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="/T-time/firebase-data-auth.js"></script>
  <script src="/auth_guard.js?v=2026.10.15.2"></script>
  <script src="diagram-periods.js?v=20261015-2"></script>
  <script src="/assets/js/back-navigation.js" defer></script>
</body>
</html>
