<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006149">
  <title>列車在線情報 - 東京圏輸送情報システム</title>
  <style>
    :root{--green:#007b5a;--green-dark:#006149;--border:#aeb9b4;--line:#d9dfdc;--bg:#eef1ef;--text:#17221e;--muted:#586660;--amber:#d78a00;--red:#c8322d;font-family:"Noto Sans JP","Yu Gothic UI","Hiragino Kaku Gothic ProN",sans-serif;color:var(--text);background:var(--bg)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--bg);font-size:14px}button,select,input{font:inherit}a{color:inherit}.skip-link{position:fixed;top:-60px;left:8px;z-index:999;padding:8px;background:#fff}.skip-link:focus{top:8px}
    .system-header{min-height:52px;color:#fff;background:var(--green-dark);border-bottom:3px solid #004b38}.system-header-inner{display:flex;align-items:center;width:min(1500px,100%);min-height:52px;margin:auto;padding:0 14px}.system-name{font-size:16px;font-weight:800}.system-sub{margin-left:14px;color:#cce0d9;font-size:11px}.system-nav{display:flex;align-self:stretch;margin-left:auto}.system-nav a{display:flex;align-items:center;padding:0 13px;border-left:1px solid rgba(255,255,255,.2);color:#fff;text-decoration:none}.system-nav a:hover{background:rgba(0,0,0,.16)}.clock{min-width:90px;padding-left:14px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.clock small{display:block;color:#cce0d9;font-size:9px;font-weight:400}
    .page{width:min(1500px,calc(100% - 20px));margin:10px auto 30px}.title-row{display:flex;align-items:center;gap:12px;margin-bottom:7px;padding:8px 10px;border:1px solid var(--border);border-left:5px solid var(--green);background:#fff}.title-row h1{margin:0;font-size:18px}.description{color:var(--muted);font-size:11px}.connection{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--muted);font-size:10px}.connection-dot{width:8px;height:8px;border-radius:50%;background:#14a46a}.connection-dot.loading{background:var(--amber);animation:blink 1s infinite}.connection-dot.error{background:var(--red)}@keyframes blink{50%{opacity:.35}}
    .toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:7px;margin-bottom:7px;padding:7px;border:1px solid var(--border);background:#fff}.field{min-width:150px}.field.grow{flex:1;min-width:250px}.field label{display:block;margin-bottom:3px;color:#46534e;font-size:9px;font-weight:700}.field input,.field select{width:100%;height:32px;padding:4px 7px;border:1px solid #94a29c;border-radius:0;background:#fff}.field input:focus,.field select:focus{outline:2px solid rgba(0,123,90,.25);border-color:var(--green)}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:4px 11px;border:1px solid var(--green-dark);border-radius:0;color:#fff;background:var(--green);font-weight:700;text-decoration:none;cursor:pointer}.btn.secondary{color:#17372d;background:#fff;border-color:#879a92}.btn:disabled{opacity:.55}
    .summary{display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:7px;border:1px solid var(--border);background:#fff}.summary-item{padding:7px 10px;border-right:1px solid var(--line)}.summary-item:last-child{border-right:0}.summary-label{color:var(--muted);font-size:9px}.summary-value{margin-top:1px;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.summary-value small{margin-left:2px;font-size:9px;font-weight:400}.summary-value.warning{color:#956000}.summary-value.danger{color:#b72e2a}
    .panel{border:1px solid var(--border);background:#fff}.panel-header{display:flex;align-items:center;min-height:36px;padding:5px 9px;border-bottom:1px solid var(--border);background:#f3f5f4}.panel-header h2{margin:0;font-size:12px}.panel-note{margin-left:9px;color:var(--muted);font-size:9px}.panel-actions{display:flex;gap:5px;margin-left:auto}.panel-actions .btn{min-height:27px;padding:3px 8px;font-size:9px}.table-wrap{overflow:auto;max-height:calc(100vh - 230px)}.data-table{width:100%;min-width:920px;border-collapse:collapse}.data-table th{position:sticky;top:0;z-index:2;padding:6px 7px;border-right:1px solid #d6e0dc;color:#fff;background:#356556;font-size:9px;text-align:left;white-space:nowrap}.data-table td{height:34px;padding:4px 7px;border-right:1px solid #e4e9e7;border-bottom:1px solid #dce3e0;font-size:10px}.data-table tbody tr{cursor:pointer}.data-table tbody tr:nth-child(even){background:#f7f9f8}.data-table tbody tr:hover,.data-table tbody tr:focus{background:#e2f1eb;outline:none}.train-number{font-weight:800;font-variant-numeric:tabular-nums}.train-type{display:inline-block;padding:1px 4px;border:1px solid #aab6b1;font-size:8px}.train-type.express{color:#a22d28;border-color:#d39490;background:#fff0ef}.delay-text{color:var(--red);font-weight:800}.ontime-text{color:#17724f;font-weight:700}
    .mobile-list{display:none}.train-card{padding:8px;border-bottom:1px solid var(--line);background:#fff}.train-card-head{display:flex;justify-content:space-between;gap:8px}.train-card p{margin:4px 0;font-size:10px}.train-card dl{display:grid;grid-template-columns:42px 1fr;gap:2px 5px;margin:5px 0 0;font-size:9px}.train-card dt{color:var(--muted)}.train-card dd{margin:0;font-weight:600}.empty{padding:22px 10px;color:var(--muted);text-align:center;font-size:10px}.notice{display:none;margin-bottom:7px;padding:7px 9px;border:1px solid #d29490;color:#8c2925;background:#fff1f0;font-size:10px}.notice.show{display:block}
    .modal-backdrop{position:fixed;inset:0;z-index:90;display:none;background:rgba(0,0,0,.38)}.modal-backdrop.open{display:block}.detail-dialog{position:fixed;z-index:100;left:50%;top:50%;display:none;width:min(550px,calc(100% - 20px));max-height:calc(100vh - 20px);overflow:auto;transform:translate(-50%,-50%);border:1px solid #687a73;background:#fff}.detail-dialog.open{display:block}.dialog-header{display:flex;align-items:center;padding:8px 10px;color:#fff;background:var(--green-dark)}.dialog-header h2{margin:0;font-size:14px}.dialog-header button{margin-left:auto;border:1px solid rgba(255,255,255,.55);color:#fff;background:transparent}.dialog-body{padding:10px}.detail-table{display:grid;grid-template-columns:105px 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}.detail-table div{min-height:31px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:10px}.detail-table .key{background:#f3f5f4;font-weight:700}.dialog-actions{display:flex;gap:6px;margin-top:9px}.footer{margin-top:7px;padding:6px 2px;color:var(--muted);font-size:8px}
    @media(max-width:720px){.system-sub,.clock,.system-nav a:not(.mobile-keep){display:none}.system-name{font-size:13px}.system-nav a{padding:0 9px;font-size:10px}.page{width:calc(100% - 10px);margin-top:5px}.title-row{flex-wrap:wrap}.description{width:100%}.connection{margin-left:0}.field{flex:1 1 140px}.field.grow{flex-basis:100%}.summary{grid-template-columns:1fr 1fr}.summary-item:nth-child(2){border-right:0}.summary-item:nth-child(-n+2){border-bottom:1px solid var(--line)}.table-wrap{display:none}.mobile-list{display:block}.panel-note{display:none}.detail-table{grid-template-columns:90px 1fr}}
  </style>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/assets/css/site-brand.css">
<script src="/assets/js/site-brand.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <div id="main-content" style="display:none">
    <header class="system-header">
      <div class="system-header-inner">
        <div class="system-name">東京圏輸送情報システム</div>
        <div class="system-sub">列車在線情報</div>
        <nav class="system-nav" aria-label="主要メニュー">
          <a class="mobile-keep" href="train_grasp.html">運行把握</a>
          <a href="atosweb.html">ATOS Web</a>
          <a href="toppage.html">メインメニュー</a>
        </nav>
        <div class="clock"><span id="clock">--:--:--</span><small id="date">----/--/--</small></div>
      </div>
    </header>

    <main class="page" id="main">
      <div class="title-row">
        <h1>列車在線情報</h1>
        <span class="description">列車番号・在線位置・遅延状況</span>
        <div class="connection" role="status" aria-live="polite">
          <i class="connection-dot loading" id="connectionDot"></i>
          <span id="connectionText">データ取得中</span>
          <span id="updatedAt"></span>
        </div>
      </div>

      <div class="notice" id="errorNotice" role="alert"></div>

      <div class="toolbar" aria-label="表示条件">
        <div class="field grow">
          <label for="searchInput">検索</label>
          <input id="searchInput" type="search" placeholder="列車番号・駅名・行先" autocomplete="off">
        </div>
        <div class="field">
          <label for="lineSelector">線区</label>
          <select id="lineSelector"><option value="all">全線区</option></select>
        </div>
        <div class="field">
          <label for="directionSelector">方面</label>
          <select id="directionSelector">
            <option value="all">全方面</option>
            <option value="inbound">上り・内回り</option>
            <option value="outbound">下り・外回り</option>
            <option value="cardinal">東西・南北方向</option>
          </select>
        </div>
        <div class="field">
          <label for="delaySelector">状態</label>
          <select id="delaySelector">
            <option value="all">すべて</option>
            <option value="delay">遅延のみ</option>
            <option value="major">10分以上</option>
            <option value="normal">定刻のみ</option>
          </select>
        </div>
        <button class="btn" id="refreshButton" type="button">更新</button>
        <button class="btn secondary" id="resetButton" type="button">条件解除</button>
      </div>

      <section class="summary" aria-label="列車集計">
        <div class="summary-item"><div class="summary-label">取得列車</div><div class="summary-value"><span id="totalCount">–</span><small>本</small></div></div>
        <div class="summary-item"><div class="summary-label">表示列車</div><div class="summary-value"><span id="visibleCount">–</span><small>本</small></div></div>
        <div class="summary-item"><div class="summary-label">遅延列車</div><div class="summary-value warning"><span id="delayedCount">–</span><small>本</small></div></div>
        <div class="summary-item"><div class="summary-label">最大遅延</div><div class="summary-value danger"><span id="maxDelay">–</span><small>分</small></div></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>列車一覧</h2>
          <span class="panel-note" id="resultSummary">読み込み中</span>
          <div class="panel-actions">
            <button class="btn secondary" id="sortButton" type="button" aria-pressed="false">遅延順</button>
            <a class="btn secondary" href="train_grasp.html">広域路線図</a>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>列車番号</th><th>種別</th><th>線区</th><th>方面</th><th>行先</th><th>在線位置</th><th>両数</th><th>状態</th></tr></thead>
            <tbody id="trainBody"></tbody>
          </table>
        </div>
        <div class="mobile-list" id="mobileList"></div>
      </section>
      <footer class="footer">本画面は在線状況の確認を補助する参考表示です。実際の列車位置・時刻とは差が生じる場合があります。</footer>
    </main>

    <div class="modal-backdrop" id="modalBackdrop"></div>
    <section class="detail-dialog" id="detailDialog" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <div class="dialog-header"><h2 id="detailTitle">列車詳細</h2><button id="closeDialog" type="button">閉じる</button></div>
      <div class="dialog-body" id="detailBody"></div>
    </section>
  </div>

  <script>
  (() => {
    'use strict';
    const BASE='/api/odpt/challenge/';
    const LINES={
      'JR-East.Yamanote':'山手線','JR-East.ChuoRapid':'中央線快速','JR-East.KeihinTohokuNegishi':'京浜東北・根岸線',
      'JR-East.ChuoSobuLocal':'中央・総武線各駅停車','JR-East.SobuRapid':'総武快速線','JR-East.Yokosuka':'横須賀線',
      'JR-East.Tokaido':'東海道線','JR-East.ShonanShinjuku':'湘南新宿ライン','JR-East.SotetsuDirect':'相鉄線直通',
      'JR-East.SaikyoKawagoe':'埼京・川越線','JR-East.Kawagoe':'川越線','JR-East.Utsunomiya':'宇都宮線',
      'JR-East.Takasaki':'高崎線','JR-East.JobanRapid':'常磐線快速','JR-East.JobanLocal':'常磐線各駅停車',
      'JR-East.Joban':'常磐線','JR-East.Musashino':'武蔵野線','JR-East.Keiyo':'京葉線','JR-East.Yokohama':'横浜線',
      'JR-East.Nambu':'南武線','JR-East.Sagami':'相模線','JR-East.Ome':'青梅線','JR-East.Itsukaichi':'五日市線',
      'JR-East.Chuo':'中央本線','JR-East.Sotobo':'外房線','JR-East.Uchibo':'内房線','JR-East.Narita':'成田線',
      'JR-East.Sobu':'総武本線','JR-East.Nikko':'日光線','JR-East.Hachiko':'八高線'
    };
    const TYPES={Local:'普通',Rapid:'快速',SpecialRapid:'特別快速',ChuoSpecialRapid:'中央特快',OmeSpecialRapid:'青梅特快',CommuterRapid:'通勤快速',CommuterSpecialRapid:'通勤特快',LimitedExpress:'特急',Express:'急行',HolidayRapid:'ホリデー快速'};
    const FALLBACK={Tokyo:'東京',Ueno:'上野',Shinjuku:'新宿',Shibuya:'渋谷',Ikebukuro:'池袋',Shinagawa:'品川',Omiya:'大宮',Yokohama:'横浜',Ofuna:'大船',Odawara:'小田原',Atami:'熱海',Takasaki:'高崎',Utsunomiya:'宇都宮',Chiba:'千葉',Soga:'蘇我',Narita:'成田',Kawasaki:'川崎',Tachikawa:'立川',Hachioji:'八王子',Takao:'高尾',Kofu:'甲府',Matsumoto:'松本',Toride:'取手',Tsuchiura:'土浦',Mito:'水戸',Iwaki:'いわき'};
    const state={trains:[],visible:[],stationNames:new Map(),sortDelay:false,lastFocus:null};
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const token=value=>String(value||'').split(':').pop().split('.').pop();
    const railwayKey=value=>String(value||'').replace('odpt.Railway:','');
    const stationName=value=>{
      if(!value)return '—';
      return state.stationNames.get(value)||FALLBACK[token(value)]||'駅名情報取得中';
    };
    const lineName=value=>LINES[railwayKey(value)]||railwayKey(value).replace('JR-East.','');
    const typeName=value=>TYPES[token(value)]||token(value)||'普通';
    const directionName=value=>{
      const key=token(value);
      return {Inbound:'上り',Outbound:'下り',InnerLoop:'内回り',OuterLoop:'外回り',Northbound:'北行',Southbound:'南行',Eastbound:'東行',Westbound:'西行'}[key]||key||'—';
    };
    const directionGroup=value=>/Inbound|Inner/.test(String(value))?'inbound':/Outbound|Outer/.test(String(value))?'outbound':'cardinal';

    function normalize(raw,index){
      const from=stationName(raw['odpt:fromStation']),to=stationName(raw['odpt:toStation']);
      const destinationRaw=Array.isArray(raw['odpt:destinationStation'])?raw['odpt:destinationStation'][0]:raw['odpt:destinationStation'];
      const destination=stationName(destinationRaw);
      const delay=Math.max(0,Math.floor((Number(raw['odpt:delay'])||0)/60));
      return {
        id:raw['owl:sameAs']||`${raw['odpt:trainNumber']||'train'}-${index}`,raw,
        number:raw['odpt:trainNumber']||'番号なし',lineKey:railwayKey(raw['odpt:railway']),line:lineName(raw['odpt:railway']),
        type:typeName(raw['odpt:trainType']),direction:directionName(raw['odpt:railDirection']),directionGroup:directionGroup(raw['odpt:railDirection']),
        destination,from,to,position:raw['odpt:toStation']?`${from}－${to}`:from,delay,cars:raw['odpt:carComposition']||'—'
      };
    }
    function setSearchValue(train){train.search=[train.number,train.line,train.type,train.direction,train.destination,train.from,train.to].join(' ').toLowerCase();return train;}
    async function request(path){
      const response=await fetch(BASE+path,{headers:{Accept:'application/json'},cache:'no-store'});
      if(!response.ok)throw new Error(`HTTP ${response.status}`);
      return response.json();
    }
    function buildStationMap(stations){
      state.stationNames.clear();
      (Array.isArray(stations)?stations:[]).forEach(station=>{
        const id=station['owl:sameAs'];const title=station['odpt:stationTitle'];
        const ja=typeof title==='string'?title:title?.ja;
        if(id&&ja)state.stationNames.set(id,ja);
      });
    }
    async function hydrateMissingStations(rawTrains){
      const ids=[...new Set((Array.isArray(rawTrains)?rawTrains:[]).flatMap(train=>[
        train['odpt:fromStation'],train['odpt:toStation'],...(Array.isArray(train['odpt:destinationStation'])?train['odpt:destinationStation']:[train['odpt:destinationStation']])
      ]).filter(id=>id&&!state.stationNames.has(id)&&!FALLBACK[token(id)]))].slice(0,60);
      if(!ids.length)return;
      const results=await Promise.all(ids.map(id=>request(`odpt:Station?owl:sameAs=${encodeURIComponent(id)}`).catch(()=>[])));
      results.flat().forEach(station=>{
        const id=station['owl:sameAs'];const title=station['odpt:stationTitle'];const ja=typeof title==='string'?title:title?.ja;
        if(id&&ja)state.stationNames.set(id,ja);
      });
    }
    function populateLines(){
      const current=$('lineSelector').value;
      const lines=[...new Map(state.trains.map(train=>[train.lineKey,train.line])).entries()].sort((a,b)=>a[1].localeCompare(b[1],'ja'));
      $('lineSelector').innerHTML='<option value="all">全線区</option>'+lines.map(([key,name])=>`<option value="${esc(key)}">${esc(name)}</option>`).join('');
      if(lines.some(([key])=>key===current))$('lineSelector').value=current;
    }
    function status(train){return train.delay?`<span class="delay-text">${train.delay}分遅れ</span>`:'<span class="ontime-text">定刻</span>';}
    function applyFilters(){
      const query=$('searchInput').value.trim().toLowerCase(),line=$('lineSelector').value,direction=$('directionSelector').value,delay=$('delaySelector').value;
      state.visible=state.trains.filter(train=>
        (!query||train.search.includes(query))&&(line==='all'||train.lineKey===line)&&(direction==='all'||train.directionGroup===direction)&&
        (delay==='all'||(delay==='delay'&&train.delay>0)||(delay==='major'&&train.delay>=10)||(delay==='normal'&&train.delay===0))
      );
      if(state.sortDelay)state.visible.sort((a,b)=>b.delay-a.delay||a.number.localeCompare(b.number,'ja',{numeric:true}));
      render();
    }
    function render(){
      const rows=state.visible.slice(0,1000);
      $('trainBody').innerHTML=rows.length?rows.map(train=>`<tr tabindex="0" data-train-id="${esc(train.id)}"><td class="train-number">${esc(train.number)}</td><td><span class="train-type ${train.type.includes('特急')?'express':''}">${esc(train.type)}</span></td><td>${esc(train.line)}</td><td>${esc(train.direction)}</td><td>${esc(train.destination)}</td><td>${esc(train.position)}</td><td>${esc(train.cars)}${train.cars==='—'?'':'両'}</td><td>${status(train)}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">該当列車はありません。</td></tr>';
      $('mobileList').innerHTML=rows.length?rows.map(train=>`<article class="train-card" tabindex="0" role="button" data-train-id="${esc(train.id)}"><div class="train-card-head"><strong>${esc(train.number)}　${esc(train.type)}</strong>${status(train)}</div><p>${esc(train.line)}　${esc(train.direction)}</p><dl><dt>行先</dt><dd>${esc(train.destination)}</dd><dt>在線</dt><dd>${esc(train.position)}</dd></dl></article>`).join(''):'<div class="empty">該当列車はありません。</div>';
      $('totalCount').textContent=state.trains.length.toLocaleString('ja-JP');$('visibleCount').textContent=state.visible.length.toLocaleString('ja-JP');
      $('delayedCount').textContent=state.trains.filter(train=>train.delay>0).length.toLocaleString('ja-JP');$('maxDelay').textContent=Math.max(0,...state.trains.map(train=>train.delay));
      $('resultSummary').textContent=`${state.visible.length.toLocaleString('ja-JP')}本表示${state.visible.length>1000?'（先頭1,000本）':''}`;
    }
    function openDetail(id,trigger){
      const train=state.trains.find(item=>item.id===id);if(!train)return;state.lastFocus=trigger;
      $('detailTitle').textContent=`${train.number} 列車詳細`;
      $('detailBody').innerHTML=`<div class="detail-table"><div class="key">線区</div><div>${esc(train.line)}</div><div class="key">種別</div><div>${esc(train.type)}</div><div class="key">方面</div><div>${esc(train.direction)}</div><div class="key">行先</div><div>${esc(train.destination)}</div><div class="key">在線位置</div><div>${esc(train.position)}</div><div class="key">編成両数</div><div>${esc(train.cars)}${train.cars==='—'?'':'両'}</div><div class="key">運行状態</div><div>${train.delay?`${esc(train.delay)}分遅れ`:'定刻'}</div></div><div class="dialog-actions"><a class="btn" href="atosweb.html">ATOS Web</a><a class="btn secondary" href="train_grasp.html">広域路線図</a></div>`;
      $('modalBackdrop').classList.add('open');$('detailDialog').classList.add('open');$('closeDialog').focus();
    }
    function closeDetail(){$('modalBackdrop').classList.remove('open');$('detailDialog').classList.remove('open');state.lastFocus?.focus();}
    async function refresh(){
      $('refreshButton').disabled=true;$('connectionDot').className='connection-dot loading';$('connectionText').textContent='更新中';$('errorNotice').classList.remove('show');
      try{
        const [rawTrains,stations]=await Promise.all([
          request('odpt:Train?odpt:operator=odpt.Operator:JR-East'),
          request('odpt:Station?odpt:operator=odpt.Operator:JR-East').catch(()=>[])
        ]);
        buildStationMap(stations);await hydrateMissingStations(rawTrains);state.trains=(Array.isArray(rawTrains)?rawTrains:[]).map(normalize).map(setSearchValue);
        populateLines();applyFilters();$('connectionDot').className='connection-dot';$('connectionText').textContent='接続中';$('updatedAt').textContent=new Date().toLocaleTimeString('ja-JP')+'更新';
      }catch(error){
        console.error(error);$('connectionDot').className='connection-dot error';$('connectionText').textContent='取得エラー';$('errorNotice').textContent='在線データを取得できませんでした。';$('errorNotice').classList.add('show');render();
      }finally{$('refreshButton').disabled=false;}
    }
    let timer;$('searchInput').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(applyFilters,120);});
    ['lineSelector','directionSelector','delaySelector'].forEach(id=>$(id).addEventListener('change',applyFilters));
    $('refreshButton').addEventListener('click',refresh);
    $('resetButton').addEventListener('click',()=>{$('searchInput').value='';$('lineSelector').value='all';$('directionSelector').value='all';$('delaySelector').value='all';applyFilters();});
    $('sortButton').addEventListener('click',e=>{state.sortDelay=!state.sortDelay;e.currentTarget.setAttribute('aria-pressed',String(state.sortDelay));e.currentTarget.textContent=state.sortDelay?'配信順':'遅延順';applyFilters();});
    ['trainBody','mobileList'].forEach(id=>{
      $(id).addEventListener('click',e=>{const row=e.target.closest('[data-train-id]');if(row)openDetail(row.dataset.trainId,row);});
      $(id).addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){const row=e.target.closest('[data-train-id]');if(row){e.preventDefault();openDetail(row.dataset.trainId,row);}}});
    });
    $('closeDialog').addEventListener('click',closeDetail);$('modalBackdrop').addEventListener('click',closeDetail);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
    function tick(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('ja-JP');$('date').textContent=now.toLocaleDateString('ja-JP');}
    tick();setInterval(tick,1000);refresh();setInterval(refresh,60000);
  })();
  </script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="auth_guard.js"></script>
</body>
