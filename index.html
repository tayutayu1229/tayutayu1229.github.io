
<!DOCTYPE html>
<html lang="ja">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2192861187044284" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow" />
    <title>東京圏輸送情報システム ログインページ</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 16px;
            box-sizing: border-box;
        }
        .login-container {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 380px;
            max-width: 100%;
            box-sizing: border-box;
        }
        h2 {
            color: #01977a;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-bottom: 0.5rem;
            color: #333;
        }
        .input-group {
            position: relative;
            margin-bottom: 1rem;
        }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #01977a;
            box-shadow: 0 0 0 2px rgba(1, 151, 122, 0.2);
        }
        .error {
            border-color: #d32f2f !important;
        }
        input[type="submit"] {
            background-color: #01977a;
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        input[type="submit"]:hover {
            background-color: #017a64;
        }
        input[type="submit"]:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #error-message {
            color: #d32f2f;
            text-align: center;
            margin-top: 1rem;
            padding: 0.5rem;
            border-radius: 4px;
            background-color: #ffebee;
            display: none;
        }
        .success { /* パスワードリセット成功時のメッセージ用 */
            color: #01977a !important;
            background-color: #e8f8f5 !important;
        }
        .system-info {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #666;
        }
        .login-footer {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #888;
        }
        .login-footer a {
            color: #01977a;
            text-decoration: none;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }
        .loading::after {
            content: "...";
            animation: dots 1.5s steps(4, end) infinite;
        }
        @keyframes dots {
            0%, 20% { content: ""; }
            40% { content: "."; }
            60% { content: ".."; }
            80% { content: "..."; }
        }
        .link-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .link-group a {
            color: #01977a;
            text-decoration: none;
        }
        .password-row { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:.78rem; color:#555; }
        @media (max-width: 480px) {
            body { align-items: flex-start; padding: 10px; }
            .login-container { padding: 1.25rem; margin-top: 10px; }
            h2 { font-size: 1.25rem; }
        }
    </style>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="stylesheet" href="/assets/css/site-brand.css">
<script src="/assets/js/site-brand.js" defer></script>
</head>
<body>
    <div class="login-container">
        <div class="site-brand-hero" data-site-brand-host></div>
        <h2>東京圏輸送情報システム</h2>
        
        <form id="login-form">
            <div class="input-group">
                <label for="email">メールアドレス:</label>
                <input type="email" name="email" id="email" required autocomplete="email" placeholder="user@example.com">
            </div>
            <div class="input-group">
                <label for="password">パスワード:</label>
                <input type="password" name="password" id="password" required autocomplete="current-password">
                <label class="password-row"><input type="checkbox" id="show-password"> パスワードを表示</label>
            </div>
            <input type="submit" value="ログイン" id="login-button">
        </form>
        <p style="font-size:.72rem;line-height:1.55;color:#666">不正利用防止のため、ログイン日時・IPアドレス・端末識別情報を管理者向け履歴へ記録します。パスワードは履歴へ保存しません。</p>
        <div id="loading" class="loading">ログイン中</div>
        <p id="error-message"></p>
        
        <div class="link-group">
            <a href="register.html">新規ユーザー登録はこちら</a>
            <a href="#" id="reset-password-link">パスワードを忘れた場合</a>
        </div>
        <div class="system-info">
            <p>システムバージョン: 4.2.7</p>
            <p>最終更新日: 2026年7月30日</p>
        </div>
        <div class="login-footer">
            <p>&copy; 2025 N・H／yoshiシステム管理部門</p>
            <p>お問い合わせ: systemadmin@tayunet-traininfo.com</p>
            <a href="/recruit/Recruitment.html">運営者募集</a>
            <span aria-hidden="true"> ・ </span><a href="/privacy.html">プライバシーポリシー</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    
    <script src="login.js?v=2026.08.25.4"></script>
</body>
</html>
