<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>データ管理 - 東京圏輸送情報システム</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/assets/css/managed-db.css"></head>
<body><header><div><span class="eyebrow">東京圏輸送情報システム</span><h1>データ管理</h1></div><a href="/system_admin.html">運用管理へ戻る</a></header>
<main><section class="intro"><div><h2>3つのデータを、ひとつの場所で。</h2><p>Ubuntuに保存した輸送障害・旧会計・車両運用データを管理します。</p></div><span id="account" class="pill">ログイン確認中</span></section>
<div id="status" role="status">認証と利用権限を確認しています。</div>
<section id="workspace" hidden><div class="toolbar"><label>データの種類<select id="project"></select></label><label>一覧<select id="table"></select></label><button id="reload">最新に更新</button><button id="add" class="primary">新しく追加</button></div>
<div class="list-head"><div><h2 id="title">一覧</h2><p id="count"></p></div><label>表示中のデータを検索<input id="filter" type="search" placeholder="キーワード"></label></div><p id="note" class="note"></p>
<div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><p class="footnote">閲覧は内容を変更しません。編集・削除は管理者のみが行えます。時刻はデータに保存された値を表示します。</p></section></main>
<dialog id="editor"><form id="edit-form"><div class="dialog-head"><h2 id="edit-title">データを編集</h2><button type="button" id="close" aria-label="閉じる">×</button></div><p id="edit-error" role="alert"></p><div id="fields"></div><footer><button type="button" id="cancel">キャンセル</button><button type="submit" id="save" class="primary">保存する</button></footer></form></dialog>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><script src="/auth_guard.js"></script><script src="/assets/js/managed-db-client.js"></script><script src="/assets/js/managed-db-admin.js"></script></body></html>
